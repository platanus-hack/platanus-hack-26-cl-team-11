services:
  - type: web
    name: ronda
    runtime: node
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - design/tokens.css
        - design/ronda.css
        - design/faces/**
        - design/sources/**
        - design/grafo/**
        - design/contexto/**
        - design/logo/**
        - design/luz/**
        - package.json
        - package-lock.json
        - .nvmrc
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: montu-db
          property: connectionString

databases:
  - name: montu-db
    plan: free
    region: virginia
    databaseName: montu
    user: montu
