<style>
  /* Escenario de grabación: la pantalla de la sala, un teléfono y lo que hace el agente, lado a lado.
     Lo maneja tools/grabar/grabar.mjs. Dentro de los marcos corre el producto real. */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: clip; }
  .rd-page { width: 1920px; height: 1080px; min-height: 0; padding: 0; overflow: clip; }
  .escena { position: relative; width: 1920px; height: 1080px; box-sizing: border-box; padding: 12px 24px; display: grid; grid-template-columns: 1280px 1fr; grid-template-rows: 76px 24px 800px 108px; gap: 12px 24px; }
  .paso { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--rd-space-4); min-width: 0; }
  .paso .rd-chip { font-size: var(--rd-text-body); padding: 10px 18px; }
  .paso .rd-title { margin: 0; font-size: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rotulo { align-self: end; }
  .rotulo--telefono { justify-self: center; }
  .pantalla { width: 1280px; height: 800px; border-radius: var(--rd-radius-card); overflow: hidden; box-shadow: var(--rd-shadow-card); background: var(--rd-bg); }
  .pantalla iframe { display: block; width: 1440px; height: 900px; border: 0; transform: scale(0.88889); transform-origin: 0 0; }
  .telefono { justify-self: center; width: 406px; height: 800px; border: 8px solid var(--rd-glass-solid); border-radius: 44px; overflow: hidden; box-shadow: var(--rd-shadow-card); background: var(--rd-bg); }
  .telefono iframe { display: block; width: 390px; height: 784px; border: 0; }
  .telefono[data-apagado] iframe { visibility: hidden; }
  .registro { grid-column: 1 / -1; display: flex; flex-direction: column; justify-content: flex-end; gap: 0; padding: 12px 20px; border-radius: var(--rd-radius-card); overflow: hidden; font-family: var(--rd-font-mono); font-size: 14px; line-height: 21px; }
  .registro span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .registro .eco { color: var(--rd-muted); }
  .puntero { position: absolute; left: 960px; top: 540px; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--rd-ink); border: 3px solid var(--rd-glass-solid); box-sizing: border-box; opacity: 0; pointer-events: none; z-index: 20; transition: left .55s cubic-bezier(.3,.7,.2,1), top .55s cubic-bezier(.3,.7,.2,1), opacity .25s ease, transform .12s ease; }
  .puntero[data-visible] { opacity: .55; }
  .puntero[data-toca] { transform: scale(.62); opacity: .85; }
</style>
</head>
<body>
<div class="rd-page">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="escena">
    <header class="paso">
      <span class="rd-chip rd-glass" id="numero">Montu</span>
      <h1 class="rd-title" id="texto">El camino completo, de un QR a una propuesta</h1>
    </header>
    <span class="rd-label rotulo">Pantalla de la sala</span>
    <span class="rd-label rotulo rotulo--telefono" id="rotulo-telefono">Un teléfono</span>
    <section class="pantalla"><iframe id="sala" title="Pantalla de la sala" src="/"></iframe></section>
    <section class="telefono" id="marco-telefono" data-apagado><iframe id="telefono" title="Teléfono" allow="clipboard-read; clipboard-write"></iframe></section>
    <section class="registro rd-glass" id="registro" aria-label="Lo que hace el agente"></section>
    <div class="puntero" id="puntero"></div>
  </div>
</div>
<script>
  const MAX_LINEAS = 4;
  const puntero = document.getElementById('puntero');
  window.escena = {
    paso(numero, texto) {
      document.getElementById('numero').textContent = numero;
      document.getElementById('texto').textContent = texto;
    },
    rotuloTelefono(texto) { document.getElementById('rotulo-telefono').textContent = texto; },
    abrirTelefono(direccion) {
      document.getElementById('telefono').src = direccion;
      document.getElementById('marco-telefono').removeAttribute('data-apagado');
    },
    anotar(linea, eco) {
      const registro = document.getElementById('registro');
      const fila = document.createElement('span');
      fila.textContent = linea;
      if (eco) fila.className = 'eco';
      registro.append(fila);
      while (registro.children.length > MAX_LINEAS) registro.firstElementChild.remove();
    },
    apuntar(x, y) {
      puntero.style.left = x + 'px';
      puntero.style.top = y + 'px';
      puntero.setAttribute('data-visible', '');
    },
    tocar(activo) { puntero.toggleAttribute('data-toca', activo); },
    soltar() { puntero.removeAttribute('data-visible'); },
  };
</script>
</body>
</html>
