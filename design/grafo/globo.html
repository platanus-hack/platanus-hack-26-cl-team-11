<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ronda · globo de agentes</title>
<link rel="icon" href="../logo/ronda-mark.svg">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ronda.css">
<style>
  /* Página de trabajo del globo aprobado (21-nov). Fuente: globo.dc.html. */
  body { margin: 0; }
  .globo { position: relative; width: 1440px; height: 900px; margin: 0 auto; overflow: hidden; }
  .globo canvas { position: absolute; inset: 0; width: 1440px; height: 900px; display: block; }
  .globo .rd-hero { position: absolute; left: 44px; top: 104px; pointer-events: none; }
  .globo .rd-bar { position: absolute; left: 44px; right: 44px; top: 0; pointer-events: none; }
  .globo aside { position: absolute; right: 44px; top: 100px; width: 392px; display: flex; flex-direction: column; gap: 16px; }
  .globo .seg { display: flex; gap: 6px; align-self: flex-start; padding: 5px; border-radius: var(--rd-radius-pill); }
  .globo .seg .rd-button { flex: 0 0 auto; min-width: 64px; height: 40px; padding: 0 18px; background: transparent; color: var(--rd-ink); }
  .globo .seg .rd-button[aria-pressed="true"] { background: var(--rd-ink); color: var(--rd-on-ink); }
  .globo .legend { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .globo .ring { width: 14px; height: 14px; border-radius: 50%; padding: 2px; background: var(--rd-gradient); box-sizing: border-box; }
  .globo .ring i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--rd-bg); }
  .globo .member { display: flex; align-items: center; gap: 12px; }
  .globo .member .rd-face { width: 36px; height: 36px; background-size: cover; }
  .globo [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="rd-page"><div class="globo">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <canvas id="c" role="img" aria-label="Globo de agentes. Arrastra para girarlo; toca a una persona con aro para ver su grupo."></canvas>
  <header class="rd-bar">
    <span class="rd-brand"><img class="rd-mark" src="../logo/ronda-mark.svg" alt="">Ronda</span>
    <span class="rd-chip rd-chip--status rd-glass"><span class="rd-dot"></span>Viernes 8:45 · <span id="online">5 agentes en línea</span></span>
  </header>
  <h1 class="rd-hero">Tu mañana,<br><span class="rd-gradient-text">resuelta entre agentes.</span></h1>
  <aside>
    <div class="rd-card rd-glass">
      <span class="rd-label" id="people">Con 5 personas</span>
      <div class="rd-stat-row">
        <span class="rd-stat"><span id="pairs">10</span><span class="rd-stat__unit">pares</span></span>
        <span class="rd-stat-row__arrow">→</span>
        <span class="rd-stat"><span class="rd-gradient-text">1</span><span class="rd-stat__unit">decisión</span></span>
      </div>
      <span class="rd-note">Los agentes viven en O(n²). Tú vives en O(1).</span>
    </div>
    <div class="seg rd-glass" role="group" aria-label="Personas">
      <button type="button" class="rd-button" data-n="5">5</button>
      <button type="button" class="rd-button" data-n="10">10</button>
      <button type="button" class="rd-button" data-n="50">50</button>
      <button type="button" class="rd-button" data-n="300">300</button>
    </div>
    <div class="legend rd-note"><span class="ring"><i></i></span><span><span class="rd-label" id="groups">2 grupos negociando</span> · toca un aro para ver el grupo</span></div>
    <div class="rd-card rd-glass" id="focus" hidden>
      <span class="rd-label rd-gradient-text">Grupo negociando</span>
      <span class="rd-title" id="ftopic"></span>
      <div id="fmembers" class="rd-stack"></div>
      <span class="rd-note" id="fnote"></span>
      <div class="rd-actions"><button type="button" class="rd-button rd-button--quiet" id="fclose">Cerrar</button></div>
    </div>
  </aside>
</div></div>
<script>
class DCLogic { constructor(p) { this.props = p || {}; } setState(o) { Object.assign(this.state, o); sync(); } }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 5, auto: props.autoplay !== false, focus: null, groupCount: 2 };
    this.canvasRef = { current: null };
    this.SEQ = [5, 10, 50, 300];
    this.MAX = 300;
    this.ATLAS = '../faces/atlas/faces.png';
    this.ATLAS_BLUR = '../faces/atlas/faces-blur.png';
    this.TEAM_SRC = ['../faces/mati.png', '../faces/ian.png', '../faces/lian.png', '../faces/andres.png', '../faces/roberto.png'];
    var NAMES = ['Camila', 'Benjamín', 'Sofía', 'Matías', 'Valentina', 'Tomás', 'Isidora', 'Vicente', 'Florencia', 'Agustín', 'Josefa', 'Martín', 'Antonia', 'Joaquín', 'Catalina', 'Lucas', 'Fernanda', 'Diego', 'Trinidad', 'Maximiliano', 'Javiera', 'Cristóbal', 'Emilia', 'Felipe', 'Constanza', 'Ignacio', 'Amanda', 'Nicolás', 'Paz', 'Sebastián', 'Renata', 'Gaspar'];
    var team = [['Tú', 'Pide cobertura'], ['Ian', 'Tiene la cifra'], ['Lian', 'Hueco de 9:30 a 10:15'], ['Andrés', 'Plan B listo'], ['Roberto', 'En reuniones']];
    this.people = [];
    for (var i = 0; i < this.MAX; i++) this.people.push(i < 5 ? { name: team[i][0], status: team[i][1] } : { name: NAMES[(i * 7) % NAMES.length], tile: (i - 5) % 64 });
    this.TOPICS = ['Turno del sábado', 'Mover la reunión del lunes', 'Datos para el pitch', 'Bug de pagos', 'Quién lleva al cliente', 'Revisar el contrato', 'Almuerzo del equipo', 'Llaves de la oficina'];
    this.COLS = ['#1e9bff', '#7b61ff', '#e840d8', '#ff3b6b', '#ff8a1f'];
    this.groups = []; this.lastPhase = {};
    this.buildGroups(5);
  }

  componentDidMount() {
    var self = this;
    var load = function (s) { var im = new Image(); im.src = s; return im; };
    this.team = this.TEAM_SRC.map(load);
    this.atlas = load(this.ATLAS); this.atlasBlur = load(this.ATLAS_BLUR);
    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.cur = []; this.vis = [];
    for (var i = 0; i < this.MAX; i++) { this.cur.push(null); this.vis.push(0); }
    this.p = this.look(this.state.n);
    this.edgeFade = 1; this.dimK = 0;
    this.t0 = performance.now(); this.last = this.t0; this.lastStep = this.t0;
    this.uy = 0; this.up = 0; this.vy = 0; this.vp = 0; this.drag = null; this.hover = -1; this.mouse = null; this.idle = 0; this.turnTo = null;
    var cv = this.canvasRef.current;
    if (cv) {
      cv.style.cursor = 'grab'; cv.style.touchAction = 'none';
      var at = function (e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * 1440 / r.width, y: (e.clientY - r.top) * 900 / r.height }; };
      this.onDown = function (e) { var m = at(e); self.drag = { x: m.x, y: m.y, t: performance.now(), moved: 0 }; self.vy = 0; self.vp = 0; if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); };
      this.onMove = function (e) {
        var m = at(e); self.mouse = m;
        if (!self.drag) return;
        var now = performance.now(), dts = Math.max(0.008, (now - self.drag.t) / 1000);
        var dy = (m.x - self.drag.x) * 0.006, dp = (m.y - self.drag.y) * 0.006;
        self.drag.moved += Math.abs(m.x - self.drag.x) + Math.abs(m.y - self.drag.y);
        if (self.drag.moved > 5) { cv.style.cursor = 'grabbing'; self.uy += dy; self.up = Math.max(-0.9, Math.min(0.9, self.up + dp)); self.vy = dy / dts; self.vp = dp / dts; self.idle = 0; self.turnTo = null; }
        self.drag.x = m.x; self.drag.y = m.y; self.drag.t = now;
      };
      this.onUp = function (e) { var d = self.drag; self.drag = null; cv.style.cursor = 'grab'; if (d && d.moved <= 5) self.click(at(e)); };
      this.onLeave = function () { self.mouse = null; };
      cv.addEventListener('pointerdown', this.onDown);
      cv.addEventListener('pointermove', this.onMove);
      cv.addEventListener('pointerup', this.onUp);
      cv.addEventListener('pointercancel', this.onUp);
      cv.addEventListener('pointerleave', this.onLeave);
    }
    var loop = function (now) { self.frame(now); self.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    var cv = this.canvasRef.current;
    if (cv && this.onDown) { cv.removeEventListener('pointerdown', this.onDown); cv.removeEventListener('pointermove', this.onMove); cv.removeEventListener('pointerup', this.onUp); cv.removeEventListener('pointercancel', this.onUp); cv.removeEventListener('pointerleave', this.onLeave); }
  }

  setN(n, keepAuto) {
    if (n === this.state.n) { if (!keepAuto) this.setState({ auto: false }); return; }
    this.edgeFade = 0;
    this.lastStep = performance.now();
    this.buildGroups(n);
    this.turnTo = null;
    var s = { n: n, focus: null, groupCount: this.groups.length };
    if (!keepAuto) s.auto = false;
    this.setState(s);
  }

  look(n) {
    if (n <= 5) return { S: 285, lw: 1, ea: 0.18, faceR: 42, small: 42, mid: 34, dot: 34 };
    if (n <= 10) return { S: 255, lw: 1, ea: 0.2, faceR: 38, small: 26, mid: 22, dot: 20 };
    if (n <= 50) return { S: 255, lw: 0.6, ea: 0.13, faceR: 34, small: 22, mid: 15, dot: 11 };
    return { S: 255, lw: 0.4, ea: 0.075, faceR: 32, small: 20, mid: 11, dot: 6.5 };
  }

  norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }

  target(i, n) {
    if (i === 0) return this.norm([0, 0.5, 0.86]);
    if (n <= 5) {
      var a = -Math.PI / 2 + (2 * Math.PI * i) / n, r = 0.78;
      return this.norm([r * Math.cos(a) * 1.18, -r * Math.sin(a) * 0.82 - 0.05, Math.sqrt(Math.max(0.05, 1 - r * r))]);
    }
    if (i === 1) return this.norm([0.62, 0.02, 0.78]);
    if (i === 2) return this.norm([0.3, -0.56, 0.77]);
    if (i === 3) return this.norm([-0.62, -0.18, 0.76]);
    if (i === 4) return this.norm([-0.4, -0.6, 0.68]);
    if (n <= 10) return this.norm([[-0.84, 0.42, 0.36], [0.8, 0.56, -0.1], [0.06, -0.96, 0.28], [-0.88, -0.2, -0.4], [0.45, 0.35, -0.82]][i - 5]);
    var g = Math.PI * (3 - Math.sqrt(5)), k = i - 5, m = n - 5;
    var y = 1 - 2 * (k + 0.5) / m, rr = Math.sqrt(1 - y * y), th = k * g + 0.7;
    return [rr * Math.cos(th), y, rr * Math.sin(th)];
  }

  buildGroups(n) {
    var gs = [{ id: 'mia', mine: true, members: [0, 1, 2], edges: [[0, 1, '¿Quién cubre las 11?'], [1, 2, 'Review antes de las 10:30']], topic: 'Cubrir la reunión de las 11', offset: 0 }];
    gs.push({ id: 'planb', members: [3, 4], edges: [[3, 4]], topic: 'Plan B para el cliente', offset: 4.5 });
    var extra = n <= 5 ? 0 : n <= 10 ? 1 : n <= 50 ? 4 : 8;
    for (var e = 0; e < extra; e++) gs.push({ id: 'g' + e, seed: e, size: [3, 2, 4, 3, 2, 3, 4, 2][e], topic: this.TOPICS[e], offset: 1.6 * e + 2.2 });
    this.groups = gs;
    if (n === 10) { gs[2].members = [5, 8]; gs[2].edges = [[5, 8]]; gs[2].fixed = true; }
    for (var j = 2; j < gs.length; j++) if (!gs[j].fixed) this.pickMembers(gs[j], n, Math.floor((this.nowT || 0) / 13));
  }

  pickMembers(g, n, cycle) {
    var used = {}, self = this, near = function (i) { for (var tq = 0; tq < 5; tq++) { var a = self.target(tq, n), b = self.target(i, n); if ((a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1]) + (a[2] - b[2]) * (a[2] - b[2]) < 0.3) return true; } return false; };
    for (var nn = 5; nn < n; nn++) if (near(nn)) used[nn] = 1;
    this.groups.forEach(function (o) { if (o !== g && o.members) o.members.forEach(function (m) { used[m] = 1; }); });
    var elig = [];
    for (var ei = 5; ei < n; ei++) if (!used[ei] && this.target(ei, n)[2] > 0.32) elig.push(ei);
    if (!elig.length) for (var ej = 5; ej < n; ej++) if (!used[ej]) elig.push(ej);
    var start = elig[Math.floor((((g.seed + 1) * 0.618 + cycle * 0.377) % 1) * elig.length)];
    var c = this.target(start, n), cand = [];
    for (var i = 5; i < n; i++) {
      if (i === start || used[i]) continue;
      var t = this.target(i, n);
      cand.push([i, (t[0] - c[0]) * (t[0] - c[0]) + (t[1] - c[1]) * (t[1] - c[1]) + (t[2] - c[2]) * (t[2] - c[2])]);
    }
    cand.sort(function (a, b) { return a[1] - b[1]; });
    var step = n > 50 ? 3 : 1, mem = [start];
    for (var k = 0; k < g.size - 1; k++) { var pick = cand[k * step] || cand[k]; if (pick) mem.push(pick[0]); }
    g.members = mem;
    g.edges = mem.slice(1).map(function (m) { return [mem[0], m]; });
    g.cycle = cycle;
  }

  phase(g, t) {
    if (g.mine || this.state.focus === g.id) return { draw: 1, live: 1, agree: 0, alpha: 1 };
    if (this.reduced) return { draw: 1, live: 1, agree: 0, alpha: 1 };
    var P = 13, tt = t + g.offset, local = tt % P, cycle = Math.floor(tt / P);
    if (g.seed !== undefined && !g.fixed && g.cycle !== cycle) this.pickMembers(g, this.state.n, cycle);
    if (local < 1.4) { var u = local / 1.4; return { draw: 1 - Math.pow(1 - u, 3), live: 0, agree: 0, alpha: 1 }; }
    if (local < 9.5) return { draw: 1, live: 1, agree: 0, alpha: 1 };
    if (local < 11.5) { var a = (local - 9.5) / 2; return { draw: 1, live: 0, agree: a, alpha: 1 - Math.max(0, (a - 0.35) / 0.65) }; }
    return { draw: 0, live: 0, agree: 0, alpha: 0 };
  }

  click(m) {
    var h = this.hit(m);
    if (h >= 0) {
      for (var i = 0; i < this.groups.length; i++) {
        var g = this.groups[i];
        if (g.members && g.members.indexOf(h) >= 0 && (this.lastPhase[g.id] || 0) > 0.5) { this.focusGroup(g); return; }
      }
    }
    this.turnTo = null;
    if (this.state.focus) this.setState({ focus: null });
  }

  focusGroup(g) {
    var c = [0, 0, 0], self = this;
    g.members.forEach(function (m) { var v = self.cur[m] || self.target(m, self.state.n); c[0] += v[0]; c[1] += v[1]; c[2] += v[2]; });
    c = this.norm(c);
    var big = this.state.n > 5;
    if (big) this.turnTo = { uy: -Math.atan2(c[0], c[2]) - 0.12, up: Math.atan2(c[1], Math.hypot(c[0], c[2])) - 0.28 };
    this.vy = 0; this.vp = 0; this.idle = 0;
    this.setState({ focus: g.id, auto: false });
  }

  hit(m) {
    if (!this.P) return -1;
    var best = Infinity, id = -1;
    for (var h = 0; h < this.P.length; h++) {
      var q = this.P[h]; if (!q || this.vis[h] < 0.5 || q.z < -0.05) continue;
      var dx = q.x - m.x, dy = q.y - m.y, d2 = dx * dx + dy * dy, lim = Math.max(12, (q.r || 6) + 4);
      if (d2 < lim * lim && d2 < best) { best = d2; id = h; }
    }
    return id;
  }

  grad(ctx, x0, y0, x1, y1) {
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    this.COLS.forEach(function (col, j) { g.addColorStop(j / 4, col); });
    return g;
  }

  frame(now) {
    var cv = this.canvasRef.current; if (!cv) return;
    var dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    var t = this.reduced ? 0 : (now - this.t0) / 1000; this.nowT = t;
    var n = this.state.n, self = this;

    if (this.state.auto && !this.reduced && !this.state.focus) {
      var hold = n === 300 ? 10000 : n === 5 ? 6000 : 4500;
      if (now - this.lastStep > hold) { var idx = this.SEQ.indexOf(n); this.setN(this.SEQ[(idx + 1) % this.SEQ.length], true); n = this.state.n; }
    }

    var dpr = Math.min(2, window.devicePixelRatio || 1), W = 1440, H = 900;
    if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var k = this.reduced ? 1 : 1 - Math.exp(-dt * 3.2);
    var tg = this.look(n), p = this.p;
    for (var key in tg) p[key] += (tg[key] - p[key]) * k;
    this.edgeFade += (1 - this.edgeFade) * (this.reduced ? 1 : 1 - Math.exp(-dt * 1.6));
    var focusing = !!this.state.focus;
    this.dimK += ((focusing ? 1 : 0) - this.dimK) * (this.reduced ? 1 : 1 - Math.exp(-dt * 5));

    for (var i = 0; i < this.MAX; i++) {
      if (i < n) {
        var tp = this.target(i, n);
        if (!this.cur[i]) this.cur[i] = tp.slice();
        var c0 = this.cur[i];
        this.cur[i] = this.norm([c0[0] + (tp[0] - c0[0]) * k, c0[1] + (tp[1] - c0[1]) * k, c0[2] + (tp[2] - c0[2]) * k]);
        this.vis[i] += (1 - this.vis[i]) * (this.reduced ? 1 : 1 - Math.exp(-dt * 2.4));
      } else this.vis[i] += (0 - this.vis[i]) * (this.reduced ? 1 : 1 - Math.exp(-dt * 4));
    }

    var big = n > 5;
    var swayY = Math.sin(t * 0.16) * (big ? 0.42 : 0.2), swayP = Math.sin(t * 0.11) * 0.05;
    if (this.turnTo && !this.drag) {
      var kt = this.reduced ? 1 : 1 - Math.exp(-dt * 3);
      this.uy += (this.turnTo.uy - swayY - this.uy) * kt; this.up += (this.turnTo.up - swayP - this.up) * kt; this.idle = 0;
    } else if (!this.drag) {
      this.uy += this.vy * dt; this.up = Math.max(-0.9, Math.min(0.9, this.up + this.vp * dt));
      var fr = Math.exp(-dt * 2.2); this.vy *= fr; this.vp *= fr;
      this.idle += dt;
      if (this.idle > 4 && !focusing) { var back = 1 - Math.exp(-dt * 0.8); this.uy -= this.uy * back; this.up -= this.up * back; }
    }
    if (!big) { this.uy = Math.max(-0.7, Math.min(0.7, this.uy)); this.up = Math.max(-0.5, Math.min(0.5, this.up)); }
    var yaw = swayY + (big ? 0.12 : 0) + this.uy, pitch = 0.1 + swayP + this.up;
    var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    var CX = 590, CY = 545, D = 3.4, S = p.S;
    function rot(v) { var x = v[0] * cy + v[2] * sy, z = -v[0] * sy + v[2] * cy; return [x, v[1] * cp - z * sp, v[1] * sp + z * cp]; }
    function proj(v) { var f = D / (D - v[2]); return { x: CX + v[0] * S * f, y: CY - v[1] * S * f, z: v[2], f: f }; }

    var count = 0;
    for (var a0 = 0; a0 < this.MAX; a0++) if (this.vis[a0] > 0.02) count = a0 + 1;
    var P = [], R = [];
    for (var q = 0; q < count; q++) { R[q] = rot(this.cur[q] || [0, 0, 1]); P[q] = proj(R[q]); }

    var phases = {}, member = {}, focusSet = {};
    for (var gi = 0; gi < this.groups.length; gi++) {
      var G = this.groups[gi], ph = this.phase(G, t); phases[G.id] = ph; this.lastPhase[G.id] = ph.alpha * ph.draw;
      G.members.forEach(function (m) { if (m < n && ph.alpha * ph.draw > 0.05) member[m] = Math.max(member[m] || 0, ph.alpha * ph.draw); });
      if (this.state.focus === G.id) G.members.forEach(function (m) { focusSet[m] = 1; });
    }
    var liveKey = {};
    this.groups.forEach(function (G) { G.edges.forEach(function (e) { liveKey[Math.min(e[0], e[1]) + '-' + Math.max(e[0], e[1])] = 1; }); });

    var radius = function (id) {
      var base;
      if (n <= 5) base = id <= 2 ? p.faceR : p.mid;
      else if (id === 0) base = p.faceR;
      else if (id <= 2) base = p.small;
      else if (focusSet[id]) base = Math.max(p.mid * 1.45, 15);
      else if (member[id]) base = p.mid;
      else base = id < 5 && n <= 10 ? p.mid : p.dot;
      var edgeOn = n > 10 && id >= 5 ? 0.45 + 0.55 * Math.min(1, Math.abs(P[id].z) * 1.6) : 1;
      return base * P[id].f * (0.82 + 0.18 * (P[id].z + 1) / 2) * edgeOn * self.vis[id];
    };
    for (var rq = 0; rq < count; rq++) P[rq].r = radius(rq);
    this.P = P;

    this.hover = (this.mouse && !this.drag) ? this.hit(this.mouse) : -1;
    if (!this.drag) cv.style.cursor = this.hover >= 0 ? 'pointer' : 'grab';

    function ctrl(a, b) {
      var va = R[a], vb = R[b];
      var d = Math.hypot(va[0] - vb[0], va[1] - vb[1], va[2] - vb[2]);
      var sx = (va[0] + vb[0]) / 2, syy = (va[1] + vb[1]) / 2, sz = (va[2] + vb[2]) / 2;
      var L = Math.hypot(sx, syy, sz), lift = L > 0.45 ? (1 + 0.05 * d) / L : 1;
      var pm = proj([sx * lift, syy * lift, sz * lift]);
      return { x: 2 * pm.x - (P[a].x + P[b].x) / 2, y: 2 * pm.y - (P[a].y + P[b].y) / 2, z: (va[2] + vb[2]) / 2 };
    }

    var dim = 1 - 0.65 * this.dimK;
    var buckets = [new Path2D(), new Path2D(), new Path2D()];
    for (var a = 0; a < count; a++) {
      if (this.vis[a] < 0.5) continue;
      for (var b = a + 1; b < count; b++) {
        if (this.vis[b] < 0.5 || liveKey[a + '-' + b]) continue;
        var cc = ctrl(a, b), bi = cc.z > 0.25 ? 0 : cc.z > -0.1 ? 1 : 2;
        buckets[bi].moveTo(P[a].x, P[a].y); buckets[bi].quadraticCurveTo(cc.x, cc.y, P[b].x, P[b].y);
      }
    }
    var mult = [1, 0.55, 0.22];
    var edgeStroke = function (bb) { ctx.lineCap = 'round'; ctx.lineWidth = p.lw; ctx.strokeStyle = 'rgba(70,70,150,' + (p.ea * mult[bb] * self.edgeFade * dim).toFixed(4) + ')'; ctx.stroke(buckets[bb]); };

    var order = [];
    for (var o = 0; o < count; o++) if (this.vis[o] > 0.01) order.push(o);
    order.sort(function (x, y) { return P[x].z - P[y].z; });

    var drawFace = function (id) {
      var pp = P[id], r = pp.r;
      if (r < 0.6) return;
      var depth = (pp.z + 1) / 2, back = pp.z < -0.05;
      var a = (back ? 0.35 + 0.4 * depth : 1) * self.vis[id];
      if (self.dimK > 0.01 && !focusSet[id] && id !== 0) a *= 1 - 0.7 * self.dimK;
      ctx.globalAlpha = a;
      if (r > 5 && !back) {
        ctx.save(); ctx.shadowColor = 'rgba(40,30,90,0.16)'; ctx.shadowBlur = Math.min(24, r * 0.7); ctx.shadowOffsetY = Math.min(10, r * 0.28);
        ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.beginPath(); ctx.arc(pp.x, pp.y, r + (r > 14 ? 3 : 1.5), 0, 6.2832); ctx.fill(); ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,' + (back ? 0.5 : 0.9) + ')'; ctx.beginPath(); ctx.arc(pp.x, pp.y, r + 1.2, 0, 6.2832); ctx.fill();
      }
      ctx.save(); ctx.beginPath(); ctx.arc(pp.x, pp.y, r, 0, 6.2832); ctx.clip();
      if (id < 5) {
        var im = self.team[id];
        if (im.complete && im.naturalWidth) { if (back) ctx.filter = 'blur(' + Math.max(1, r * 0.12).toFixed(1) + 'px)'; ctx.drawImage(im, pp.x - r, pp.y - r, r * 2, r * 2); }
      } else {
        var atl = back ? self.atlasBlur : self.atlas, tile = self.people[id].tile;
        if (atl.complete && atl.naturalWidth) ctx.drawImage(atl, (tile % 8) * 128 + 4, Math.floor(tile / 8) * 128 + 4, 120, 120, pp.x - r, pp.y - r, r * 2, r * 2);
      }
      ctx.restore();
      if (member[id] && !back) {
        ctx.globalAlpha = a * member[id]; ctx.strokeStyle = self.grad(ctx, pp.x - r, pp.y - r, pp.x + r, pp.y + r); ctx.lineWidth = r > 14 ? 2.5 : 1.6;
        ctx.beginPath(); ctx.arc(pp.x, pp.y, r + (r > 14 ? 5 : 3), 0, 6.2832); ctx.stroke();
      }
      if (id === self.hover) { ctx.globalAlpha = 1; ctx.strokeStyle = '#1d1d1f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pp.x, pp.y, r + (member[id] ? 9 : 4), 0, 6.2832); ctx.stroke(); }
      ctx.globalAlpha = 1;
    };

    edgeStroke(2);
    for (var oi = 0; oi < order.length; oi++) if (P[order[oi]].z < -0.05) drawFace(order[oi]);

    if (big) {
      var sr = S * 1.06, sw = t * 0.07;
      ctx.fillStyle = 'rgba(247,247,250,0.32)'; ctx.beginPath(); ctx.arc(CX, CY, sr, 0, 6.2832); ctx.fill();
      var hx = CX + Math.cos(2.4 + Math.sin(sw) * 0.5) * sr * 0.5, hy = CY - sr * 0.42 + Math.sin(sw * 1.3) * sr * 0.06;
      var hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, sr * 1.2);
      hg.addColorStop(0, 'rgba(255,255,255,0.55)'); hg.addColorStop(0.4, 'rgba(255,255,255,0.12)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(CX, CY, sr, 0, 6.2832); ctx.fill();
      var rim = ctx.createRadialGradient(CX, CY, sr * 0.86, CX, CY, sr);
      rim.addColorStop(0, 'rgba(255,255,255,0)'); rim.addColorStop(1, 'rgba(255,255,255,0.5)');
      ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(CX, CY, sr, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(CX, CY, sr, 0, 6.2832); ctx.stroke();
    }

    edgeStroke(1); edgeStroke(0);

    if (this.hover >= 0) {
      var hp = new Path2D(), hb = new Path2D(), H0 = this.hover;
      for (var e2 = 0; e2 < count; e2++) {
        if (e2 === H0 || this.vis[e2] < 0.5 || liveKey[Math.min(e2, H0) + '-' + Math.max(e2, H0)]) continue;
        var ce = ctrl(H0, e2), into = ce.z > -0.1 ? hp : hb;
        into.moveTo(P[H0].x, P[H0].y); into.quadraticCurveTo(ce.x, ce.y, P[e2].x, P[e2].y);
      }
      var ha = n > 50 ? 0.22 : n > 10 ? 0.3 : 0.4;
      ctx.lineWidth = n > 50 ? 0.7 : 1;
      ctx.strokeStyle = 'rgba(70,70,150,' + (ha * 0.25) + ')'; ctx.stroke(hb);
      ctx.strokeStyle = 'rgba(70,70,150,' + ha + ')'; ctx.stroke(hp);
    }

    var chips = [], pulses = [];
    for (var g2 = 0; g2 < this.groups.length; g2++) {
      var Gr = this.groups[g2], ph2 = phases[Gr.id];
      if (ph2.alpha * ph2.draw < 0.01) continue;
      var isFocus = this.state.focus === Gr.id;
      var gAlpha = ph2.alpha * (this.dimK > 0.01 && !isFocus && !Gr.mine ? 1 - 0.75 * this.dimK : 1);
      var thin = !Gr.mine && !isFocus;
      for (var ei = 0; ei < Gr.edges.length; ei++) {
        var A = Gr.edges[ei][0], B = Gr.edges[ei][1];
        if (A >= count || B >= count || this.vis[A] < 0.3 || this.vis[B] < 0.3) continue;
        var c2 = ctrl(A, B), pa = P[A], pb = P[B], u = ph2.draw;
        var qx = (1 - u) * pa.x + u * c2.x, qy = (1 - u) * pa.y + u * c2.y;
        var ex = (1 - u) * (1 - u) * pa.x + 2 * (1 - u) * u * c2.x + u * u * pb.x, ey = (1 - u) * (1 - u) * pa.y + 2 * (1 - u) * u * c2.y + u * u * pb.y;
        var path = new Path2D(); path.moveTo(pa.x, pa.y); path.quadraticCurveTo(qx, qy, ex, ey);
        var depthK = c2.z < -0.2 ? 0.4 : 1;
        var grd = this.grad(ctx, pa.x, pa.y, pb.x, pb.y);
        ctx.save(); ctx.globalAlpha = 0.32 * gAlpha * depthK; ctx.filter = 'blur(' + (thin ? 5 : 7) + 'px)'; ctx.strokeStyle = grd; ctx.lineWidth = thin ? 8 : 12; ctx.lineCap = 'round'; ctx.stroke(path); ctx.restore();
        ctx.globalAlpha = gAlpha * depthK; ctx.lineCap = 'round';
        if (ph2.agree > 0) { ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * Math.sin(Math.min(1, ph2.agree * 2) * Math.PI)).toFixed(3) + ')'; ctx.lineWidth = thin ? 4.5 : 6; ctx.stroke(path); }
        ctx.strokeStyle = grd; ctx.lineWidth = thin ? 2.2 : 3.5; ctx.stroke(path);
        if (u > 0 && u < 1) { ctx.save(); ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#b36bff'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(ex, ey, 3, 0, 6.2832); ctx.fill(); ctx.restore(); }
        if (ph2.live && !this.reduced) {
          for (var s = 0; s < 7; s++) {
            var su = ((t * (thin ? 0.33 : 0.42) + ei * 0.5 + g2 * 0.21) % 1) - s * 0.018; if (su < 0) continue;
            var x = (1 - su) * (1 - su) * pa.x + 2 * (1 - su) * su * c2.x + su * su * pb.x, y = (1 - su) * (1 - su) * pa.y + 2 * (1 - su) * su * c2.y + su * su * pb.y;
            ctx.globalAlpha = gAlpha * depthK * (s === 0 ? 1 : 0.55 * (1 - s / 7)); ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(x, y, (s === 0 ? 2.6 : 2 - s * 0.2) * (thin ? 0.85 : 1), 0, 6.2832); ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
        if (Gr.edges[ei][2] && u > 0.95) chips.push([Gr.edges[ei][2], 0.25 * pa.x + 0.5 * c2.x + 0.25 * pb.x, 0.25 * pa.y + 0.5 * c2.y + 0.25 * pb.y, gAlpha]);
      }
      if (ph2.agree > 0 || (isFocus && !Gr.mine)) {
        var mx = 0, my = 0, cnt = 0, top = Infinity;
        Gr.members.forEach(function (m) { if (m < count) { mx += P[m].x; my += P[m].y; cnt++; top = Math.min(top, P[m].y - P[m].r); } });
        if (cnt) {
          mx /= cnt; my /= cnt;
          if (ph2.agree > 0) pulses.push([mx, my, ph2.agree]);
          if (isFocus && !Gr.mine) chips.push([Gr.topic, mx, top - 28, 1]);
        }
      }
    }

    pulses.forEach(function (pl) {
      var u2 = pl[2], rr2 = 10 + u2 * 70;
      ctx.globalAlpha = (1 - u2) * 0.8; ctx.strokeStyle = self.grad(ctx, pl[0] - rr2, pl[1], pl[0] + rr2, pl[1]); ctx.lineWidth = 2 * (1 - u2) + 0.5;
      ctx.beginPath(); ctx.arc(pl[0], pl[1], rr2, 0, 6.2832); ctx.stroke();
      for (var sp2 = 0; sp2 < 8; sp2++) {
        var ang = sp2 * 0.785 + u2, d0 = 12 + u2 * 46;
        ctx.globalAlpha = (1 - u2) * 0.9; ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(pl[0] + Math.cos(ang) * d0, pl[1] + Math.sin(ang) * d0, 1.8 * (1 - u2) + 0.4, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    });

    for (var fi = 0; fi < order.length; fi++) if (P[order[fi]].z >= -0.05) drawFace(order[fi]);

    for (var li = 0; li < order.length; li++) {
      var id2 = order[li], fp = P[id2]; if (fp.z < -0.05 || fp.r < 2) continue;
      if (!(n <= 10 || id2 <= 2 || focusSet[id2])) continue;
      var la = this.vis[id2] * (this.dimK > 0.01 && !focusSet[id2] && id2 !== 0 ? 1 - 0.7 * this.dimK : 1);
      ctx.globalAlpha = la; ctx.fillStyle = '#1d1d1f'; ctx.textBaseline = 'alphabetic';
      ctx.shadowColor = 'rgba(247,247,250,0.95)'; ctx.shadowBlur = 8;
      var person = this.people[id2], R0 = fp.r;
      ctx.font = '600 ' + (n <= 5 || id2 <= 2 ? 16 : 13) + 'px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
      if (id2 === 0) {
        ctx.textAlign = 'center';
        ctx.fillText(person.name, fp.x, fp.y - R0 - 34);
        ctx.fillStyle = '#6e6e73'; ctx.font = '400 13px -apple-system, system-ui, sans-serif'; ctx.fillText(person.status, fp.x, fp.y - R0 - 15);
      } else {
        var right = fp.x >= CX, gap = R0 + (member[id2] ? 14 : 10), lx = right ? fp.x + gap : fp.x - gap;
        ctx.textAlign = right ? 'left' : 'right';
        if (n <= 5) {
          ctx.fillText(person.name, lx, fp.y - 2);
          ctx.fillStyle = '#6e6e73'; ctx.font = '400 13px -apple-system, system-ui, sans-serif'; ctx.fillText(person.status, lx, fp.y + 17);
        } else { ctx.textBaseline = 'middle'; ctx.fillText(person.name, lx, fp.y); ctx.textBaseline = 'alphabetic'; }
      }

    chips.forEach(function (c) { ctx.globalAlpha = c[3]; self.chip(ctx, c[0], c[1], c[2]); ctx.globalAlpha = 1; });

    if (this.hover >= 0 && count > 1) {
      var hv = P[this.hover], conv = (n - 1).toLocaleString('es-CL') + (n - 1 === 1 ? ' conversación posible' : ' conversaciones posibles');
      this.chip(ctx, this.people[this.hover].name + ' · ' + conv, hv.x, hv.y + hv.r + 26);
    }
  }

  chip(ctx, text, x, y) {
    ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
    var w = ctx.measureText(text).width + 26, h = 30, a = ctx.globalAlpha;
    ctx.save();
    ctx.shadowColor = 'rgba(40,30,90,0.10)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 15); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 15); ctx.stroke();
    ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 0.5);
    ctx.textBaseline = 'alphabetic';
  }

  faceStyle(id) {
    var base = { display: 'block', width: '36px', height: '36px', borderRadius: '50%', flex: '0 0 auto', boxShadow: '0 0 0 2px rgba(255,255,255,0.95), 0 6px 14px rgba(40,30,90,0.14)' };
    if (id < 5) return Object.assign(base, { backgroundImage: 'url(' + this.TEAM_SRC[id] + ')', backgroundSize: 'cover' });
    var tile = this.people[id].tile;
    return Object.assign(base, { backgroundImage: 'url(' + this.ATLAS + ')', backgroundSize: '800% 800%', backgroundPosition: ((tile % 8) * 100 / 7) + '% ' + (Math.floor(tile / 8) * 100 / 7) + '%' });
  }

  renderVals() {
    var self = this, n = this.state.n, fmt = function (v) { return v.toLocaleString('es-CL'); };
    var focus = null;
    if (this.state.focus) {
      var g = this.groups.filter(function (x) { return x.id === self.state.focus; })[0];
      if (g) focus = {
        topic: g.topic,
        members: g.members.map(function (m, i) { return { name: self.people[m].name, role: i === 0 ? 'Pide ayuda' : 'Puede ayudar', face: self.faceStyle(m) }; }),
        note: g.members.length + ' agentes, ' + (g.members.length * (g.members.length - 1) / 2) + (g.members.length === 2 ? ' conversación' : ' conversaciones') + '. Nadie más se entera.'
      };
    }
    var gc = this.state.groupCount;
    return {
      canvasRef: this.canvasRef,
      n: fmt(n),
      pairs: fmt(n * (n - 1) / 2),
      onlineLabel: fmt(n) + ' agentes en línea',
      groupsLabel: gc + (gc === 1 ? ' grupo negociando' : ' grupos negociando'),
      hasFocus: !!focus,
      focus: focus || { topic: '', members: [], note: '' },
      clearFocus: function () { self.turnTo = null; self.setState({ focus: null }); },
      options: this.SEQ.map(function (v) {
        var on = v === n;
        return {
          label: fmt(v),
          pressed: on ? 'true' : 'false',
          style: on ? { background: '#1d1d1f', color: '#ffffff' } : { background: 'transparent', color: '#1d1d1f' },
          pick: function () { self.setN(v, false); }

      })
    };
  }
}

const q = new URLSearchParams(location.search);
const g = new Component({ autoplay: !q.has('n') });
g.canvasRef.current = document.getElementById('c');
function sync() {
  const v = g.renderVals ? g.renderVals() : null; if (!v) return;
  document.getElementById('people').textContent = 'Con ' + v.n + ' personas';
  document.getElementById('pairs').textContent = v.pairs;
  document.getElementById('online').textContent = v.onlineLabel;
  document.getElementById('groups').textContent = v.groupsLabel;
  document.querySelectorAll('[data-n]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === g.state.n ? 'true' : 'false'));
  const box = document.getElementById('focus'); box.hidden = !v.hasFocus;
  document.getElementById('ftopic').textContent = v.focus.topic;
  document.getElementById('fnote').textContent = v.focus.note;
  const list = document.getElementById('fmembers'); list.replaceChildren();
  v.focus.members.forEach(m => {
    const row = document.createElement('div'); row.className = 'member';
    const face = document.createElement('span'); face.className = 'rd-face'; Object.assign(face.style, m.face);
    const who = document.createElement('span'); who.className = 'rd-person';
    who.innerHTML = '<span class="rd-person__name"></span><span class="rd-person__status"></span>';
    who.children[0].textContent = m.name; who.children[1].textContent = m.role;
    row.append(face, who); list.append(row);
  });
}
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => g.setN(+b.dataset.n, false)));
document.getElementById('fclose').addEventListener('click', () => { g.turnTo = null; g.setState({ focus: null }); });
if (q.has('n')) g.setN(+q.get('n'), false);
g.componentDidMount();
if (q.has('still')) { g.vis = g.vis.map((x, i) => i < g.state.n ? 1 : 0); g.p = g.look(g.state.n); g.edgeFade = 1; }
sync();
</script>
