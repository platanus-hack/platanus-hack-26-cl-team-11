    <div class="rd-card rd-glass">

<script>
class DCLogic { constructor(p) { this.props = p || {}; } setState(o) { Object.assign(this.state, o); sync(); } }
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 5, auto: props.autoplay !== false, focus: null, groupCount: 2 };
    this.canvasRef = { current: null };
    this.SEQ = [5, 10, 50, 300];
    this.MAX = 300;
    this.PERIOD = 15;
    this.ATLAS = '../faces/atlas/faces.png';
    this.ATLAS_BLUR = '../faces/atlas/faces-blur.png';
    this.TEAM_SRC = ['../faces/mati.png', '../faces/ian.png', '../faces/lian.png', '../faces/andres.png', '../faces/roberto.png'];
    var NAMES = ['Camila', 'Benjamín', 'Sofía', 'Matías', 'Valentina', 'Tomás', 'Isidora', 'Vicente', 'Florencia', 'Agustín', 'Josefa', 'Martín', 'Antonia', 'Joaquín', 'Catalina', 'Lucas', 'Fernanda', 'Diego', 'Trinidad', 'Maximiliano', 'Javiera', 'Cristóbal', 'Emilia', 'Felipe', 'Constanza', 'Ignacio', 'Amanda', 'Nicolás', 'Paz', 'Sebastián', 'Renata', 'Gaspar'];
    var team = [['Tú', 'Pide cobertura'], ['Ian', 'Tiene la cifra'], ['Lian', 'Hueco de 9:30 a 10:15'], ['Andrés', 'Plan B listo'], ['Roberto', 'En reuniones']];
    this.people = [];
    for (var i = 0; i < this.MAX; i++) this.people.push(i < 5 ? { name: team[i][0], status: team[i][1] } : { name: NAMES[(i * 7) % NAMES.length], tile: (i - 5) % 64 });
    this.TOPICS = ['Turno del sábado', 'Mover la reunión del lunes', 'Datos para el pitch', 'Bug de pagos', 'Quién lleva al cliente', 'Revisar el contrato', 'Almuerzo del equipo', 'Llaves de la oficina'];
    this.COLS = ['#1e9bff', '#7b61ff', '#e840d8', '#ff3b6b', '#ff8a1f'];
    this.groups = []; this.lastPhase = {};
    this.buildGroups(5);
  }

  componentDidMount() {
    var self = this;
    var load = function (s) { var im = new Image(); im.src = s; return im; };
    this.team = this.TEAM_SRC.map(load);
    this.atlas = load(this.ATLAS); this.atlasBlur = load(this.ATLAS_BLUR);
    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.cur = []; this.vis = [];
    for (var i = 0; i < this.MAX; i++) { this.cur.push(null); this.vis.push(0); }
    this.p = this.look(this.state.n);
    this.edgeFade = 1; this.dimK = 0; this.colorK = { mia: 1 };
    this.t0 = performance.now(); this.last = this.t0; this.lastStep = this.t0;
    this.uy = 0; this.up = 0; this.vy = 0; this.vp = 0; this.drag = null; this.hover = -1; this.mouse = null; this.idle = 0; this.turnTo = null;
    var cv = this.canvasRef.current;
    if (cv) {
      cv.style.cursor = 'grab'; cv.style.touchAction = 'none';
      var at = function (e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * 1440 / r.width, y: (e.clientY - r.top) * 900 / r.height }; };
      this.onDown = function (e) { var m = at(e); self.drag = { x: m.x, y: m.y, t: performance.now(), moved: 0 }; self.vy = 0; self.vp = 0; if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); };
      this.onMove = function (e) {
        var m = at(e); self.mouse = m;
        if (!self.drag) return;
        var now = performance.now(), dts = Math.max(0.008, (now - self.drag.t) / 1000);
        var dy = (m.x - self.drag.x) * 0.006, dp = (m.y - self.drag.y) * 0.006;
        self.drag.moved += Math.abs(m.x - self.drag.x) + Math.abs(m.y - self.drag.y);
        if (self.drag.moved > 5) { cv.style.cursor = 'grabbing'; self.uy += dy; self.up = Math.max(-0.9, Math.min(0.9, self.up + dp)); self.vy = dy / dts; self.vp = dp / dts; self.idle = 0; self.turnTo = null; }
        self.drag.x = m.x; self.drag.y = m.y; self.drag.t = now;
      };
      this.onUp = function (e) { var d = self.drag; self.drag = null; cv.style.cursor = 'grab'; if (e.type === 'pointerup' && d && d.moved <= 5) self.click(at(e)); };
      this.onLeave = function () { self.mouse = null; };
      cv.addEventListener('pointerdown', this.onDown);
      cv.addEventListener('pointermove', this.onMove);
      cv.addEventListener('pointerup', this.onUp);
      cv.addEventListener('pointercancel', this.onUp);
      cv.addEventListener('pointerleave', this.onLeave);
    }
    var loop = function (now) { self.frame(now); self.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    var cv = this.canvasRef.current;
    if (cv && this.onDown) { cv.removeEventListener('pointerdown', this.onDown); cv.removeEventListener('pointermove', this.onMove); cv.removeEventListener('pointerup', this.onUp); cv.removeEventListener('pointercancel', this.onUp); cv.removeEventListener('pointerleave', this.onLeave); }
  }

  setN(n, keepAuto) {
    if (n === this.state.n) { if (!keepAuto) this.setState({ auto: false }); return; }
    this.edgeFade = 0;
    this.lastStep = performance.now();
    this.buildGroups(n);
    this.turnTo = null;
    var s = { n: n, focus: null, groupCount: this.groups.length };
    if (!keepAuto) s.auto = false;
    this.setState(s);
  }

  look(n) {
    if (n <= 5) return { S: 285, lw: 1, ea: 0.18, faceR: 42, small: 42, mid: 34, dot: 34 };
    if (n <= 10) return { S: 255, lw: 1, ea: 0.2, faceR: 38, small: 26, mid: 22, dot: 20 };
    if (n <= 50) return { S: 255, lw: 0.6, ea: 0.13, faceR: 34, small: 22, mid: 15, dot: 11 };
    return { S: 255, lw: 0.4, ea: 0.075, faceR: 32, small: 20, mid: 11, dot: 6.5 };
  }

  norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }

  target(i, n) {
    if (i === 0) return this.norm([0, 0.5, 0.86]);
    if (n <= 5) {
      var a = -Math.PI / 2 + (2 * Math.PI * i) / n, r = 0.78;
      return this.norm([r * Math.cos(a) * 1.18, -r * Math.sin(a) * 0.82 - 0.05, Math.sqrt(Math.max(0.05, 1 - r * r))]);
    }
    if (i === 1) return this.norm([0.62, 0.02, 0.78]);
    if (i === 2) return this.norm([0.3, -0.56, 0.77]);
    if (i === 3) return this.norm([-0.62, -0.18, 0.76]);
    if (i === 4) return this.norm([-0.4, -0.6, 0.68]);
    if (n <= 10) return this.norm([[-0.84, 0.42, 0.36], [0.8, 0.56, -0.1], [0.06, -0.96, 0.28], [-0.88, -0.2, -0.4], [0.45, 0.35, -0.82]][i - 5]);
    var g = Math.PI * (3 - Math.sqrt(5)), k = i - 5, m = n - 5;
    var y = 1 - 2 * (k + 0.5) / m, rr = Math.sqrt(1 - y * y), th = k * g + 0.7;
    return [rr * Math.cos(th), y, rr * Math.sin(th)];
  }

  buildGroups(n) {
    var gs = [{ id: 'mia', mine: true, members: [0, 1, 2], edges: [[0, 1, 1, '¿Quién cubre las 11?'], [0, 2, 1], [1, 2, 2, 'Review antes de las 10:30']], topic: 'Cubrir la reunión de las 11', offset: 0 }];
    gs.push({ id: 'planb', members: [3, 4], edges: [[3, 4, 1]], topic: 'Plan B para el cliente', offset: 5 });
    var extra = n <= 5 ? 0 : n <= 10 ? 1 : n <= 50 ? 4 : 8;
    var sizes = n <= 50 ? [4, 3, 4, 3] : [6, 4, 5, 4, 6, 3, 5, 4];
    for (var e = 0; e < extra; e++) gs.push({ id: 'g' + e, seed: e, size: sizes[e], topic: this.TOPICS[e], offset: 1.9 * e + 2.4 });
    this.groups = gs;
    if (n === 10) { gs[2].members = [5, 8, 7]; gs[2].edges = [[5, 8, 1], [5, 7, 1], [8, 7, 2]]; gs[2].fixed = true; }
    for (var j = 2; j < gs.length; j++) if (!gs[j].fixed) this.pickMembers(gs[j], n, Math.floor(((this.nowT || 0) + gs[j].offset) / this.PERIOD));
  }

  pickMembers(g, n, cycle) {
    var used = {}, self = this, d2 = function (a, b) { return (a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1]) + (a[2] - b[2]) * (a[2] - b[2]); };
    for (var nn = 5; nn < n; nn++) for (var tq = 0; tq < 5; tq++) if (d2(this.target(tq, n), this.target(nn, n)) < (tq <= 2 ? 0.55 : 0.3)) used[nn] = 1;
    this.groups.forEach(function (o) { if (o !== g && o.members) o.members.forEach(function (m) { used[m] = 1; }); });
    var elig = [];
    for (var ei = 5; ei < n; ei++) if (!used[ei] && this.target(ei, n)[2] > 0.32) elig.push(ei);
    if (!elig.length) for (var ej = 5; ej < n; ej++) if (!used[ej]) elig.push(ej);
    var ang = (g.seed * 2.39996 + cycle * 1.1 + 0.6), dir = this.norm([Math.cos(ang) * 0.85, Math.sin(ang) * 0.85, 0.55]), bestD = -Infinity, start = elig[0];
    for (var ek = 0; ek < elig.length; ek++) { var te = this.target(elig[ek], n), dd = te[0] * dir[0] + te[1] * dir[1] + te[2] * dir[2]; if (dd > bestD) { bestD = dd; start = elig[ek]; } }
    var c = this.target(start, n), cand = [];
    for (var i = 5; i < n; i++) if (i !== start && !used[i]) cand.push([i, d2(this.target(i, n), c)]);
    cand.sort(function (a, b) { return a[1] - b[1]; });
    var step = n > 50 ? 2 : 1, mem = [start];
    for (var k = 0; k < g.size - 1; k++) { var pick = cand[k * step] || cand[k]; if (pick) mem.push(pick[0]); }
    var helpers = mem.slice(1), base = this.target(start, n);
    helpers.sort(function (a, b) {
      var ta = self.target(a, n), tb = self.target(b, n);
      return Math.atan2(ta[1] - base[1], ta[0] - base[0]) - Math.atan2(tb[1] - base[1], tb[0] - base[0]);
    });
    var edges = helpers.map(function (h) { return [start, h, 1]; });
    if (helpers.length >= 3) for (var hh = 0; hh < helpers.length - 1; hh += (helpers.length >= 5 ? 2 : 1)) edges.push([helpers[hh], helpers[hh + 1], 2]);
    if (helpers.length === 2) edges.push([helpers[0], helpers[1], 2]);
    g.members = [start].concat(helpers);
    g.edges = edges;
    g.cycle = cycle;
  }

  colored() { return this.state.focus || 'mia'; }

  phase(g, t) {
    var full = { t1: 1, t2: 1, live: 1, agree: 0, alpha: 1 };
    if (g.mine || this.state.focus === g.id || this.reduced) return full;
    var P = this.PERIOD, tt = t + g.offset, local = tt % P, cycle = Math.floor(tt / P);
    if (g.seed !== undefined && !g.fixed && g.cycle !== cycle) this.pickMembers(g, this.state.n, cycle);
    var ease = function (x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); };
    if (local < 3) return { t1: ease(local / 1.3), t2: ease((local - 1.4) / 1.3), live: local > 1.3 ? 1 : 0, agree: 0, alpha: 1 };
    if (local < 11) return full;
    if (local < 13.6) return { t1: 1, t2: 1, live: 0, agree: (local - 11) / 2.6, alpha: 1 };
    return { t1: 0, t2: 0, live: 0, agree: 0, alpha: 0 };
  }

  click(m) {
    const miniature=this.motionSpots && pickMotionSpot(this.motionSpots,m);
    if(miniature && this.openThread){this.openThread(miniature.a,miniature.b);return;}
    var h = this.hit(m);
    if (h >= 0) {
      for (var i = 0; i < this.groups.length; i++) {
        var g = this.groups[i];
        if (g.members.indexOf(h) >= 0 && (this.lastPhase[g.id] || 0) > 0.5) { if (g.mine) { this.turnTo = null; this.setState({ focus: null }); return; } this.focusGroup(g); return; }
      }
    }
    if (h<0 && this.pickThread) {
      const edge=this.pickThread(m);
      if(edge){this.openThread(edge.a,edge.b,edge.topic);return;}
    }
    this.turnTo = null;
    if (this.state.focus) this.setState({ focus: null });
  }

  focusGroup(g) {
    var c = [0, 0, 0], self = this;
    g.members.forEach(function (m) { var v = self.cur[m] || self.target(m, self.state.n); c[0] += v[0]; c[1] += v[1]; c[2] += v[2]; });
    c = this.norm(c);
    if (this.state.n > 5) this.turnTo = { uy: -Math.atan2(c[0], c[2]) - 0.12, up: Math.atan2(c[1], Math.hypot(c[0], c[2])) - 0.28 };
    this.vy = 0; this.vp = 0; this.idle = 0;
    this.setState({ focus: g.id, auto: false });
  }

  hit(m) {
    if (!this.P) return -1;
    var best = Infinity, id = -1;
    for (var h = 0; h < this.P.length; h++) {
      var q = this.P[h]; if (!q || this.vis[h] < 0.5 || q.z < -0.05) continue;
      var dx = q.x - m.x, dy = q.y - m.y, d2 = dx * dx + dy * dy, lim = Math.max(12, (q.r || 6) + 4);
      if (d2 < lim * lim && d2 < best) { best = d2; id = h; }
    }
    return id;
  }

  grad(ctx, x0, y0, x1, y1) {
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    this.COLS.forEach(function (col, j) { g.addColorStop(j / 4, col); });
    return g;

      if(this.threadSelection && !this.reduced) drawThreadToken(ctx,view,this.threadSelection,this.calendarZoom);
    }
    chips.forEach(function (c) { if (c[3] > 0.01) { ctx.globalAlpha = c[3]; self.chip(ctx, c[0], c[1], c[2]); ctx.globalAlpha = 1; } });

    if (this.hover >= 0 && count > 1) {
      var hv = P[this.hover], conv = (n - 1).toLocaleString('es-CL') + (n - 1 === 1 ? ' conversación posible' : ' conversaciones posibles');
      this.chip(ctx, this.people[this.hover].name + ' · ' + conv, hv.x, hv.y + hv.r + 26);
    }
  }

  done(ctx) {
    ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
    var w = ctx.measureText('Listo').width + 46, h = 30;
    ctx.save(); ctx.shadowColor = 'rgba(40,30,90,0.12)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 15); ctx.fill(); ctx.restore();
    ctx.strokeStyle = '#1d1d1f'; ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-w / 2 + 13, 0.5); ctx.lineTo(-w / 2 + 17, 4.5); ctx.lineTo(-w / 2 + 25, -4); ctx.stroke();
    ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Listo', -w / 2 + 32, 0.5);
    ctx.textBaseline = 'alphabetic';
  }

  chip(ctx, text, x, y) {
    ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
    var w = ctx.measureText(text).width + 26, h = 30, a = ctx.globalAlpha;
    ctx.save();
    ctx.shadowColor = 'rgba(40,30,90,0.10)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 15); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 15); ctx.stroke();
    ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 0.5);
    ctx.textBaseline = 'alphabetic';
  }

  faceStyle(id) {
    var base = { display: 'block', width: '36px', height: '36px', borderRadius: '50%', flex: '0 0 auto', boxShadow: '0 0 0 2px rgba(255,255,255,0.95), 0 6px 14px rgba(40,30,90,0.14)' };
    if (id < 5) return Object.assign(base, { backgroundImage: 'url(' + this.TEAM_SRC[id] + ')', backgroundSize: 'cover' });
    var tile = this.people[id].tile;
    return Object.assign(base, { backgroundImage: 'url(' + this.ATLAS + ')', backgroundSize: '800% 800%', backgroundPosition: ((tile % 8) * 100 / 7) + '% ' + (Math.floor(tile / 8) * 100 / 7) + '%' });
  }

  renderVals() {
    var self = this, n = this.state.n, fmt = function (v) { return v.toLocaleString('es-CL'); };
    var focus = null;
    if (this.state.focus) {
      var g = this.groups.filter(function (x) { return x.id === self.state.focus; })[0];
      if (g) {
        var talks = g.edges.length;
        focus = {
          topic: g.topic,
          members: g.members.map(function (m, i) { return { name: self.people[m].name, role: i === 0 ? 'Pide ayuda' : 'Puede ayudar', face: self.faceStyle(m) }; }),
          note: g.members.length + ' agentes, ' + talks + (talks === 1 ? ' conversación' : ' conversaciones') + '. Nadie más se entera.'
        };
      }
    }
    var gc = this.state.groupCount;
    return {
      canvasRef: this.canvasRef,
      n: fmt(n),
      pairs: fmt(n * (n - 1) / 2),
      onlineLabel: fmt(n) + ' agentes en línea',
      groupsLabel: gc + (gc === 1 ? ' grupo negociando' : ' grupos negociando'),
      hasFocus: !!focus,
      focus: focus || { topic: '', members: [], note: '' },
      clearFocus: function () { self.turnTo = null; self.setState({ focus: null }); },
      options: this.SEQ.map(function (v) {
        var on = v === n;
        return {
          label: fmt(v),
          pressed: on ? 'true' : 'false',
          style: on ? { background: '#1d1d1f', color: '#ffffff' } : { background: 'transparent', color: '#1d1d1f' },
          pick: function () { self.setN(v, false); }
        };
      })
    };
  }
}
const q = new URLSearchParams(location.search);
const calendarPreview = q.get("solo") === "calendars";
const motions = q.get("motion");
const motionPreview = motions==="all" || Object.hasOwn(window.RondaMotion.periods,motions);
const g = new Component({ autoplay: !q.has('n') && !calendarPreview && !motionPreview });
if (calendarPreview) {
  g.drawCalendar = drawCalendarEdge;

  document.body.classList.add("calendar-preview");
  document.title = "Calendario en el globo · Ronda";
  document.getElementById("c").setAttribute("aria-label","Globo de agentes. Toca un arco para abrir su hilo simulado. Arrastra para girar.");
  g.people[2].status = "Libre desde las 10:30";
  g.paintMotions=(ctx,points,control,t)=>paintGraphMotions(ctx,points,control,g.calendarZoom,t,g.reduced,g.team,'calendars',g.threadPhase);
}
if (motionPreview) {
  g.people[2].status="Libre desde las 10:30";
  const pause=document.getElementById("motion-pause");
  let frozenAt=null,offset=0;
  pause.onclick=()=>{
    if (frozenAt===null) {frozenAt=g.nowT || 0;pause.textContent="Reanudar miniaturas";}
    else {offset+=(g.nowT || 0)-frozenAt;frozenAt=null;pause.textContent="Pausar miniaturas";}
  };
  g.paintMotions=(ctx,points,control,t)=>paintGraphMotions(
    ctx,points,control,g.calendarZoom,(frozenAt??t)-offset,g.reduced,g.team,motions,g.threadPhase
  );
  const motion=matchMedia("(prefers-reduced-motion: reduce)");
  const updatePause=()=>{pause.hidden=q.has("still") || motion.matches;};
  motion.addEventListener("change",updatePause);updatePause();
  document.title="Interacciones en el globo · Ronda";
  document.body.classList.add("calendar-preview");
  document.getElementById("c").setAttribute("aria-label","Ocho interacciones sobre las conexiones de cinco agentes. Arrastra para girar.");
}
if (motionPreview || calendarPreview) {
  g.openThread=mountThreadInspector(g,calendarPreview?"calendars":motions);
  g.threadPhase=(a,b,t,reduced)=>DemoThreads.fraction(DemoThreads.key(a,b),t,reduced);
  document.getElementById("c").setAttribute("aria-label","Toca una miniatura o una conexión para abrir su hilo simulado. Arrastra para girar.");
  document.querySelector(".legend").lastElementChild.lastChild.textContent=" · toca una conexión para ver su hilo";
  function resizeCalendarPreview() {
    const width = document.documentElement.clientWidth;
    const phone = width < 750;
    const scale = phone ? Math.min(.78, width / 940) : Math.min(1,width / 1440);
    g.calendarZoom = scale;
    const top = 150 - 210*scale;
    const style = document.body.style;
    style.setProperty("--globe-zoom",scale);
    style.setProperty("--calendar-scale",scale);
    style.setProperty("--calendar-top",top+"px");
    style.setProperty("--calendar-left",(width/2-590*scale)+"px");
    style.setProperty("--calendar-aside",(top+900*scale)+"px");
  }
  resizeCalendarPreview();
  window.addEventListener("resize",resizeCalendarPreview);
}
g.canvasRef.current = document.getElementById('c');
function sync() {
  const v = g.renderVals ? g.renderVals() : null; if (!v) return;
  document.getElementById('people').textContent = 'Con ' + v.n + ' personas';
  document.getElementById('pairs').textContent = v.pairs;
  document.getElementById('online').textContent = v.onlineLabel;
  document.getElementById('groups').textContent = v.groupsLabel;
  document.querySelectorAll('[data-n]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === g.state.n ? 'true' : 'false'));
  const box = document.getElementById('focus'); box.hidden = !v.hasFocus;
  document.getElementById('ftopic').textContent = v.focus.topic;
  document.getElementById('fnote').textContent = v.focus.note;
  const list = document.getElementById('fmembers'); list.replaceChildren();
  v.focus.members.forEach(m => {
    const row = document.createElement('div'); row.className = 'member';
    const face = document.createElement('span'); face.className = 'rd-face'; Object.assign(face.style, m.face);
    const who = document.createElement('span'); who.className = 'rd-person';
    who.innerHTML = '<span class="rd-person__name"></span><span class="rd-person__status"></span>';
    who.children[0].textContent = m.name; who.children[1].textContent = m.role;
    row.append(face, who); list.append(row);
  });
}
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => g.setN(+b.dataset.n, false)));
document.getElementById('fclose').addEventListener('click', () => { g.turnTo = null; g.setState({ focus: null }); });
if (q.has('n')) g.setN(+q.get('n'), false);
g.componentDidMount();
if (calendarPreview || motionPreview) {
  const motion=matchMedia("(prefers-reduced-motion: reduce)");
  const syncMotion=()=>{g.reduced=q.has("still") || motion.matches; g.refreshThread();};
  motion.addEventListener("change",syncMotion);
  syncMotion();
}
if (q.has('still')) { g.vis = g.vis.map((x, i) => i < g.state.n ? 1 : 0); g.p = g.look(g.state.n); g.edgeFade = 1; }
sync();
</script>
