<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ronda · propuesta del grafo: disposición y escala</title>
<link rel="icon" href="../logo/ronda-mark.svg">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ronda.css">
<style>
  /* Propuesta. Si Mati la aprueba, rd-pearl y rd-graph--dense pasan a ronda.css. */
  body { margin: 0; }
  .ref-graph { width: 1000px; max-width: 100%; aspect-ratio: 5 / 3; margin-top: 24px; }
  @media (min-width: 1100px) { .ref-graph { margin-left: -30px; } }
  .rd-node { transition: left 900ms cubic-bezier(.2,.8,.2,1), top 900ms cubic-bezier(.2,.8,.2,1), opacity 600ms ease; }
  .rd-node--enter { opacity: 0; }
  .rd-pearl { position: absolute; transform: translate(-50%, -50%); width: var(--pearl, 12px); height: var(--pearl, 12px); border-radius: 50%; background: var(--rd-glass-solid); box-shadow: 0 0 0 1px var(--rd-glass-border), var(--rd-shadow-card); transition: width 900ms ease, height 900ms ease; }
  .rd-graph svg path.rd-edge { transition: opacity 700ms ease; }
  .rd-graph--dense svg path.rd-edge { stroke-width: var(--edge-w, 1); opacity: var(--edge-o, 1); }
  .rd-graph--dense svg path.rd-edge.rd-edges-old { opacity: 0; }
  .rd-edges-old { opacity: 0; }
  .ctl { margin-top: 8px; max-width: 420px; }
  .still .rd-node, .still .rd-pearl, .still .rd-graph svg path { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .rd-node, .rd-pearl, .rd-graph svg path.rd-edge { transition: none; } }
</style>
</head>
<body>
<div class="rd-page">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="rd-page__inner">
    <header class="rd-bar">
      <a class="rd-brand" href="#"><img class="rd-mark" src="../logo/ronda-mark.svg" alt="">Ronda</a>
      <span class="rd-chip rd-chip--status rd-glass"><span class="rd-dot"></span><span id="online">5 agentes en línea</span></span>
    </header>
    <main class="rd-layout">
      <section>
        <h1 class="rd-hero">Tu mañana,<br><span class="rd-gradient-text">resuelta entre agentes.</span></h1>
        <div class="rd-graph ref-graph" id="graph"><svg viewBox="0 0 1000 600" aria-hidden="true"></svg></div>
      </section>
      <aside class="rd-stack">
        <div class="rd-card rd-glass">
          <span class="rd-label" id="people">Con 5 personas</span>
          <div class="rd-stat-row">
            <span class="rd-stat" id="pairs">10<span class="rd-stat__unit">pares</span></span>
            <span class="rd-stat-row__arrow">→</span>
            <span class="rd-stat"><span class="rd-gradient-text">1</span><span class="rd-stat__unit">decisión</span></span>
          </div>
          <span class="rd-note">Los agentes viven en O(n²). Tú vives en O(1).</span>
        </div>
        <div class="rd-actions ctl">
          <button type="button" class="rd-button rd-button--quiet" data-n="5">5</button>
          <button type="button" class="rd-button rd-button--quiet" data-n="10">10</button>
          <button type="button" class="rd-button rd-button--quiet" data-n="50">50</button>
          <button type="button" class="rd-button rd-button--quiet" data-n="300">300</button>
        </div>
      </aside>
    </main>
  </div>
</div>
<script>
// Datos de ejemplo: el equipo real son 5; el resto son personas sintéticas para mostrar la escala.
const TEAM = [
  { id: 'mati', name: 'Tú', status: 'Pide cobertura', face: '../faces/mati.png' },
  { id: 'ian', name: 'Ian', status: 'Tiene la cifra', face: '../faces/ian.png' },
  { id: 'lian', name: 'Lian', status: 'Hueco de 9:30 a 10:15', face: '../faces/lian.png' },
  { id: 'andres', name: 'Andrés', status: 'Plan B listo', face: '../faces/andres.png', small: true },
  { id: 'roberto', name: 'Roberto', status: 'En reuniones', face: '../faces/roberto.png', small: true },
];
const people = n => Array.from({ length: n }, (_, i) => TEAM[i] ?? { id: 'p' + i });
const pairs = list => list.flatMap((a, i) => list.slice(i + 1).map(b => [a.id, b.id]));

// Disposición: un anillo elíptico, «Tú» arriba, el resto en orden horario. Con 5 coincide con la referencia.
// Con 10 o menos: anillo (con 5 es la referencia exacta). Con más: una nube en espiral (ángulo áureo),
// pareja y sin patrón, que crece hacia afuera; «Tú» se queda arriba.
const C = { x: 500, y: 300, rx: 300, ry: 200 };
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
function place(list) {
  const out = new Map(), n = list.length;
  if (n <= 10) {
    list.forEach((p, i) => {
      const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
      out.set(p.id, { x: C.x + C.rx * Math.cos(a), y: C.y + C.ry * Math.sin(a), a });
    });
    return out;
  }
  const rx = n >= 300 ? 450 : 360, ry = n >= 300 ? 235 : 230;
  list.forEach((p, i) => {
    if (i === 0) { out.set(p.id, { x: C.x, y: C.y - ry * 0.97, a: -Math.PI / 2 }); return; }
    const r = Math.sqrt((i + 0.5) / n), a = i * GOLDEN;
    out.set(p.id, { x: C.x + rx * r * Math.cos(a), y: C.y + ry * r * Math.sin(a), a });
  });
  return out;
}
// Curva: el punto de control cae entre el punto medio y el centro, así toda línea se curva hacia adentro.
function curve(p, q, bend = 0.22) {
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
  const cx = mx + (C.x - mx) * bend, cy = my + (C.y - my) * bend;
  return `M${p.x.toFixed(1)} ${p.y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`;
}
function side(a) {
  const d = ((a * 180) / Math.PI + 360) % 360;
  if (d > 225 && d < 315) return 'top';
  if (d >= 45 && d <= 135) return 'bottom';
  return d > 90 && d < 270 ? 'left' : 'right';
}
// Cuanto más gente, más delgada la línea y más chica la perla: la pantalla se cubre, pero de luz.
const look = n => n <= 5 ? { w: 1, faces: true } : n <= 10 ? { w: 1, pearl: 14 } : n <= 50 ? { w: 0.5, o: 1, pearl: 9 } : { w: 0.3, o: 0.22, pearl: 5 };

const graph = document.getElementById('graph');
const svg = graph.querySelector('svg');
const nodes = new Map();

function render(n) {
  const list = people(n), pos = place(list), lk = look(n);
  graph.classList.toggle('rd-graph--dense', n > 5);
  graph.style.setProperty('--edge-w', lk.w);
  graph.style.setProperty('--edge-o', lk.o ?? 1);
  graph.style.setProperty('--pearl', (lk.pearl ?? 12) + 'px');

  const d = pairs(list).map(([a, b]) => curve(pos.get(a), pos.get(b))).join('');
  svg.querySelectorAll('path.rd-edge').forEach(old => { old.classList.add('rd-edges-old'); setTimeout(() => old.remove(), 700); });
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'rd-edge rd-edges-old');
  path.setAttribute('d', d);
  svg.appendChild(path);
  requestAnimationFrame(() => requestAnimationFrame(() => path.classList.remove('rd-edges-old')));

  const keep = new Set(list.map(p => p.id));
  for (const [id, el] of nodes) if (!keep.has(id)) { el.classList.add('rd-node--enter'); setTimeout(() => el.remove(), 600); nodes.delete(id); }
  list.forEach((p, i) => {
    const at = pos.get(p.id);
    const withFace = p.face && (lk.faces || i === 0);
    let el = nodes.get(p.id);
    const html = withFace
      ? `<img class="rd-face${p.small || !lk.faces ? ' rd-face--small' : ''}" src="${p.face}" alt=""><span class="rd-person"><span class="rd-person__name">${p.name}</span>${lk.faces ? `<span class="rd-person__status">${p.status}</span>` : ''}</span>`
      : '<span class="rd-pearl"></span>';
    if (!el) {
      el = document.createElement('div');
      el.className = 'rd-node rd-node--enter';
      graph.appendChild(el);
      nodes.set(p.id, el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('rd-node--enter')));
    }
    if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
    el.classList.remove('rd-node--top', 'rd-node--bottom', 'rd-node--left', 'rd-node--right');
    if (withFace) el.classList.add('rd-node--' + side(at.a));
    el.style.left = (at.x / 10) + '%';
    el.style.top = (at.y / 6) + '%';
  });

  document.getElementById('people').textContent = `Con ${n} personas`;
  document.getElementById('pairs').firstChild.textContent = ((n * (n - 1)) / 2).toLocaleString('es-CL');
  document.getElementById('online').textContent = `${n} agentes en línea`;
}

document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => render(+b.dataset.n)));
const q = new URLSearchParams(location.search);
if (q.has('still')) document.documentElement.classList.add('still');
render(+(q.get('n') || 5));
</script>
</body>
</html>
