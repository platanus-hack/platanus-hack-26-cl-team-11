<style>
  /* Playground: muestra en un lugar el globo, el hilo, las herramientas y el streaming. */
  body { margin: 0; }
  .pg-tabs { display: inline-flex; gap: 6px; padding: 5px; border-radius: var(--rd-radius-pill); align-self: flex-start; flex-wrap: wrap; }
  .pg-tabs .rd-button { flex: 0 0 auto; height: 40px; background: transparent; color: var(--rd-ink); }
  .pg-tabs .rd-button[aria-selected="true"] { background: var(--rd-ink); color: var(--rd-on-ink); }
  .pg-note { margin: 14px 0 12px; max-width: 760px; }
  .pg-box { position: relative; width: 100%; height: calc(100vh - 150px); min-height: 560px; overflow: hidden; border-radius: var(--rd-radius-card); background: var(--rd-bg); box-shadow: var(--rd-shadow-card); }
  .pg-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .pg-note { margin: 10px 0; }
</style>
</head>
<body>
<div class="rd-page">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="rd-page__inner">
    <header class="rd-bar">
      <span class="rd-brand"><img class="rd-mark" src="../logo/ronda-mark.svg" alt="">Ronda · playground</span>
      <span class="rd-chip rd-chip--status rd-glass"><span class="rd-dot"></span>Todo en vivo</span>
    </header>
    <div class="pg-tabs rd-glass" role="tablist" aria-label="Piezas" id="tabs"></div>
    <p class="rd-note pg-note" id="note"></p>
    <div class="pg-box" id="box"><iframe class="pg-frame" id="frame" title="Pieza"></iframe></div>
  </div>
</div>
<script>
const tabs = [
  { id: 'demo', label: 'Demo', src: 'globo.html?n=5&motion=calendars&open=1', note: 'Se reproduce sola. A la derecha, el hilo entre los agentes de Ian y Lian; en el globo, su arco cuenta lo mismo al mismo tiempo: puntos cuando escriben, la miniatura mientras corre cada herramienta, un check al terminar.' },
  { id: 'globo', label: 'Globo', src: 'globo.html', note: 'Globo de 5 a 300 personas. Arrastra para girarlo; toca a alguien con aro para ver su grupo. Grupos de hasta 9 en tres rondas, miniaturas sobre los hilos, un solo grupo con color, profundidad gradual.' },
  { id: 'hilo', label: 'Hilo en vivo', src: 'globo.html?n=5&motion=calendars', note: 'Toca «Abrir hilo». Streaming sin reacomodo, tarjetas de herramienta por conector, recibos que cambian en su lugar.' },
  { id: 'permiso', label: 'Permiso', src: 'globo.html?n=5&motion=permission', note: 'Toca «Abrir hilo». El agente espera tu decisión: Aceptar o Ajustar. Solo tú ves esa solicitud.' },
  { id: 'duplas', label: 'Arco + herramienta', src: 'hilo/duplas.html', note: 'Cada herramienta en su dupla: lo que pasa en el arco del grafo y en el hilo, con el mismo reloj. Escriben: puntos chicos en el arco. Corre la herramienta: miniatura en el arco y tarjeta en el hilo. Termina: check y queda un punto. Cambia el tamaño arriba; toca un arco para resaltar su tarjeta.' },
  { id: 'herramientas', label: 'Herramientas', src: 'hilo/herramientas.html', note: 'Las 15 tarjetas chunky, una por conector, con su escena viva. Se reproduce una vez; «Repetir» la vuelve a correr.' },
  { id: 'escala', label: '300 personas', src: 'globo.html?n=300', note: '44.850 conversaciones posibles como neblina de luz. Tú y tus conversaciones al frente.' }
];
const bar = document.getElementById('tabs'), frame = document.getElementById('frame'), note = document.getElementById('note');
function show(id) {
  const t = tabs.find(x => x.id === id) || tabs[0];
  [...bar.children].forEach(b => b.setAttribute('aria-selected', b.dataset.id === t.id ? 'true' : 'false'));
  frame.src = t.src; note.textContent = t.note; history.replaceState(null, '', '#' + t.id);
}
tabs.forEach(t => { const b = document.createElement('button'); b.type = 'button'; b.className = 'rd-button'; b.setAttribute('role', 'tab'); b.dataset.id = t.id; b.textContent = t.label; b.onclick = () => show(t.id); bar.append(b); });
show(location.hash.slice(1));
</script>
</body>
</html>
