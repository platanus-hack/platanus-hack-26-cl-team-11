<style>
body{margin:0}
.aura i{position:absolute;border-radius:50%;aspect-ratio:1}
.aura i:nth-child(1){left:6%;top:31%;width:36%;background:#4fb4ff;opacity:.30;filter:blur(110px)}
.aura i:nth-child(2){left:29%;top:44%;width:36%;background:#b36bff;opacity:.26;filter:blur(120px)}
.aura i:nth-child(3){left:53%;top:19%;width:32%;background:#ff5fa8;opacity:.22;filter:blur(120px)}
.aura i:nth-child(4){left:72%;top:58%;width:29%;background:#ffa24a;opacity:.24;filter:blur(120px)}
.grad{background:linear-gradient(100deg,#1e9bff 0%,#7b61ff 30%,#e840d8 55%,#ff3b6b 76%,#ff8a1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{height:40px;min-width:64px;padding:0 18px;border:0;border-radius:999px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .25s ease,color .25s ease}
.pill:focus-visible,.close:focus-visible{outline:2px solid #7b61ff;outline-offset:3px}
.ring{width:14px;height:14px;border-radius:50%;padding:1.5px;background:rgba(29,29,31,.42);box-sizing:border-box;flex:0 0 auto}
.ring i{display:block;width:100%;height:100%;border-radius:50%;background:#f7f7fa}
.fadein{animation:fadein .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fadein{animation:none}}
</style>

      ctx.globalAlpha = 1;
    });

    for (var li = 0; li < order.length; li++) {
      var id2 = order[li], fp = P[id2]; if (fp.z < -0.05 || fp.r < 2) continue;
      if (!(n <= 10 || id2 <= 2 || focusSet[id2])) continue;
      var la = this.vis[id2] * (1 - fp.fog) * (this.dimK > 0.01 && !focusSet[id2] && id2 !== 0 ? 1 - 0.7 * this.dimK : 1);
      ctx.globalAlpha = la; ctx.fillStyle = '#1d1d1f'; ctx.textBaseline = 'alphabetic';
      ctx.shadowColor = 'rgba(247,247,250,0.95)'; ctx.shadowBlur = 8;
      var person = this.people[id2], R0 = fp.r;
      ctx.font = '600 ' + (n <= 5 || id2 <= 2 ? 16 : 13) + 'px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
      if (id2 === 0) {
        ctx.textAlign = 'center';
        ctx.fillText(person.name, fp.x, fp.y - R0 - 34);
        ctx.fillStyle = '#6e6e73'; ctx.font = '400 13px -apple-system, system-ui, sans-serif'; ctx.fillText(person.status, fp.x, fp.y - R0 - 15);
      } else {
        var right = fp.x >= CX, gap = R0 + (member[id2] ? 14 : 10), lx = right ? fp.x + gap : fp.x - gap;
        ctx.textAlign = right ? 'left' : 'right';
        if (n <= 5) {
          ctx.fillText(person.name, lx, fp.y - 2);
          ctx.fillStyle = '#6e6e73'; ctx.font = '400 13px -apple-system, system-ui, sans-serif'; ctx.fillText(person.status, lx, fp.y + 17);
        } else { ctx.textBaseline = 'middle'; ctx.fillText(person.name, lx, fp.y); ctx.textBaseline = 'alphabetic'; }
      }
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

    chips.forEach(function (c) { if (c[3] > 0.01) { ctx.globalAlpha = c[3]; self.chip(ctx, c[0], c[1], c[2]); ctx.globalAlpha = 1; } });

    if (this.hover >= 0 && count > 1) {
      var hv = P[this.hover], conv = (n - 1).toLocaleString('es-CL') + (n - 1 === 1 ? ' conversación posible' : ' conversaciones posibles');
      this.chip(ctx, this.people[this.hover].name + ' · ' + conv, hv.x, hv.y + hv.r + 26);
    }
  }

  photo(id) {
    if (id < 5) return this.team[id];
    this.photos = this.photos || {};
    var tile = this.people[id].tile;
    if (this.photos[tile]) return this.photos[tile];
    if (!this.atlas || !this.atlas.complete || !this.atlas.naturalWidth) return null;
    try {
      var c = document.createElement('canvas'); c.width = c.height = 96;
      c.getContext('2d').drawImage(this.atlas, (tile % 8) * 128 + 4, Math.floor(tile / 8) * 128 + 4, 120, 120, 0, 0, 96, 96);
      var im = new Image(); im.src = c.toDataURL('image/png'); this.photos[tile] = im; return im;
    } catch (err) { return null; }
  }

  done(ctx) {
    ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
    var w = ctx.measureText('Listo').width + 46, h = 30;
    ctx.save(); ctx.shadowColor = 'rgba(40,30,90,0.12)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 15); ctx.fill(); ctx.restore();
    ctx.strokeStyle = '#1d1d1f'; ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-w / 2 + 13, 0.5); ctx.lineTo(-w / 2 + 17, 4.5); ctx.lineTo(-w / 2 + 25, -4); ctx.stroke();
    ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Listo', -w / 2 + 32, 0.5);
    ctx.textBaseline = 'alphabetic';
  }

  chip(ctx, text, x, y) {
    ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
    var w = ctx.measureText(text).width + 26, h = 30, a = ctx.globalAlpha;
    ctx.save();
    ctx.shadowColor = 'rgba(40,30,90,0.10)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 15); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 15); ctx.stroke();
    ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 0.5);
    ctx.textBaseline = 'alphabetic';
  }

  faceStyle(id) {
    var base = { display: 'block', width: '36px', height: '36px', borderRadius: '50%', flex: '0 0 auto', boxShadow: '0 0 0 2px rgba(255,255,255,0.95), 0 6px 14px rgba(40,30,90,0.14)' };
    if (id < 5) return Object.assign(base, { backgroundImage: 'url(' + this.TEAM_SRC[id] + ')', backgroundSize: 'cover' });
    var tile = this.people[id].tile;
    return Object.assign(base, { backgroundImage: 'url(' + this.ATLAS + ')', backgroundSize: '800% 800%', backgroundPosition: ((tile % 8) * 100 / 7) + '% ' + (Math.floor(tile / 8) * 100 / 7) + '%' });
  }

  renderVals() {
    var self = this, n = this.state.n, fmt = function (v) { return v.toLocaleString('es-CL'); };
    var focus = null;
    if (this.state.focus) {
      var g = this.groups.filter(function (x) { return x.id === self.state.focus; })[0];
      if (g) {
        var talks = g.edges.length;
        focus = {
          topic: g.topic,
          members: g.members.map(function (m, i) { return { name: self.people[m].name, role: i === 0 ? 'Pide ayuda' : 'Puede ayudar', face: self.faceStyle(m) }; }),
          note: g.members.length + ' agentes, ' + talks + (talks === 1 ? ' conversación' : ' conversaciones') + '. Nadie más se entera.'
        };
      }
    }
    var gc = this.state.groupCount;
    return {
      canvasRef: this.canvasRef,
      n: fmt(n),
      pairs: fmt(n * (n - 1) / 2),
      onlineLabel: fmt(n) + ' agentes en línea',
      groupsLabel: gc + (gc === 1 ? ' grupo negociando' : ' grupos negociando'),
      hasFocus: !!focus,
      focus: focus || { topic: '', members: [], note: '' },
      clearFocus: function () { self.turnTo = null; self.setState({ focus: null }); },
      options: this.SEQ.map(function (v) {
        var on = v === n;
        return {
          label: fmt(v),
          pressed: on ? 'true' : 'false',
          style: on ? { background: '#1d1d1f', color: '#ffffff' } : { background: 'transparent', color: '#1d1d1f' },
          pick: function () { self.setN(v, false); }
        };
      })
    };
  }
}
