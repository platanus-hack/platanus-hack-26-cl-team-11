  iframe { display: block; width: 100vw; height: 100vh; border: 0; }

<body>
<iframe id="globo" title="Globo de la sala" hidden></iframe>
<p id="falta" class="rd-note falta" hidden>Abre esta página con el código de una sala: sala.html?sala=CÓDIGO</p>
<script>
  const code = new URLSearchParams(location.search).get('sala');
  const frame = document.getElementById('globo');
  if (!code) document.getElementById('falta').hidden = false;
  else {
    frame.hidden = false;
    frame.addEventListener('load', () => {
      const script = frame.contentDocument.createElement('script');
      script.src = './sala.js';
      frame.contentDocument.body.appendChild(script);
    });
    frame.src = './globo.html?n=5&sala=' + encodeURIComponent(code);
  }
</script>
