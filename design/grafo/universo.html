<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ronda · Universo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e9bff'/%3E%3Cstop offset='.5' stop-color='%23e840d8'/%3E%3Cstop offset='1' stop-color='%23ff8a1f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='20' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ronda.css">
<link rel="stylesheet" href="./hilo/stream.css">
<link rel="stylesheet" href="./hilo/tools.css">
<style>
  /* PANEL DEMO OMNIPOTENTE (ver universo.js y AGENTS.md regla 6): todo lo nuevo aparece aquí. */
  html, body { margin: 0; height: 100%; }
  .uv { --ease: cubic-bezier(.32,.72,0,1); position: relative; height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 420px; overflow: hidden; background: var(--rd-bg); }
  .uv-stage { position: relative; min-width: 0; }
  .uv-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .9s var(--ease), transform 1.2s var(--ease); }
  .uv[data-scene="semana"] .uv-stage canvas { opacity: .28; transform: scale(.94); }
  .uv-brand { position: absolute; left: 28px; top: 22px; z-index: 3; font-size: 17px; }
  .uv-brand .rd-mark { width: 28px; height: 28px; }

  /* Tres pasos de la historia: uno a uno, grupos, tu semana. */
  .uv-steps { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); z-index: 3; display: flex; gap: 4px; padding: 4px; border-radius: var(--rd-radius-pill); }
  .uv-step { position: relative; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px; border-radius: var(--rd-radius-pill); font-size: 13px; font-weight: var(--rd-weight); color: var(--rd-faint); white-space: nowrap; transition: color .5s var(--ease), background .5s var(--ease); }
  .uv-step b { font-weight: var(--rd-weight); font-family: var(--rd-font-num); font-size: 12px; }
  .uv-step[data-on] { color: var(--rd-ink); background: var(--rd-glass-solid); box-shadow: 0 1px 2px var(--rd-hairline), 0 6px 18px rgba(40,30,90,.08); }
  .uv-step[data-done] { color: var(--rd-muted); }

  /* Contador de la ronda uno a uno: solo durante ese paso. */
  .uv-count { position: absolute; left: 28px; bottom: 28px; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .6s var(--ease); }
  .uv[data-scene="ronda"] .uv-count { opacity: 1; }
  .uv-count .rd-stat { font-size: 34px; }
  .uv-count .rd-note { display: block; margin-top: 4px; }

  /* Controles de quien presenta: ocultos por defecto (botón, tecla H, ?ui=1). */
  .uv-admin { position: absolute; left: 20px; bottom: 18px; right: 20px; z-index: 4; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .uv-admin > * { pointer-events: auto; }
  .uv-cat { display: flex; flex-direction: column; gap: 6px; transition: opacity .35s var(--ease), transform .35s var(--ease); }
  .uv-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .uv-tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px 0 3px; border-radius: var(--rd-radius-pill); font-size: 10.5px; font-weight: var(--rd-weight); background: rgba(255,255,255,.55); color: var(--rd-faint); transition: background .4s ease, color .4s ease; }
  .uv-tag i { width: 14px; height: 14px; border-radius: 5px; background: color-mix(in srgb, var(--t) 20%, white); }
  .uv-tag[data-seen] { background: rgba(255,255,255,.92); color: var(--rd-ink); }
  .uv-tag[data-seen] i { background: var(--t); }
  .uv-tag[data-now] { box-shadow: 0 0 0 1.5px var(--t); }
  .uv-ctl { display: flex; gap: 8px; }
  .uv-ctl .rd-button { flex: 0 0 auto; height: 36px; padding: 0 16px; font-size: 13px; transition: opacity .3s ease, transform .3s var(--ease); }
  .uv-ctl .uv-hide { order: -1; width: 36px; padding: 0; justify-content: center; }
  .uv[data-clean] .uv-cat, .uv[data-clean] .uv-ctl .rd-button:not(.uv-hide) { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .uv[data-clean] .uv-ctl .uv-hide { opacity: 0; }
  .uv[data-clean] .uv-ctl .uv-hide:hover, .uv[data-clean] .uv-ctl .uv-hide:focus-visible { opacity: .8; }

  /* Final: la semana coordinada. */
  .uv-week { position: absolute; left: 50%; top: 50%; z-index: 3; width: min(680px, calc(100% - 64px)); box-sizing: border-box; padding: 26px 28px 24px; border-radius: var(--rd-radius-card); transform: translate(-50%, -46%) scale(.96); opacity: 0; filter: blur(10px); pointer-events: none; transition: opacity .8s var(--ease), transform 1s var(--ease), filter .8s var(--ease); }
  .uv[data-scene="semana"] .uv-week { opacity: 1; transform: translate(-50%, -50%); filter: none; }
  .uv-week h2 { margin: 6px 0 0; font-size: 30px; font-weight: var(--rd-weight); letter-spacing: var(--rd-track-title); line-height: 1.15; }
  .uv-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0 18px; }
  .uv-stats .rd-stat { font-size: 30px; display: block; }
  .uv-stats .rd-note { display: block; margin-top: 4px; }
  .uv-cal { display: grid; grid-template-columns: 36px repeat(5, 1fr); grid-template-rows: 22px 320px; column-gap: 6px; }
  .uv-cal-day { font-size: 12px; font-weight: var(--rd-weight); color: var(--rd-muted); text-align: center; }
  .uv-cal-hours { position: relative; grid-row: 2; }
  .uv-cal-hours span { position: absolute; right: 2px; transform: translateY(-50%); font-family: var(--rd-font-num); font-size: 10.5px; color: var(--rd-faint); }
  .uv-cal-col { position: relative; grid-row: 2; border-radius: 12px; background: rgba(255,255,255,.5); background-image: linear-gradient(to bottom, var(--rd-hairline) 0, var(--rd-hairline) 1px, transparent 1px); background-size: 100% calc(100% / 9); }
  .uv-ev { position: absolute; left: 3px; right: 3px; box-sizing: border-box; padding: 5px 7px; border-radius: 9px; overflow: hidden; background: color-mix(in srgb, var(--t) 16%, white); box-shadow: inset 3px 0 0 var(--t), 0 4px 12px rgba(40,30,90,.08); font-size: 11px; line-height: 1.25; opacity: 0; transform: scale(.85); }
  .uv-ev b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: var(--rd-weight); color: var(--rd-ink); }
  .uv-ev span { display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uv-ev span { color: var(--rd-muted); font-family: var(--rd-font-num); }
  .uv-ev.you { padding: 6px 8px; background: var(--rd-glass-solid); box-shadow: 0 0 0 1.5px var(--rd-g2), 0 8px 22px rgba(123,97,255,.25); }
  .uv[data-scene="semana"] .uv-ev { animation: uv-pop .7s var(--ease) forwards; animation-delay: var(--d); }
  @keyframes uv-pop { from { opacity: 0; transform: scale(.85) translateY(6px); } to { opacity: 1; transform: none; } }

  /* Panel del hilo */
  .uv-panel { position: relative; display: flex; flex-direction: column; min-height: 0; height: calc(100vh - 32px); margin: 16px 16px 16px 0; border-radius: var(--rd-radius-card); overflow: hidden; }
  .uv-head { position: relative; display: flex; align-items: center; gap: 12px; height: 84px; box-sizing: border-box; padding: 16px 20px; border-bottom: 1px solid var(--rd-hairline); }
  .uv-faces { display: flex; flex: 0 0 auto; }
  .uv-faces span { width: 30px; height: 30px; margin-left: -9px; border-radius: 50%; background-size: cover; box-shadow: 0 0 0 2px var(--rd-on-ink); }
  .uv-faces span:first-child { margin-left: 0; }
  .uv-hcopy { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
  .uv-hcopy .rd-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uv-hcopy .uv-topic { font-size: 18px; font-weight: var(--rd-weight); letter-spacing: var(--rd-track-title); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .uv-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; }
  .uv-prog i { display: block; height: 100%; width: 0; background: var(--rd-gradient); }

  .uv-feed { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 18px 18px 20px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 90px); mask-image: linear-gradient(to bottom, transparent 0, #000 90px); }
  .uv-item { display: flex; gap: 9px; align-items: flex-end; }
  .uv-item.mine { flex-direction: row-reverse; }
  .uv-face { width: 28px; height: 28px; border-radius: 50%; background-size: cover; box-shadow: 0 0 0 2px var(--rd-on-ink); flex: 0 0 auto; }
  .uv-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 84%; }
  .uv-item.mine .uv-col { align-items: flex-end; }
  .uv-who { padding: 0 6px; font-size: 12px; font-weight: var(--rd-weight); color: var(--rd-ink); line-height: 1.2; }
  .uv-who em { font-style: normal; font-weight: var(--rd-weight-body); color: var(--rd-muted); }
  .uv-bubble { position: relative; padding: 10px 14px 11px; border-radius: 20px 20px 20px 6px; background: var(--rd-glass-solid); border: 1px solid var(--rd-hairline); box-shadow: 0 1px 1px var(--rd-hairline), 0 10px 26px rgba(40,30,90,.06); font-size: 14.5px; line-height: 1.45; letter-spacing: -0.005em; color: var(--rd-ink); }
  .uv-item.mine .uv-bubble { border-radius: 20px 20px 6px 20px; background: color-mix(in srgb, var(--rd-g2) 8%, white); border-color: color-mix(in srgb, var(--rd-g2) 14%, transparent); box-shadow: none; }
  .uv-item.human .uv-bubble { background: var(--rd-ink); color: var(--rd-on-ink); border-color: var(--rd-ink); }
  .uv-dots { position: absolute; left: 14px; top: 50%; display: flex; gap: 4px; transform: translateY(-50%); opacity: 0; transition: opacity .25s ease; }
  .uv-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--rd-faint); animation: uv-dot 1.1s ease-in-out infinite; }
  .uv-dots i:nth-child(2) { animation-delay: .14s; } .uv-dots i:nth-child(3) { animation-delay: .28s; }
  .uv-bubble[data-typing] .uv-dots { opacity: 1; }
  @keyframes uv-dot { 0%, 80%, 100% { transform: none; opacity: .5; } 40% { transform: translateY(-3px); opacity: 1; } }

  .uv-tool { display: flex; flex-direction: column; gap: 6px; margin: 2px 0; }
  .uv-tool-who { display: flex; align-items: center; gap: 7px; padding: 0 4px; font-size: 12px; color: var(--rd-muted); }
  .uv-tool-who .uv-face { width: 18px; height: 18px; box-shadow: none; }
  .uv-tool-who b { font-weight: var(--rd-weight); color: var(--rd-ink); }

  .uv-ask { margin: 2px 0; padding: 1.5px; border-radius: 20px; background: var(--rd-gradient); box-shadow: var(--rd-shadow-glow); }
  .uv-ask > div { display: flex; flex-direction: column; gap: 9px; padding: 14px 15px 13px; border-radius: 18.5px; background: var(--rd-glass-solid); }
  .uv-ask .rd-title { font-size: 19px; }
  .uv-ask .rd-actions .rd-button { height: 36px; font-size: 14px; }
  .uv-ask-foot { display: grid; }
  .uv-ask-foot > * { grid-area: 1 / 1; transition: opacity .35s var(--ease); }
  .uv-ask-done { display: flex; align-items: center; font-size: 14px; font-weight: var(--rd-weight); color: var(--rd-ink); opacity: 0; }
  .uv-ask[data-done] .rd-actions { opacity: 0; pointer-events: none; }
  .uv-ask[data-done] .uv-ask-done { opacity: 1; }

  /* Filas compactas: ronda uno a uno y acuerdos del final. */
  .uv-pair { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 16px; background: rgba(255,255,255,.62); border: 1px solid var(--rd-hairline); }
  .uv-pair .uv-faces span { width: 24px; height: 24px; margin-left: -7px; }
  .uv-pair .uv-faces span:first-child { margin-left: 0; }
  .uv-pair-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; line-height: 1.3; }
  .uv-pair-copy b { font-weight: var(--rd-weight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uv-pair-copy span { color: var(--rd-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uv-pair.big { padding: 12px 14px; background: var(--rd-glass-solid); box-shadow: 0 10px 26px rgba(40,30,90,.08); }
  .uv-pair.big .uv-pair-copy { font-size: 14px; }
  .uv-check { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--rd-gradient); display: grid; place-items: center; }
  .uv-check svg { width: 12px; height: 12px; fill: none; stroke: var(--rd-on-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 900px) {
    .uv { grid-template-columns: 1fr; grid-template-rows: 46vh 54vh; }
    .uv-panel { margin: 0 10px 10px; }
    .uv-steps, .uv-admin { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .uv-stage canvas, .uv-week, .uv-ask-foot > *, .uv-step { transition: none; }
    .uv-dots i, .uv[data-scene="semana"] .uv-ev { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="uv rd-page" data-clean>
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <section class="uv-stage" aria-label="Universo de agentes">
    <canvas id="luz" aria-hidden="true"></canvas>
    <canvas id="c" role="img" aria-label="Globo de cien agentes. Primero cada uno conversa con cada uno; después la cámara viaja entre grupos."></canvas>
    <span class="rd-brand uv-brand"><img class="rd-mark" src="../logo/ronda-mark.svg" alt="">Ronda</span>
    <nav class="uv-steps rd-glass" aria-label="Pasos">
      <span class="uv-step" id="step0">Uno a uno</span>
      <span class="uv-step" id="step1">Grupos <b id="stepn"></b></span>
      <span class="uv-step" id="step2">Tu semana</span>
    </nav>
    <div class="uv-count" aria-live="off"><span class="rd-stat" id="pairs">0</span><span class="rd-note">de 4.950 conversaciones uno a uno</span></div>
    <div class="uv-week rd-glass" aria-label="Resultado de la vuelta">
      <span class="rd-label rd-gradient-text">Tu semana, coordinada</span>
      <h2 id="wtitle">Seis acuerdos. Cero mensajes escritos por ti.</h2>
      <div class="uv-stats" id="wstats"></div>
      <div class="uv-cal" id="wcal"></div>
    </div>
    <div class="uv-admin">
      <div class="uv-cat" aria-label="Catálogo visto en esta vuelta">
        <div class="uv-row" id="cat-tools"></div>
        <div class="uv-row" id="cat-minis"></div>
      </div>
      <div class="uv-ctl">
        <button type="button" class="rd-button" id="pause">Pausar</button>
        <button type="button" class="rd-button rd-button--quiet" id="next">Siguiente</button>
        <button type="button" class="rd-button rd-button--quiet uv-hide" id="hide" aria-label="Mostrar controles (H)" title="Mostrar controles (H)">⌃</button>
      </div>
    </div>
  </section>
  <aside class="uv-panel rd-glass ss-stage" aria-label="Hilo">
    <header class="uv-head">
      <div class="uv-faces" id="hfaces"></div>
      <div class="uv-hcopy"><span class="rd-label" id="hsub"></span><span class="uv-topic" id="htopic"></span></div>
      <div class="uv-prog"><i id="fbar"></i></div>
    </header>
    <div class="uv-feed" id="feed" aria-live="polite"></div>
  </aside>
</div>
<script src="../luz/luz.js"></script>
<script src="./mini/calendar-edge.js"></script>
<script src="./mini/motion-paint.js"></script>
<script src="./hilo/stream.js"></script>
<script src="./hilo/tools.js"></script>
<script src="./hilo/edge.js"></script>
<script src="./universo.js"></script>
<script>
// ───────── Datos ─────────
const U = RondaUniverse, people = U.people(), POS = U.sphere();
const GROUPS = U.groups(POS, 14, 7);
const SHOWN = GROUPS.slice(0, 6);   // una vuelta: estos grupos y luego la semana
const SCRIPTS = SHOWN.map((g, i) => U.script(g, people, { ask: i % 3 === 0 }));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const faceUrl = p => p.face.startsWith('team:') ? '../faces/' + p.face.slice(5) + '.png' : null;
const atlas = new Image(); atlas.src = '../faces/atlas/faces.png';
const atlasBlur = new Image(); atlasBlur.src = '../faces/atlas/faces-blur.png';
const teamImg = {}; people.slice(0, 5).forEach((p, i) => { const im = new Image(); im.src = faceUrl(p); teamImg[i] = im; });
const tileCss = i => { const t = +people[i].face.slice(5); return { backgroundImage: 'url(../faces/atlas/faces.png)', backgroundSize: '800% 800%', backgroundPosition: (t % 8) * 100 / 7 + '% ' + Math.floor(t / 8) * 100 / 7 + '%' }; };
const faceCss = i => i < 5 ? { backgroundImage: 'url(' + faceUrl(people[i]) + ')', backgroundSize: 'cover' } : tileCss(i);
const COLS = ['#1e9bff', '#7b61ff', '#e840d8', '#ff3b6b', '#ff8a1f'];

// Ronda uno a uno: destellos deterministas (pares al azar) y filas para el panel.
const RONDA = { dur: 10, flashEnd: 7.4 };
const FLASH = (() => { const r = U.rnd(42), out = []; for (let j = 0; j < 320; j++) { let a = Math.floor(r() * U.N), b = Math.floor(r() * U.N); if (a === b) b = (b + 1) % U.N; out.push({ a, b, t: RONDA.flashEnd * Math.pow(j / 320, 0.9) + r() * 0.15 }); } return out; })();
const TICKS = (() => { const r = U.rnd(9), out = []; for (let t = 0.5, j = 0; t < RONDA.flashEnd; t += 0.34 - 0.18 * (t / RONDA.flashEnd), j++) { const a = Math.floor(r() * U.N), b = (a + 1 + Math.floor(r() * (U.N - 1))) % U.N; out.push({ t, a, b, text: U.MATCHES[j % U.MATCHES.length] }); } return out; })();

// Escenas: uno a uno, cada grupo, la semana. Vuelve a empezar.
const SCENES = [{ kind: 'ronda', dur: RONDA.dur }].concat(SHOWN.map((g, i) => ({ kind: 'group', i, dur: SCRIPTS[i].duration + 2.4 }))).concat([{ kind: 'semana', dur: 15 }]);

// ───────── Catálogo (oculto con los controles) ─────────
const catTools = document.getElementById('cat-tools'), catMinis = document.getElementById('cat-minis');
const tagEls = {}, miniEls = {};
U.CATALOG.forEach(c => { const f = RondaTools.FLAVORS[RondaTools.flavorOf(c.name)]; const e = document.createElement('span'); e.className = 'uv-tag'; e.style.setProperty('--t', f.tint); e.innerHTML = '<i></i>'; e.append(c.name); catTools.append(e); tagEls[c.name] = e; });
U.motionKinds.forEach(k => { const e = document.createElement('span'); e.className = 'uv-tag'; e.style.setProperty('--t', RondaEdge.TINT[k]); e.innerHTML = '<i></i>'; e.append('miniatura · ' + k); catMinis.append(e); miniEls[k] = e; });

// ───────── Panel ─────────
const root = document.querySelector('.uv'), feed = document.getElementById('feed');
let si = 0, scene = SCENES[0], current = null, clock = 0, paused = false, items = [], shownTicks = 0;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function faces(list) { const w = el('div', 'uv-faces'); list.forEach(m => { const s = el('span'); Object.assign(s.style, faceCss(m)); w.append(s); }); return w; }
function header(list, sub, topic) {
  document.getElementById('hfaces').replaceChildren(...faces(list).children);
  document.getElementById('hsub').textContent = sub; document.getElementById('htopic').textContent = topic;
}
function clearFeed() { items = []; [...feed.children].forEach(c => c.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-10px)', filter: 'blur(4px)' }], { duration: 360, easing: 'ease-in', fill: 'forwards' }).onfinish = () => c.remove()); }
function push(node) { RondaStream.append(feed, node); while (feed.children.length > 16) feed.firstElementChild.remove(); }
function pairRow(list, title, sub, big, check) {
  const n = el('div', 'uv-pair' + (big ? ' big' : ''));
  if (check) { const c = el('span', 'uv-check'); c.innerHTML = '<svg viewBox="0 0 12 12"><path d="M2.5 6.3 5 8.7l4.6-5"/></svg>'; n.append(c); }
  const copy = el('div', 'uv-pair-copy'); copy.append(el('b', '', title), el('span', '', sub));
  n.append(faces(list), copy); return n;
}
function setSteps() {
  const k = scene.kind === 'ronda' ? 0 : scene.kind === 'group' ? 1 : 2;
  [0, 1, 2].forEach(j => { const s = document.getElementById('step' + j); s.toggleAttribute('data-on', j === k); s.toggleAttribute('data-done', j < k); });
  document.getElementById('stepn').textContent = scene.kind === 'group' ? (scene.i + 1) + '/' + SHOWN.length : '';
  root.dataset.scene = scene.kind;
}
function startScene(k) {
  si = (k + SCENES.length) % SCENES.length; scene = SCENES[si]; clock = 0; current = null; shownTicks = 0;
  clearFeed(); setSteps();
  if (scene.kind === 'ronda') {
    header([1, 2, 3, 4], 'Paso 1 · antes de formar grupos', 'Cada agente conversa con cada uno');
    turnTo([0]);
  } else if (scene.kind === 'group') {
    const g = SHOWN[scene.i], sc = SCRIPTS[scene.i];
    current = { g, events: sc.events, duration: sc.duration, shown: new Set() };
    header(g.members, g.members.length + ' agentes · pide ' + people[g.members[0]].name, g.topic);
    turnTo(g.members);
  } else {
    header([0], 'Paso 3 · resultado de la vuelta', 'Lo que quedó acordado');
    turnTo([0]); buildWeek();
  }
}
function addItem(e) {
  const req = current.g.members[0], mine = e.from === req;

setClean(!(q.get('ui') === '1' || (() => { try { return localStorage.getItem('uv-ui') === '1'; } catch (_) { return false; } })()));
// ?s= escena inicial (0 = uno a uno, 1..6 grupos, 7 = semana) y ?t= segundo dentro de ella. ?g= sigue funcionando.
startScene(q.has('s') ? +q.get('s') : q.has('g') ? 1 + +q.get('g') : 0);
if (q.has('t')) { clock = +q.get('t'); T = clock; }
requestAnimationFrame(frame);
</script>
