<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montu · Universo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e9bff'/%3E%3Cstop offset='.5' stop-color='%23e840d8'/%3E%3Cstop offset='1' stop-color='%23ff8a1f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='20' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ronda.css">
<link rel="stylesheet" href="./hilo/stream.css">
<link rel="stylesheet" href="./hilo/tools.css">
<style>
  /* PANEL DEMO OMNIPOTENTE (ver universo.js y AGENTS.md regla 6): todo lo nuevo aparece aquí.
     Sigue el estándar de contexto/resumen.html: barra rd-top, tarjetas rd-card rd-glass, una sola escala
     de radios (28, 16, 12, 6, píldora) y relieve solo en lo que se aprieta y en las marcas de datos. */
  html, body { margin: 0; height: 100%; }
  .uv { --ease: cubic-bezier(.32,.72,0,1); position: relative; height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 420px; overflow: hidden; background: var(--rd-bg); }
  .uv-stage { position: relative; min-width: 0; }
  .uv-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 1s var(--ease), transform 1.2s var(--ease); }
  .uv[data-scene="semana"] .uv-stage canvas { opacity: 0; transform: scale(.92); }

  /* Barra: marca, los tres pasos como pestañas y la nota de datos de prueba. */
  .uv-top { position: absolute; left: 28px; right: 28px; top: 0; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; }
  .uv-top .rd-tag { justify-self: end; }
  .uv-top .rd-nav > * { transition: background-color .45s var(--ease), color .45s var(--ease); }
  .uv-top .rd-nav b { display: inline-block; min-width: 2.1em; font-weight: var(--rd-weight); font-family: var(--rd-font-num); font-variant-numeric: tabular-nums; transition: opacity .3s ease; }
  .uv-top .rd-nav b:empty { display: none; }
  /* ?embed: dentro de la app (pestaña Globo) la marca y la nota de datos de prueba las pone la app. */
  .uv[data-embed] .uv-top { grid-template-columns: 1fr; justify-items: center; }
  .uv[data-embed] .uv-top .rd-brand, .uv[data-embed] .uv-top .rd-tag { display: none; }
  /* ?vivo: la ronda real de la mesa. Tres estados (Listos, Conversando, Resumen) y sin controles de quien presenta la demo. */
  .uv[data-vivo] .uv-admin, .uv[data-vivo] .uv-top { display: none; }
  /* El globo se gira arrastrando; una cara bajo el puntero se agranda y dice quién es. */
  .uv-stage #c { cursor: grab; touch-action: pan-y; }
  .uv-stage[data-over] #c { cursor: pointer; }
  .uv-stage[data-drag] #c { cursor: grabbing; }

  /* Controles de quien presenta: ocultos por defecto (botón, tecla H, ?ui=1). */
  .uv-admin { position: absolute; left: 20px; bottom: 18px; right: 20px; z-index: 4; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .uv-admin > * { pointer-events: auto; }
  .uv-cat { display: flex; flex-direction: column; gap: 6px; transition: opacity .35s var(--ease), transform .35s var(--ease); }
  .uv-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .uv-tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px 0 3px; border-radius: var(--rd-radius-pill); font-size: 10.5px; font-weight: var(--rd-weight); background: rgba(255,255,255,.55); color: var(--rd-faint); transition: background .4s ease, color .4s ease; }
  .uv-tag i { width: 14px; height: 14px; border-radius: 6px; background: color-mix(in srgb, var(--t) 20%, white); }
  .uv-tag[data-seen] { background: rgba(255,255,255,.92); color: var(--rd-ink); }
  .uv-tag[data-seen] i { background: var(--t); }
  .uv-tag[data-now] { box-shadow: 0 0 0 1.5px var(--t); }
  .uv-ctl { display: flex; gap: 8px; }
  .uv-ctl .rd-button { flex: 0 0 auto; height: 36px; padding: 0 16px; font-size: 13px; transition: opacity .3s ease, transform .3s var(--ease); }
  .uv-ctl .uv-hide { order: -1; width: 36px; padding: 0; justify-content: center; }
  .uv[data-clean] .uv-cat, .uv[data-clean] .uv-ctl .rd-button:not(.uv-hide) { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .uv[data-clean] .uv-ctl .uv-hide { opacity: 0; }
  .uv[data-clean] .uv-ctl .uv-hide:hover, .uv[data-clean] .uv-ctl .uv-hide:focus-visible { opacity: .8; }

  /* Final: la semana. Una tarjeta del Resumen: título simple, números grandes y el calendario. */
  .uv-week { position: absolute; left: 50%; top: calc(50% + 33px); z-index: 2; width: min(680px, calc(100% - 64px)); box-sizing: border-box; gap: 0; transform: translate(-50%, -48%) scale(.97); opacity: 0; pointer-events: none; transition: opacity .8s var(--ease), transform 1s var(--ease); }
  .uv[data-scene="semana"] .uv-week { opacity: 1; transform: translate(-50%, -50%); }
  .uv-ctitle { margin: 0; font-size: 18px; font-weight: var(--rd-weight); letter-spacing: -0.02em; line-height: 1.25; }
  .uv-stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 16px; align-items: start; margin: 18px 0 22px; }
  .uv-num { display: block; font-family: var(--rd-font-num); font-size: 44px; font-weight: var(--rd-weight); letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
  .uv-stats .rd-note { display: block; margin-top: 6px; white-space: nowrap; }
  .uv-cal { display: grid; grid-template-columns: 36px repeat(5, minmax(0, 1fr)); grid-template-rows: 22px 420px; column-gap: 6px; }
  .uv-cal-day { font-size: 12px; font-weight: var(--rd-weight); color: var(--rd-muted); text-align: center; }
  .uv-cal-hours { position: relative; grid-row: 2; }
  .uv-cal-hours span { position: absolute; right: 2px; transform: translateY(-50%); font-family: var(--rd-font-num); font-size: 11px; color: var(--rd-faint); }
  .uv-cal-col { position: relative; grid-row: 2; border-radius: 12px; background: rgba(255,255,255,.45); background-image: linear-gradient(to bottom, var(--rd-hairline) 0, var(--rd-hairline) 1px, transparent 1px); background-size: 100% calc(100% / 9); }
  .uv-ev { position: absolute; left: 3px; right: 3px; box-sizing: border-box; min-height: 56px; padding: 6px 8px; border-radius: 6px; border: 1.5px solid transparent; background: rgba(255,255,255,.92) padding-box; box-shadow: 0 2px 0 rgba(60,60,90,.1), 0 6px 14px rgba(40,30,90,.06); font-size: 11.5px; line-height: 1.25; opacity: 0; transform: scale(.9); }
  .uv-ev b { display: block; font-weight: var(--rd-weight); color: var(--rd-ink); }
  .uv-ev span { display: block; margin-top: 2px; color: var(--rd-muted); font-family: var(--rd-font-num); }
  .uv-ev.you { background: linear-gradient(#fff, #fff) padding-box, var(--rd-gradient) border-box; z-index: 1; }
  .uv[data-scene="semana"] .uv-ev { animation: uv-pop .7s var(--ease) forwards; animation-delay: var(--d); }
  @keyframes uv-pop { from { opacity: 0; transform: scale(.9) translateY(6px); } to { opacity: 1; transform: none; } }

  /* Panel: una tarjeta del Resumen. Arriba, el tema y el grupo; abajo, el hilo anclado al pie. */
  .uv-panel { position: relative; height: calc(100vh - 50px); margin: 26px 24px 24px 0; padding: 22px 22px 0; box-sizing: border-box; gap: 0; overflow: hidden; }
  .uv-head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 3px; padding-bottom: 16px; border-bottom: 1px solid var(--rd-hairline); }
  .uv-members { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin-top: 14px; }
  .uv-members:empty { display: none; }
  .uv-member { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .uv-member .uv-face { width: 32px; height: 32px; }
  .uv-member div { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .uv-member b { font-size: 15px; font-weight: var(--rd-weight); letter-spacing: -0.01em; }
  .uv-member span { font-size: 13px; color: var(--rd-muted); }

  .uv-feed > :first-child { margin-top: auto; }
  .uv[data-scene="semana"] .uv-feed > :first-child { margin-top: 0; }
  .uv-feed::-webkit-scrollbar { display: none; }
  .uv-feed { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden auto; scrollbar-width: none; overscroll-behavior: contain; display: flex; flex-direction: column; justify-content: flex-start; gap: 14px; padding: 18px 0 22px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px); mask-image: linear-gradient(to bottom, transparent 0, #000 22px); }
  .uv[data-scene="ronda"] .uv-feed, .uv[data-scene="semana"] .uv-feed { gap: 0; }
  .uv[data-scene="semana"] .uv-feed { justify-content: flex-start; -webkit-mask-image: none; mask-image: none; padding-top: 6px; }
  .uv-feed > * { will-change: transform; flex-shrink: 0; }
  .uv-item { display: flex; gap: 9px; align-items: flex-end; }
  .uv-item.mine { flex-direction: row-reverse; }
  .uv-face { width: 28px; height: 28px; border-radius: 50%; background-size: cover; box-shadow: var(--rd-shadow-face-small); flex: 0 0 auto; }
  .uv-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 84%; }
  .uv-item.mine .uv-col { align-items: flex-end; }
  .uv-who { padding: 0 6px; font-size: 12px; font-weight: var(--rd-weight); color: var(--rd-ink); line-height: 1.2; }
  .uv-who em { font-style: normal; font-weight: var(--rd-weight-body); color: var(--rd-muted); }
  .uv-bubble { position: relative; padding: 10px 14px 11px; border-radius: 16px 16px 16px 6px; background: var(--rd-glass-solid); border: 1px solid var(--rd-hairline); box-shadow: 0 1px 1px var(--rd-hairline), 0 10px 26px rgba(40,30,90,.06); font-size: 14.5px; line-height: 1.45; letter-spacing: -0.005em; color: var(--rd-ink); }
  .uv-item.mine .uv-bubble { border-radius: 16px 16px 6px 16px; background: color-mix(in srgb, var(--rd-g2) 7%, white); border-color: color-mix(in srgb, var(--rd-g2) 12%, transparent); box-shadow: none; }
  .uv-item.human .uv-bubble { background: var(--rd-ink); color: var(--rd-on-ink); border-color: var(--rd-ink); }
  .uv-dots { position: absolute; left: 14px; top: 50%; display: flex; gap: 4px; transform: translateY(-50%); opacity: 0; transition: opacity .25s ease; }
  .uv-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--rd-faint); animation: uv-dot 1.1s ease-in-out infinite; }
  .uv-dots i:nth-child(2) { animation-delay: .14s; } .uv-dots i:nth-child(3) { animation-delay: .28s; }
  .uv-bubble[data-typing] .uv-dots { opacity: 1; }
  @keyframes uv-dot { 0%, 80%, 100% { transform: none; opacity: .5; } 40% { transform: translateY(-3px); opacity: 1; } }

  .uv-tool { display: flex; flex-direction: column; gap: 6px; margin: 2px 0; }
  .uv-tool-who { display: flex; align-items: center; gap: 7px; padding: 0 4px; font-size: 12px; color: var(--rd-muted); }
  .uv-tool-who .uv-face { width: 18px; height: 18px; box-shadow: none; }
  .uv-tool-who b { font-weight: var(--rd-weight); color: var(--rd-ink); }

  .uv-ask { margin: 2px 0; padding: 1.5px; border-radius: 17.5px; background: var(--rd-gradient); box-shadow: var(--rd-shadow-glow); }
  .uv-ask > div { display: flex; flex-direction: column; gap: 9px; padding: 14px 15px 13px; border-radius: 16px; background: var(--rd-glass-solid); }
  .uv-ask .rd-title { font-size: 19px; }
  .uv-ask .rd-actions .rd-button { height: 36px; font-size: 14px; }
  .uv-ask-foot { display: grid; }
  .uv-ask-foot > * { grid-area: 1 / 1; transition: opacity .35s var(--ease); }
  .uv-ask-done { display: flex; align-items: center; font-size: 14px; font-weight: var(--rd-weight); color: var(--rd-ink); opacity: 0; }
  .uv-ask[data-done] .rd-actions { opacity: 0; pointer-events: none; }
  .uv-ask[data-done] .uv-ask-done { opacity: 1; }

  /* Filas de lista, como las del Resumen: cara, título en 600, una línea gris y el check al final. */
  .uv-li { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 2px; box-sizing: border-box; }
  .uv-li + .uv-li { border-top: 1px solid var(--rd-hairline); }
  .uv-li-text > span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* Tarjeta de la persona tocada en el globo: cara, nombre y su estado rápido. */
  .uv-who-card { position: absolute; left: 24px; bottom: 24px; z-index: 4; width: min(300px, calc(100% - 48px)); box-sizing: border-box; padding: 16px; gap: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .3s var(--ease), transform .4s var(--ease); }
  .uv-who-card[data-on] { opacity: 1; transform: none; pointer-events: auto; }
  .uv-who-card header { display: flex; align-items: center; gap: 12px; }
  .uv-who-card header .uv-face { width: 44px; height: 44px; }
  .uv-who-card header b { display: block; font-size: 17px; }
  .uv-who-card header span { color: var(--rd-muted); font-size: 13px; }
  .uv-who-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .uv-who-grid div { padding: 9px 11px; border-radius: 12px; background: var(--rd-fill-soft); }
  .uv-who-grid small { display: block; color: var(--rd-muted); font-size: 12px; }
  .uv-who-grid b { font-size: 15px; font-family: var(--rd-font-num); }
  .uv-who-card p { margin: 0; font-size: 13.5px; color: var(--rd-muted); line-height: 1.4; }
  .uv-who-card p b { color: var(--rd-ink); font-weight: var(--rd-weight); }
  .uv-li .uv-faces { display: flex; flex: 0 0 auto; width: 78px; }
  .uv-li .uv-face { width: 34px; height: 34px; }
  .uv-li .uv-face + .uv-face { margin-left: -12px; }
  .uv-li-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .uv-li-text b { font-size: 15px; font-weight: var(--rd-weight); letter-spacing: -0.01em; line-height: 1.3; }
  .uv-li-text span { font-size: 13px; color: var(--rd-muted); line-height: 1.35; }
  .uv-check { flex: 0 0 auto; width: 18px; height: 18px; color: var(--rd-ink); }
  .uv-check svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 900px) {
    .uv { grid-template-columns: 1fr; grid-template-rows: 46vh 54vh; }
    .uv-top { left: 14px; right: 14px; }
    .uv-top .rd-tag, .uv-admin { display: none; }
    .uv-top .rd-brand { font-size: 0; gap: 0; }
    .uv-top .rd-mark { width: 30px; height: 30px; }
    .uv-top .rd-nav > * { height: 30px; padding: 0 10px; font-size: 13px; }
    .uv-top .rd-nav b { min-width: 1.9em; }
    .uv-panel { height: auto; margin: 0 10px 10px; padding: 16px 16px 0; }
    .uv-members { display: flex; gap: 0; margin-top: 10px; }
    .uv-member div { display: none; }
    .uv-member + .uv-member { margin-left: -8px; }
    .uv-week { top: calc(50% + 24px); width: calc(100% - 28px); padding: 16px 18px; }
    .uv-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 12px 0 0; }
    .uv-num { font-size: 32px; }
    .uv-stats .rd-note { white-space: normal; }
    .uv-cal { display: none; }
    .uv-who-card { left: 10px; right: 10px; bottom: 10px; width: auto; padding: 10px 12px; gap: 8px; }
    .uv-who-card header .uv-face { width: 30px; height: 30px; }
    .uv-who-card header b { display: inline; font-size: 15px; }
    .uv-who-card header span { display: none; }
    .uv-who-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .uv-who-grid div { padding: 6px 8px; }
    .uv-who-grid b { font-size: 13px; }
    .uv-who-card p { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }
  @media (prefers-reduced-motion: reduce) {
    .uv-stage canvas, .uv-week, .uv-ask-foot > *, .uv-top .rd-nav > *, .uv-top .rd-nav b { transition: none; }
    .uv-dots i, .uv[data-scene="semana"] .uv-ev { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>

<div class="uv rd-page" data-clean>
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <section class="uv-stage" aria-label="Universo de agentes">
    <canvas id="luz" aria-hidden="true"></canvas>
    <canvas id="c" role="img" aria-label="Globo de cien agentes. Primero cada uno conversa con cada uno; después la cámara viaja entre grupos."></canvas>
    <header class="rd-top uv-top">
      <a class="rd-brand" href="../contexto/resumen.html" aria-label="Montu"><img class="rd-mark" src="../logo/montu-mark.svg" alt="">Montu</a>
      <nav class="rd-nav" aria-label="Pasos de la demo">
        <span id="step0">Uno a uno</span>
        <span id="step1">Grupos <b id="stepn"></b></span>
        <span id="step2">Tu semana</span>
      </nav>
      <span class="rd-tag">Datos de prueba</span>
    </header>
    <section class="uv-week rd-card rd-glass" aria-label="Tu semana">
      <h2 class="uv-ctitle">Tu semana</h2>
      <div class="uv-stats" id="wstats"></div>
      <div class="uv-cal" id="wcal"></div>
    </section>
    <section class="uv-who-card rd-card rd-glass" id="who" aria-live="polite"></section>
    <div class="uv-admin">
      <div class="uv-cat" aria-label="Catálogo visto en esta vuelta">
        <div class="uv-row" id="cat-tools"></div>
        <div class="uv-row" id="cat-minis"></div>
      </div>
      <div class="uv-ctl">
        <button type="button" class="rd-button" id="pause">Pausar</button>

      </div>
    </div>
  </section>
  <aside class="uv-panel rd-card rd-glass ss-stage" aria-label="Hilo">
    <header class="uv-head">
      <h2 class="uv-ctitle" id="htitle"></h2>
      <span class="rd-note" id="hsub"></span>
      <div class="uv-members" id="hmembers"></div>
    </header>
    <div class="uv-feed" id="feed" aria-live="polite"></div>

<script src="./mini/calendar-edge.js"></script>

<script>
// ───────── Datos ─────────
// En vivo (?vivo=…): universo-vivo.js reemplaza personas, grupos y guiones por la ronda real de la mesa. LIVE.on dice qué lugares de la esfera tienen a alguien.
let LIVE = null;
const U = RondaUniverse, people = U.people(), POS = U.sphere();
const GROUPS = U.groups(POS, 14, 7);
const SHOWN = GROUPS.slice(0, 6);   // una vuelta: estos grupos y luego la semana
const SCRIPTS = SHOWN.map((g, i) => U.script(g, people, { ask: i % 3 === 0 }));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const faceUrl = p => p.face.startsWith('team:') ? '../faces/' + p.face.slice(5) + '.png' : null;
const atlas = new Image(); atlas.src = '../faces/atlas/faces.png';
const atlasBlur = new Image(); atlasBlur.src = '../faces/atlas/faces-blur.png';
const teamImg = {}; people.slice(0, 5).forEach((p, i) => { const im = new Image(); im.src = faceUrl(p); teamImg[i] = im; });
const tileCss = i => { const t = +people[i].face.slice(5); return { backgroundImage: 'url(../faces/atlas/faces.png)', backgroundSize: '800% 800%', backgroundPosition: (t % 8) * 100 / 7 + '% ' + Math.floor(t / 8) * 100 / 7 + '%' }; };
const faceCss = i => i < 5 && !LIVE ? { backgroundImage: 'url(' + faceUrl(people[i]) + ')', backgroundSize: 'cover' } : tileCss(i);
const COLS = ['#1e9bff', '#7b61ff', '#e840d8', '#ff3b6b', '#ff8a1f'];

// Ronda uno a uno: destellos deterministas (pares al azar) y filas para el panel.
const RONDA = { dur: 10, flashEnd: 7.4 };
const FLASH = (() => { const r = U.rnd(42), out = []; for (let j = 0; j < 320; j++) { let a = Math.floor(r() * U.N), b = Math.floor(r() * U.N); if (a === b) b = (b + 1) % U.N; out.push({ a, b, t: RONDA.flashEnd * Math.pow(j / 320, 0.9) + r() * 0.15 }); } return out; })();
const TICKS = (() => { const r = U.rnd(9), out = []; for (let t = 0.5, j = 0; t < RONDA.flashEnd; t += 0.34 - 0.18 * (t / RONDA.flashEnd), j++) { const a = Math.floor(r() * U.N), b = (a + 1 + Math.floor(r() * (U.N - 1))) % U.N; out.push({ t, a, b, text: U.MATCHES[j % U.MATCHES.length] }); } return out; })();

// Escenas: uno a uno, cada grupo, la semana. Vuelve a empezar.
const SCENES = [{ kind: 'ronda', dur: RONDA.dur }].concat(SHOWN.map((g, i) => ({ kind: 'group', i, dur: SCRIPTS[i].duration + 2.4 }))).concat([{ kind: 'semana', dur: 15 }]);

  }
  // En vivo, mientras un agente busca: un pulso viaja por el arco hacia cada persona que revisa y una onda sale de quien pide.
  if (LIVE && LIVE.scan && P[LIVE.scan.from]) {
    const sc = LIVE.scan, a = sc.from, pa = P[a], age = clock - sc.at;
    const targets = sc.to === null ? P.map((p, i) => i).filter(i => i !== a && LIVE.on[i]) : [sc.to];
    targets.forEach((b, n) => { const pb = P[b], g = grad(pa.x, pa.y, pb.x, pb.y), u = (age * 0.5 + n * 0.21) % 1;
      ctx.save(); ctx.globalAlpha = 0.5 * smooth(0, 0.5, age); ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.setLineDash([2, 7]); ctx.lineDashOffset = -clock * 16;
      const c = curve(a, b, 0, 1, ARC_LIFT); ctx.stroke(); ctx.setLineDash([]);
      [0, 0.07, 0.14].forEach((lag, k) => { const v = Math.max(0, u - lag), w = 1 - v, x = w * w * pa.x + 2 * w * v * c.x + v * v * pb.x, y = w * w * pa.y + 2 * w * v * c.y + v * v * pb.y;
        ctx.globalAlpha = Math.sin(u * Math.PI) * (0.95 - k * 0.3); ctx.fillStyle = COLS[(n + k) % COLS.length]; ctx.shadowColor = COLS[2]; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(x, y, (5 - k * 1.3) * Math.max(0.8, kS), 0, 6.2832); ctx.fill(); });
      const hit = smooth(0.8, 1, u); if (hit > 0) { ctx.shadowBlur = 0; ctx.globalAlpha = (1 - hit) * 0.7 + 0.15; ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pb.x, pb.y, (20 + hit * 16) * Math.max(0.8, kS) * pb.f, 0, 6.2832); ctx.stroke(); }
      ctx.restore(); });
    [0, 0.5].forEach(lag => { const r = (age * 0.45 + lag) % 1; ctx.save(); ctx.globalAlpha = (1 - r) * 0.55; ctx.strokeStyle = grad(pa.x - 60, pa.y, pa.x + 60, pa.y); ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(pa.x, pa.y, (26 + r * 54) * Math.max(0.8, kS), 0, 6.2832); ctx.stroke(); ctx.restore(); });
  }
  // Personas, de atrás hacia adelante, con niebla y desenfoque graduales.
  const order = P.map((p, i) => i).sort((a, b) => P[a].z - P[b].z);
  const youScene = scene.kind !== 'group';
  HITS.length = 0;
  for (const i of order) {
    if (LIVE && !LIVE.on[i]) continue;
    const pointed = i === POINT.over || i === POINT.picked;
    HOV[i] = (HOV[i] || 0) + ((pointed ? 1 : 0) - (HOV[i] || 0)) * 0.22;
    const p = P[i], fog = smooth(0.45, -0.75, p.z), blur = smooth(0.3, -0.55, p.z), hv = HOV[i], focus = focusSet.has(i) || (youScene && i === 0) || hv > 0.5;
    const edge = 0.5 + 0.5 * Math.min(1, Math.abs(p.z) * 1.6), pp = pop.get(i) || 0;
    const back = focus ? 1 : 1 - calm * (1 - smooth(-0.45, 0.15, p.z) * 0.9) - calm * 0.1;   // el hemisferio de atrás casi desaparece
    if (back < 0.03) continue;
    const rest = (9 - 2 * calm) * (1 + 0.45 * pp) * kS * p.f * edge, big = 22 * kS * p.f;
    const r = focusSet.has(i) || (youScene && i === 0) ? big : rest + (big - rest) * hv;
    if (p.z > -0.35) HITS.push({ i, x: p.x, y: p.y, r: Math.max(r, 12) });
    ctx.save(); ctx.globalAlpha = (1 - 0.5 * fog) * (focus ? 1 : back * (1 - 0.35 * calm));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, r + (focus ? 3 : 1.5), 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.clip();
    if (i < 5 && !LIVE) { if (teamImg[i].complete) { if (blur > 0.05) ctx.filter = 'blur(' + (blur * 2).toFixed(1) + 'px)'; ctx.drawImage(teamImg[i], p.x - r, p.y - r, r * 2, r * 2); } }
    else { const t = +people[i].face.slice(5), sx = (t % 8) * 128 + 4, sy = Math.floor(t / 8) * 128 + 4;
      if (blur > 0.05 && atlasBlur.complete) ctx.drawImage(atlasBlur, sx, sy, 120, 120, p.x - r, p.y - r, r * 2, r * 2);
      if (atlas.complete) { ctx.globalAlpha *= 1 - blur; ctx.drawImage(atlas, sx, sy, 120, 120, p.x - r, p.y - r, r * 2, r * 2); } }
    const veil = focus ? 0.5 * fog : Math.min(0.85, 0.5 * fog + 0.5 * calm);   // niebla de vidrio: menos color fuera de foco
    if (veil > 0.02) { ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(244,244,250,' + veil.toFixed(3) + ')'; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2); }
    ctx.restore();
    if (pp > 0.05 && !focus) { ctx.save(); ctx.globalAlpha = pp; ctx.strokeStyle = grad(p.x - r, p.y, p.x + r, p.y); ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(p.x, p.y, r + 3.5, 0, 6.2832); ctx.stroke(); ctx.restore(); }
    if (focus) { const cg = ctx.createConicGradient(T * 0.6 + i, p.x, p.y); COLS.concat([COLS[0]]).forEach((c, k) => cg.addColorStop(k / 5, c));
      ctx.strokeStyle = cg; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, 6.2832); ctx.stroke();
      ctx.save(); ctx.font = '600 13px -apple-system, system-ui, sans-serif'; ctx.fillStyle = '#1d1d1f'; ctx.textBaseline = 'middle'; ctx.shadowColor = 'rgba(247,247,250,0.95)'; ctx.shadowBlur = 8;
      if (i === 0) { ctx.textAlign = 'center'; ctx.fillText('Tú', p.x, p.y - r - 14); } else { ctx.textAlign = p.x >= CX ? 'left' : 'right'; ctx.fillText(people[i].name, p.x + (p.x >= CX ? r + 12 : -r - 12), p.y); }
      ctx.restore(); }
  }
  // Arco activo: los puntos viajan al escribir; la miniatura de la herramienta flota fuera del arco, atada a él.
  Object.values(tagEls).forEach(x => x.removeAttribute('data-now')); Object.values(miniEls).forEach(x => x.removeAttribute('data-now'));
  if (activeEv && current) {
    const a = activeEv.from, b = activeEv.to, c = ctrl(a, b, ARC_LIFT);
    const evs = current.events.filter(e => (e.from === a && e.to === b) || (e.from === b && e.to === a)).map(e => Object.assign({}, e, { author: e.from === a ? 0 : 1, type: e.type === 'ask' ? 'message' : e.type }));
    const st = RondaEdge.state(evs, clock), arc = { from: P[a], to: P[b], control: c };
    if (st.phase === 'tool' || st.phase === 'done') {
      const mx = 0.25 * P[a].x + 0.5 * c.x + 0.25 * P[b].x, my = 0.25 * P[a].y + 0.5 * c.y + 0.25 * P[b].y;
      let dx = mx - CX, dy = my - CY; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const off = 100 * kS, ox = dx * off, oy = dy * off, show = st.phase === 'tool' ? smooth(0, 0.12, st.p) : 1 - smooth(0.55, 1, st.d);
      ctx.save(); ctx.globalAlpha = show * 0.9; ctx.setLineDash([2, 4]); ctx.strokeStyle = 'rgba(29,29,31,0.45)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + ox * 0.7, my + oy * 0.7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mx, my, 3.5, 0, 6.2832); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(ox * (0.6 + 0.4 * show), oy * (0.6 + 0.4 * show)); ctx.globalAlpha = Math.max(0.001, show);
      RondaEdge.paint(ctx, arc, st, { size: 78 * kS, u: 0.5, faces: LIVE ? [] : [teamImg[a], teamImg[b]] }); ctx.restore();
    } else if (st.phase === 'typing') RondaEdge.paint(ctx, arc, st, { size: 52 * kS, u: 0.5 });
    if (activeEv.type === 'call') { tagEls[activeEv.name] && tagEls[activeEv.name].setAttribute('data-now', ''); const k = RondaTools.motionKind(activeEv.name); miniEls[k] && miniEls[k].setAttribute('data-now', ''); }
  }
}

// ───────── Puntero: arrastrar gira el globo; pasar por una cara o tocarla dice quién es ─────────
const stage = document.querySelector('.uv-stage');
function faceAt(e) { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (let k = HITS.length - 1; k >= 0; k--) { const h = HITS[k]; if (Math.hypot(h.x - x, h.y - y) <= h.r + 4) return h.i; } return -1; }
// Al tocar una cara: quién es y, si lo comparte, su energía, carga, sueño, pasos y en qué está.
const whoCard = document.getElementById('who');
const LEVEL = { baja: 'Baja', media: 'Media', alta: 'Alta' };
function showWho(i) {
  if (i < 0) { whoCard.removeAttribute('data-on'); return; }
  const st = people[i].stats, head = el('header'), id = el('div');
  id.append(el('b', '', i === 0 ? 'Tú' : people[i].name), el('span', '', i === 0 ? 'Tu agente' : 'Su agente'));
  head.append(face(i), id);
  const parts = [head];
  if (st && st.shares) {
    const grid = el('div', 'uv-who-grid');
    const cell = (label, value) => { if (value === null || value === undefined || value === 'sin_datos') return; const d = el('div'); d.append(el('small', '', label), el('b', '', value)); grid.append(d); };
    cell('Energía', LEVEL[st.energy]); cell('Carga', LEVEL[st.load]);
    cell('Sueño', st.sleepHours == null ? null : (Math.round(st.sleepHours * 10) / 10).toLocaleString('es-CL') + ' h');
    cell('Pasos', st.steps == null ? null : st.steps.toLocaleString('es-CL'));
    if (grid.children.length) parts.push(grid);
    if (st.working) { const p = el('p'); p.append('En qué está: ', el('b', '', st.working)); parts.push(p); }
    else if (st.topics && st.topics.length) { const p = el('p'); p.append('Sabe de: ', el('b', '', st.topics.join(', '))); parts.push(p); }
    if (parts.length === 1) parts.push(el('p', '', 'Todavía no hay datos de hoy.'));
  } else if (LIVE) parts.push(el('p', '', 'No comparte su estado.'));
  whoCard.replaceChildren(...parts); whoCard.setAttribute('data-on', '');
}
cv.addEventListener('pointerdown', e => { POINT.drag = { x: e.clientX, y: e.clientY, yaw, pitch }; POINT.moved = 0; });
addEventListener('pointermove', e => {
  if (POINT.drag) {
    const dx = e.clientX - POINT.drag.x, dy = e.clientY - POINT.drag.y; POINT.moved = Math.max(POINT.moved, Math.hypot(dx, dy));
    if (POINT.moved > 4) { stage.setAttribute('data-drag', ''); yaw = POINT.drag.yaw + dx * 0.008; pitch = Math.max(-1.1, Math.min(1.1, POINT.drag.pitch + (e.pointerType === 'touch' ? 0 : dy * 0.006))); }
    return;
  }
  if (e.target !== cv) { POINT.over = -1; stage.removeAttribute('data-over'); return; }
  POINT.over = faceAt(e); stage.toggleAttribute('data-over', POINT.over >= 0);
});
addEventListener('pointerup', e => {
  if (!POINT.drag) return;
  if (POINT.moved <= 4 && e.target === cv) { const hit = faceAt(e); POINT.picked = hit === POINT.picked ? -1 : hit; showWho(POINT.picked); }
  else { tYaw = yaw - Math.sin(T * 0.12) * (scene.kind === 'group' ? 0.08 : 0.35); tPitch = pitch + 0.1; }
  POINT.drag = null; stage.removeAttribute('data-drag');
});
addEventListener('pointercancel', () => { POINT.drag = null; stage.removeAttribute('data-drag'); });
cv.addEventListener('pointerleave', () => { if (!POINT.drag) { POINT.over = -1; stage.removeAttribute('data-over'); } });

// ───────── Reloj ─────────
const q = new URLSearchParams(location.search);
if (q.has('embed')) root.setAttribute('data-embed', '');
const SPEED = +(q.get('speed') || 1.6);
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) { T += dt * SPEED; clock += dt * SPEED; }
  const drift = scene.kind === 'group' ? 0.08 : 0.35;
  const k = 1 - Math.exp(-dt * 1.6); if (!POINT.drag) { yaw += (tYaw + Math.sin(T * 0.12) * drift - yaw) * k; pitch += (tPitch - 0.1 - pitch) * k; }
  if (scene.kind === 'ronda') rondaTick(clock);
  else if (scene.kind === 'semana') weekTick(clock);
  else if (current) {
    current.events.forEach((e, idx) => { if (clock >= e.at && !current.shown.has(idx)) { current.shown.add(idx); addItem(e); } });
    items.forEach(it => it.upd(clock));
  }
  if (LIVE) LIVE.tick(); else if (clock > scene.dur) startScene(si + 1);
  if (!LITE || (drawn++ & 1) === 0) draw(T);
  if (stuck) feed.scrollTop = feed.scrollHeight;
  requestAnimationFrame(frame);
}
document.getElementById('pause').onclick = e => { paused = !paused; e.currentTarget.textContent = paused ? 'Seguir' : 'Pausar'; };
document.getElementById('next').onclick = () => startScene(si + 1);
// Controles ocultos por defecto. Botón ⌃, tecla H o ?ui=1 los muestran; se recuerda entre recargas.
const hideBtn = document.getElementById('hide');
function setClean(on) {
  root.toggleAttribute('data-clean', on); hideBtn.textContent = on ? '⌃' : '⌄';
  hideBtn.setAttribute('aria-label', on ? 'Mostrar controles (H)' : 'Ocultar controles (H)'); hideBtn.title = hideBtn.getAttribute('aria-label');
  try { localStorage.setItem('uv-ui', on ? '0' : '1'); } catch (_) {}
}
hideBtn.onclick = () => setClean(!root.hasAttribute('data-clean'));
addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H') && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA/.test(e.target.tagName)) setClean(!root.hasAttribute('data-clean')); });
setClean(!(q.get('ui') === '1' || (() => { try { return localStorage.getItem('uv-ui') === '1'; } catch (_) { return false; } })()));
// ?s= escena inicial (0 = uno a uno, 1..6 grupos, 7 = semana) y ?t= segundo dentro de ella. ?g= sigue funcionando.
// ?vivo=/api/people/<token>/mesa/live: nada de la demo se dibuja; la esfera parte vacía y universo-vivo.js sienta a las personas reales.
if ((q.get('vivo') || '').startsWith('/api/people/')) {
  LIVE = { on: new Array(U.N).fill(false), title: 'Agentes', sub: '', rows: [], tick() {} };
  SCENES.length = 0; SCENES.push({ kind: 'vivo', dur: Infinity }); SHOWN.length = 0; SCRIPTS.length = 0;
  root.setAttribute('data-vivo', '');
  startScene(0);
  const live = document.createElement('script'); live.src = './universo-vivo.js?v=15'; document.body.append(live);
} else {
  startScene(q.has('s') ? +q.get('s') : q.has('g') ? 1 + +q.get('g') : 0);
  if (q.has('t')) { clock = +q.get('t'); T = clock; }
}
requestAnimationFrame(frame);
</script>
