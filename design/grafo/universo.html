  .uv-top .rd-chip { pointer-events: auto; }
  .uv-title { position: absolute; left: 28px; top: 78px; z-index: 2; pointer-events: none; }
  .uv-title .rd-hero { font-size: clamp(30px, 3.4vw, 48px); }
  .uv-count { display: flex; gap: 22px; margin-top: 14px; }

  .uv-ctl { position: absolute; left: 28px; bottom: 24px; display: flex; gap: 8px; z-index: 2; }

  .uv-cat { position: absolute; left: 28px; right: 28px; bottom: 76px; z-index: 2; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .uv-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

<script>
// ───────── Datos ─────────
const U = RondaUniverse, people = U.people(), POS = U.sphere();
const GROUPS = U.groups(POS, 14, 7);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const faceUrl = p => p.face.startsWith('team:') ? '../faces/' + p.face.slice(5) + '.png' : null;
const atlas = new Image(); atlas.src = '../faces/atlas/faces.png';
const atlasBlur = new Image(); atlasBlur.src = '../faces/atlas/faces-blur.png';

// ───────── Catálogo visible ─────────
const catTools = document.getElementById('cat-tools'), catMinis = document.getElementById('cat-minis');

// ───────── Hilo del grupo ─────────
const feed = document.getElementById('feed');

function startGroup(i) {

  clock = 0; items = [];
  [...feed.children].forEach(c => c.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-8px)' }], { duration: 320, fill: 'forwards' }).onfinish = () => c.remove());

function addItem(e) {

    const f = el('span', 'uv-face'); Object.assign(f.style, faceCss(e.from));

    b.append(el('span', 'uv-who', e.type === 'human' ? people[e.from].name + ', en persona' : 'Agente de ' + people[e.from].name + ' → ' + people[e.to].name), s.el); col.append(b);
    node.append(f, col);
    upd = t => s.update((t - e.at - 0.15) / Math.max(0.2, e.end - e.at - 0.15), t > e.end + 0.3);
  } else if (e.type === 'call') {
    node = el('div', 'uv-tool');
    node.append(el('span', 'rd-label', 'Agente de ' + people[e.from].name + ' usa'));
    const card = RondaTools.create(e); node.append(card.el);
    upd = t => card.update(t);
  } else if (e.type === 'ask') {
    node = el('div', 'uv-ask'); const inner = el('div');
    inner.append(el('span', 'rd-label rd-gradient-text', 'Tu decisión'), el('span', 'rd-title', e.question));
    const note = el('span', 'rd-note', 'Tu agente espera tu respuesta. Nadie más ve esta pregunta.');
    const act = el('div', 'rd-actions'); const ok = el('button', 'rd-button', 'Aceptar'); ok.type = 'button'; const adj = el('button', 'rd-button rd-button--quiet', 'Ajustar'); adj.type = 'button'; act.append(ok, adj);
    const doneLine = el('span', 'uv-ask-done', '✓ Aceptado por ti'); doneLine.setAttribute('aria-hidden', 'true');
    const foot = el('div', 'uv-ask-foot'); foot.append(act, doneLine);
    inner.append(note, foot); node.append(inner);
    let accepted = false; ok.onclick = () => { accepted = true; };
    upd = t => { const done = accepted || t >= e.end; if (done && !node.dataset.done) { node.dataset.done = '1'; ok.disabled = adj.disabled = true; doneLine.removeAttribute('aria-hidden'); } };
  }
  RondaStream.append(feed, node);
  while (feed.children.length > 14) feed.firstElementChild.remove();
  items.push({ e, upd });
  if (e.type === 'call') { tagEls[e.name] && tagEls[e.name].setAttribute('data-seen', ''); const k = RondaTools.motionKind(e.name); miniEls[k] && miniEls[k].setAttribute('data-seen', ''); }
}

// ───────── Globo ─────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, yaw = 0, pitch = 0.15, tYaw = 0, tPitch = 0.15;
function resize() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
new ResizeObserver(resize).observe(cv); resize();
function turnTo(members) {
  const c = [0, 0, 0]; members.forEach(m => { c[0] += POS[m][0]; c[1] += POS[m][1]; c[2] += POS[m][2]; });
  const l = Math.hypot(...c) || 1; c[0] /= l; c[1] /= l; c[2] /= l;
  tYaw = -Math.atan2(c[0], c[2]); tPitch = Math.atan2(c[1], Math.hypot(c[0], c[2]));
  while (tYaw - yaw > Math.PI) tYaw -= 2 * Math.PI; while (yaw - tYaw > Math.PI) tYaw += 2 * Math.PI;
}
const smooth = (a, b, x) => { const u = Math.max(0, Math.min(1, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
const COLS = ['#1e9bff', '#7b61ff', '#e840d8', '#ff3b6b', '#ff8a1f'];
function grad(x0, y0, x1, y1) { const g = ctx.createLinearGradient(x0, y0, x1, y1); COLS.forEach((c, i) => g.addColorStop(i / 4, c)); return g; }
const AMB = GROUPS.map((g, i) => ({ g, off: i * 1.7 }));
function draw(T) {
  ctx.clearRect(0, 0, W, H);
  const CX = W * 0.6, CY = H * 0.5, S = Math.min(W * 0.28, H * 0.27), D = 3.4;

  const P = POS.map(v => { const x = v[0] * cy + v[2] * sy, z = -v[0] * sy + v[2] * cy, y2 = v[1] * cp - z * sp, z2 = v[1] * sp + z * cp, f = D / (D - z2); return { x: CX + x * S * f, y: CY - y2 * S * f, z: z2, f, R: [x, y2, z2] }; });
  const ctrl = (a, b) => { const A = P[a].R, B = P[b].R, m = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2, (A[2] + B[2]) / 2], L = Math.hypot(...m), d = Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]), k = L > 0.45 ? (1 + 0.05 * d) / L : 1, f = D / (D - m[2] * k); const pm = { x: CX + m[0] * k * S * f, y: CY - m[1] * k * S * f }; return { x: 2 * pm.x - (P[a].x + P[b].x) / 2, y: 2 * pm.y - (P[a].y + P[b].y) / 2, z: m[2] }; };
  // Neblina: todas las conversaciones posibles.
  const haze = [new Path2D(), new Path2D()];
  for (let a = 0; a < U.N; a++) for (let b = a + 1; b < U.N; b++) { const c = ctrl(a, b), h = c.z > -0.1 ? haze[0] : haze[1]; h.moveTo(P[a].x, P[a].y); h.quadraticCurveTo(c.x, c.y, P[b].x, P[b].y); }
  ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(70,70,150,0.035)'; ctx.stroke(haze[1]); ctx.strokeStyle = 'rgba(70,70,150,0.07)'; ctx.stroke(haze[0]);
  // Vidrio.
  const sr = S * 1.06, hg = ctx.createRadialGradient(CX - sr * 0.35, CY - sr * 0.45, 0, CX - sr * 0.35, CY - sr * 0.45, sr * 1.2);
  hg.addColorStop(0, 'rgba(255,255,255,0.5)'); hg.addColorStop(0.45, 'rgba(255,255,255,0.1)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(CX, CY, sr, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(CX, CY, sr, 0, 6.2832); ctx.stroke();
  // Grupos de fondo: tinta, con una luz que recorre.
  const focusSet = new Set(current ? current.g.members : []);
  let active = 0;
  AMB.forEach(({ g, off }) => {
    if (current && g === current.g) return;
    const loc = (T + off) % 16; if (loc > 13) return; active++;
    const [r, ...hs] = g.members, grow = smooth(0, 1.4, loc), fade = 1 - smooth(11.5, 13, loc);
    hs.forEach((h, i) => { const c = ctrl(r, h); if (c.z < -0.35) return; const u = Math.max(0, Math.min(1, grow * 1.2 - i * 0.1)); const pa = P[r], pb = P[h];
      ctx.save(); ctx.globalAlpha = fade * (c.z < 0 ? 0.4 : 0.85); ctx.strokeStyle = 'rgba(29,29,31,0.35)'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(pa.x, pa.y);

      ctx.restore(); });
  });

  document.getElementById('ntopics').textContent = (U.TOPICS.length - 37 + Math.floor(T / 3) % 30).toLocaleString('es-CL');
  // Grupo en foco: degradado en las conversaciones que ya ocurrieron; el arco activo cuenta lo que pasa.
  let activeEv = null;
  if (current) {
    const talked = new Map();
    current.events.forEach(e => { if (clock >= e.at) talked.set(Math.min(e.from, e.to) + '-' + Math.max(e.from, e.to), [e.from, e.to]); if (clock >= e.at && clock < e.end + (e.type === 'call' ? 2.2 : 0.3)) activeEv = e; });
    talked.forEach(([a, b]) => { const c = ctrl(a, b), pa = P[a], pb = P[b], g = grad(pa.x, pa.y, pb.x, pb.y);
      ctx.save(); ctx.globalAlpha = 0.3; ctx.filter = 'blur(7px)'; ctx.strokeStyle = g; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.quadraticCurveTo(c.x, c.y, pb.x, pb.y); ctx.stroke(); ctx.restore();
      ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.quadraticCurveTo(c.x, c.y, pb.x, pb.y); ctx.stroke(); });
  }
  // Personas, de atrás hacia adelante, con niebla y desenfoque graduales.
  const order = P.map((p, i) => i).sort((a, b) => P[a].z - P[b].z);
  for (const i of order) {
    const p = P[i], fog = smooth(0.45, -0.75, p.z), blur = smooth(0.3, -0.55, p.z), focus = focusSet.has(i);
    const edge = 0.5 + 0.5 * Math.min(1, Math.abs(p.z) * 1.6), r = (focus ? 20 : 8.5) * p.f * (focus ? 1 : edge);
    ctx.save(); ctx.globalAlpha = (1 - 0.5 * fog) * (current && !focus ? 0.85 : 1);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, r + (focus ? 3 : 1.5), 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.clip();
    if (i < 5) { if (teamImg[i].complete) { if (blur > 0.05) ctx.filter = 'blur(' + (blur * 2).toFixed(1) + 'px)'; ctx.drawImage(teamImg[i], p.x - r, p.y - r, r * 2, r * 2); } }
    else { const t = +people[i].face.slice(5), sx = (t % 8) * 128 + 4, sy = Math.floor(t / 8) * 128 + 4;
      if (blur > 0.05 && atlasBlur.complete) ctx.drawImage(atlasBlur, sx, sy, 120, 120, p.x - r, p.y - r, r * 2, r * 2);
      if (atlas.complete) { ctx.globalAlpha *= 1 - blur; ctx.drawImage(atlas, sx, sy, 120, 120, p.x - r, p.y - r, r * 2, r * 2); } }
    if (fog > 0.02) { ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(244,244,250,' + (0.5 * fog).toFixed(3) + ')'; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2); }
    ctx.restore();
    if (focus) { const cg = ctx.createConicGradient ? ctx.createConicGradient(T * 0.6 + i, p.x, p.y) : grad(p.x - r, p.y, p.x + r, p.y); if (ctx.createConicGradient) COLS.concat([COLS[0]]).forEach((c, k) => cg.addColorStop(k / 5, c));
      ctx.strokeStyle = cg; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, 6.2832); ctx.stroke();
      ctx.save(); ctx.font = '600 13px -apple-system, system-ui, sans-serif'; ctx.fillStyle = '#1d1d1f'; ctx.textAlign = p.x >= CX ? 'left' : 'right'; ctx.textBaseline = 'middle'; ctx.shadowColor = 'rgba(247,247,250,0.95)'; ctx.shadowBlur = 8;
      if (i !== 0) ctx.fillText(people[i].name, p.x + (p.x >= CX ? r + 12 : -r - 12), p.y); ctx.restore(); }
    if (i === 0) { ctx.save(); ctx.font = '600 13px -apple-system, system-ui, sans-serif'; ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(247,247,250,0.95)'; ctx.shadowBlur = 8; ctx.globalAlpha = 1 - 0.6 * fog; ctx.fillText('Tú', p.x, p.y - r - 10); ctx.restore(); }
  }
  // Arco activo: la miniatura de la herramienta, los puntos al escribir, el check al terminar.
  if (activeEv && current) {
    const a = activeEv.from, b = activeEv.to, c = ctrl(a, b);
    const evs = current.events.filter(e => (e.from === a && e.to === b) || (e.from === b && e.to === a)).map(e => Object.assign({}, e, { author: e.from === a ? 0 : 1, type: e.type === 'ask' ? 'message' : e.type }));
    const st = RondaEdge.state(evs, clock);
    RondaEdge.paint(ctx, { from: P[a], to: P[b], control: c }, st, { size: 52, u: 0.5, faces: [teamImg[a], teamImg[b]] });
    Object.values(tagEls).forEach(x => x.removeAttribute('data-now')); Object.values(miniEls).forEach(x => x.removeAttribute('data-now'));
    if (activeEv.type === 'call') { tagEls[activeEv.name] && tagEls[activeEv.name].setAttribute('data-now', ''); const k = RondaTools.motionKind(activeEv.name); miniEls[k] && miniEls[k].setAttribute('data-now', ''); }
  }
}

// ───────── Reloj ─────────
const SPEED = +(new URLSearchParams(location.search).get('speed') || 1);
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) { T += dt * SPEED; clock += reduced ? 99 : dt * SPEED; }
  const k = 1 - Math.exp(-dt * 1.6); yaw += (tYaw + Math.sin(T * 0.12) * 0.08 - yaw) * k; pitch += (tPitch - 0.1 - pitch) * k;
  if (current) {
    current.events.forEach((e, idx) => { if (clock >= e.at && !current.shown.has(idx)) { current.shown.add(idx); addItem(e); } });
    items.forEach(it => it.upd(clock));
    const p = Math.min(1, clock / current.duration);
    document.getElementById('fbar').style.width = (p * 100).toFixed(1) + '%';
    document.getElementById('fclock').textContent = Math.floor(clock) + ' s';
    const ended = clock >= current.duration;
    document.getElementById('fstate').textContent = ended ? 'Acuerdo' : current.events.some(e => e.type === 'ask' && clock >= e.at && clock < e.end) ? 'Te espera' : 'Negociando';
    if (clock > current.duration + 2.6) startGroup(gi + 1);
  }
  draw(T);
  requestAnimationFrame(frame);
}
document.getElementById('pause').onclick = e => { paused = !paused; e.currentTarget.textContent = paused ? 'Seguir' : 'Pausar'; };
document.getElementById('next').onclick = () => startGroup(gi + 1);
const q = new URLSearchParams(location.search);
startGroup(+(q.get('g') || 0));
if (q.has('t')) { clock = +q.get('t'); T = clock; }
requestAnimationFrame(frame);
</script>
