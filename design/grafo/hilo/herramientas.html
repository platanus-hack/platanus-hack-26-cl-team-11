<div class="rd-page">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

        <h1 class="rd-pagetitle">Herramientas</h1>
        <p class="rd-pagesub">Lo que ves en el hilo cuando un agente usa una herramienta.</p>
      </div>
      <button type="button" class="rd-button rd-button--quiet rd-button--small" id="replay">Repetir</button>
    </div>
    <p class="hb-bubble rd-glass" id="demo"></p>
    <section class="gal" id="gal" aria-label="Tarjetas de herramienta"></section>
  </div>
</div>
<script src="./stream.js"></script>
<script src="./tools.js"></script>
<script>
const calls = [
  { name: 'agenda.disponibilidad', label: 'Leer la agenda de Ian', input: { minutos: 30 }, output: { libre: ['10:30', '11:00'] }, receipt: 'Dos franjas' },
  { name: 'agenda.cruzar', label: 'Cruzar las dos agendas', participants: ['Ian', 'Lian'], input: { duracion_min: 30 }, output: { desde: '10:30', hasta: '11:00' }, receipt: '10:30 a 11:00' },
  { name: 'politica.consultar', label: 'Revisar qué puede compartir', input: { dato: 'descanso' }, output: { compartir: false }, receipt: 'Privado', privateResult: true },
  { name: 'equipo.consultar', label: 'Preguntar quién está libre', input: { tema: 'demo' }, output: { disponibles: 2 }, receipt: '2 disponibles' },
  { name: 'pulso.umbral', label: 'Esperar el mínimo de aportes', input: { minimo: 3 }, output: { aportes: 3 }, receipt: 'Ya hay 3' },
  { name: 'permiso.usar', label: 'Usar tu permiso una vez', input: { frase: 'Puedo cubrir a las 11' }, output: { usado: true }, receipt: 'Usado una vez' },
  { name: 'presentacion.crear', label: 'Presentar a Lian con Sofía', input: { tema: 'pitch' }, output: { enviada: true }, receipt: 'Presentadas' },
  { name: 'propuesta.redactar', label: 'Redactar una regla', input: { tema: 'reuniones' }, output: { borrador: true }, receipt: 'Borrador listo' },
  { name: 'calendario.crear', label: 'Crear la invitación', input: { inicio: '10:30', fin: '11:00' }, output: { enviada: true }, receipt: 'Enviada' },
  { name: 'github.pr', label: 'Revisar el cambio de Lian', input: { pr: 128 }, output: { estado: 'aprobado' }, receipt: 'Aprobado' },
  { name: 'granola.resumen', label: 'Leer la reunión de ayer', input: { reunion: 'Demo' }, output: { puntos: 3 }, receipt: '3 puntos' },
  { name: 'whatsapp.enviar', label: 'Avisar a Ian por WhatsApp', input: { para: 'Ian' }, output: { leido: true }, receipt: 'Leído' },
  { name: 'whatsapp.leer', label: 'Leer la respuesta de Lian', input: { de: 'Lian' }, output: { recibido: true }, receipt: 'Recibido' },
  { name: 'granola.buscar', label: 'Buscar quién prometió el deck', input: { tema: 'deck' }, output: { quien: 'Ian' }, receipt: 'Lo tiene Ian' },
  { name: 'salud.descanso', label: 'Leer tu descanso', input: { senal: 'sueño' }, output: { compartir: false }, receipt: 'Solo para ti', privateResult: true }
];
const q = new URLSearchParams(location.search), fixed = q.has('t') ? +q.get('t') : null;
let t0 = performance.now(), playing = true;
const cards = calls.map((c, i) => { c.at = 0.6 + i * 0.12; c.end = c.at + 2.8; const r = RondaTools.create(c); r.el.classList.add('ss-stage'); document.getElementById('gal').append(r.el); return r; });
const stream = RondaStream.create('A las 10:00 tengo [[x]] ¿Te sirve a las 10:30? Así revisamos la demo con calma.');
document.getElementById('demo').append(stream.el);
function frame() {
  const t = fixed !== null ? fixed : (performance.now() - t0) / 1000;
  cards.forEach(c => c.update(t));
  stream.update(Math.min(1, Math.max(0, (t - 0.3) / 3)), t > 3.6);
  if (fixed === null && t < 6) requestAnimationFrame(frame);
}
frame();
document.getElementById('replay').addEventListener('click', () => location.reload());
</script>
