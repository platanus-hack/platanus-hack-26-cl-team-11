<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ronda.css">
<link rel="stylesheet" href="contexto.css">
</head>
<body style="margin: 0">
<div class="rd-page cx">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="rd-page__inner cx-wrap">
    <header class="cx-top">
      <a class="rd-brand" href="resumen.html"><img class="rd-mark" src="../logo/ronda-mark.svg" alt="">Ronda</a>
      <nav class="cx-nav" aria-label="Secciones">
        <a href="resumen.html">Resumen</a>
        <a href="conexiones.html">Conexiones</a>
        <a href="mapa.html">Mapa</a>
      </nav>
      <span class="cx-tag">Datos de prueba</span>
    </header>
    <div class="cx-head">
      <div>
        <h1 class="cx-title">Superficies de conexión</h1>
        <p class="cx-sub">Lo que se abre al tocar «Conectar». Hay cinco formas de conectar y tres estados.</p>
      </div>
    </div>
    <div class="cx-gallery" id="gallery"></div>
  </div>
</div>
<script src="apps.js"></script>
<script>
(function () {
  const { find, sheet, METHOD_NAME } = window.RONDA;
  const cells = [
    ['gcal', 'permiso'], ['granola', 'permiso'], ['health', 'permiso'], ['claude', 'permiso'], ['whatsapp', 'permiso'],
    ['gcal', 'conectando'], ['gcal', 'lista'], ['github', 'administrar'],
  ];
  const STATE_NAME = { conectando: 'Mientras conecta', lista: 'Recién conectada', administrar: 'Ya conectada' };
  const gallery = document.getElementById('gallery');

  function draw(cell, id, state) {
    const app = find(id);
    cell.dataset.app = id;
    cell.innerHTML = '<span class="rd-label">' + (state === 'permiso' ? METHOD_NAME[app.method] : STATE_NAME[state]) + ' · ' + app.name + '</span>' +
      '<div class="cx-slab cx-sheet">' + sheet(app, state) + '</div>';
  }

  cells.forEach(([id, state]) => {
    const cell = document.createElement('div');
    cell.className = 'cx-gallery__cell';
    draw(cell, id, state);
    gallery.appendChild(cell);
  });

  gallery.addEventListener('click', (event) => {
    const cell = event.target.closest('.cx-gallery__cell');
    if (!cell) return;
    const go = event.target.closest('[data-go]');
    if (go) {
      draw(cell, cell.dataset.app, 'conectando');
      setTimeout(() => draw(cell, cell.dataset.app, 'lista'), 1700);
      return;
    }
    if (event.target.closest('[data-close]')) draw(cell, cell.dataset.app, 'permiso');
    const copy = event.target.closest('[data-copy]');
    if (copy) copy.lastChild.textContent = 'Copiado';
  });
})();
</script>
</body>
</html>
