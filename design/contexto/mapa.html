<body style="margin: 0">
<div class="rd-page cx">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="rd-page__inner cx-wrap">
    <header class="cx-top">
      <a class="rd-brand" href="resumen.html"><img class="rd-mark" src="../logo/ronda-mark.svg" alt="">Ronda</a>
      <nav class="cx-nav" aria-label="Secciones">

      <h1 class="cx-title">Mapa</h1>

    </div>

    <div class="cx-map">
      <div class="cx-globe" id="globe">
        <canvas id="dots-back" aria-hidden="true"></canvas>
        <canvas id="dots-front" class="cx-globe__front" aria-hidden="true"></canvas>
        <div class="cx-globe__floor" aria-hidden="true"></div>
      </div>
      <aside class="cx-slab cx-panel" id="panel" aria-live="polite"></aside>
    </div>
  </div>
</div>

<script src="apps.js"></script>
<script>
(function () {
  const { find, ago, tile, esc } = window.RONDA;
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches || params.has('still');

  const FEED = {
    health: ['Dormiste 5 h 40 min, una hora menos que tu promedio', 'Pulso en reposo 61 lpm, 4 sobre tu promedio', '8.412 pasos hasta las 18:00', 'Variabilidad cardíaca baja desde el jueves'],
    granola: ['Mentoría Platanus: enfocar el pitch en una sola idea', 'Daily de la hack: quién presenta el domingo', 'Reunión con Ian: definir el globo de la demo', 'Ensayo corto del pitch con Andrés'],
    gmail: ['Ian: ¿miramos el globo a las 11:00?', 'Render: despliegue listo en main', 'Platanus: instrucciones de la sala', 'Lian: te mandé el borrador del guion'],
    gcal: ['Hoy 11:00: el globo con Ian', 'Mañana 10:30: ensayo de la demo', 'Domingo 16:00: cierre de la hack', 'Bloque sin reuniones de 15:00 a 18:00'],
    whatsapp: ['Grupo del equipo: Robert confirma la grabación', 'Andrés: ¿a qué hora cerramos el domingo?', 'Lian: llego a las 10:00', 'Robert: grabamos a las 12:00'],
    github: ['main: mapa de contexto', 'Render desplegó la última versión de main', 'main: tablero con votos', 'main: hilo de vidrio interactivo'],
    codex: ['Agregó pruebas al tablero del equipo', 'Dejó el despliegue en cada commit', 'Corrigió el Atajo de Apple Health', 'Ordenó los conectores'],
    claude: ['Armó el servidor de contexto y sus pruebas', 'Redactó el guion de 3 minutos', 'Te sugirió cortar el día a las 22:00', 'Revisó el mapa contra la guía de diseño'],
  };
  const AGO = { health: [410, 412, 1560], granola: [95, 340, 610], gmail: [12, 48, 200], gcal: [25, 180, 720], whatsapp: [8, 75, 210], github: [16, 44, 170], codex: [30, 150, 380], claude: [4, 130, 260] };
  const IDS = ['health', 'granola', 'gmail', 'gcal', 'whatsapp', 'github', 'codex', 'claude'];
  const PEOPLE = [
    { id: 'me', name: 'Tú', face: 'mati', has: null },
    { id: 'ian', name: 'Ian', face: 'ian', has: { github: [6, 'Subió el hilo de vidrio a main'], codex: [22, ''], gcal: [40, 'Libre de 15:00 a 18:00'], granola: [95, ''], claude: [3, ''] } },
    { id: 'lian', name: 'Lian', face: 'lian', has: { health: [310, ''], gcal: [15, 'Ocupada hasta las 12:00'], gmail: [9, ''], github: [58, 'Dejó Render en verde'], whatsapp: [2, ''] } },
    { id: 'andres', name: 'Andrés', face: 'andres', has: { granola: [120, ''], gmail: [33, ''], gcal: [64, 'Ensayo del pitch a las 10:30'], claude: [18, ''] } },
    { id: 'roberto', name: 'Roberto', face: 'roberto', has: { gcal: [5, 'En reuniones hasta las 13:00'], whatsapp: [11, ''], gmail: [27, ''] } },
  ];

  const t0 = Date.now();
  const wantedPerson = PEOPLE.find((p) => p.id === params.get('persona'));
  const state = { person: wantedPerson ? wantedPerson.id : 'me', selected: null, off: { whatsapp: true, codex: true }, items: {}, pushed: {}, tick: 0 };
  IDS.forEach((id) => {
    state.items[id] = FEED[id].slice(0, 3).map((text, index) => ({ text, at: t0 - AGO[id][index] * 60000 }));
  });
  const since = (at) => ago((Date.now() - at) / 60000);
  const person = () => PEOPLE.find((p) => p.id === state.person);

  function sourceOf(id) {
    const who = person();
    if (who.id === 'me') {
      const on = !state.off[id];
      const items = on ? state.items[id] : [];
      return { on, items, lastAt: items.length ? items[0].at : null, shared: '' };
    }
    const has = who.has[id];
    return has ? { on: true, items: [], lastAt: t0 - has[0] * 60000, shared: has[1] } : { on: false, items: [], lastAt: null, shared: '' };
  }

  /* ---------- Esfera: puntos fijos; apps y personas derivan solas ---------- */
  const globe = $('globe');
  const layers = [$('dots-back'), $('dots-front')];
  const back = layers[0].getContext('2d');
  const front = layers[1].getContext('2d');
  const hex = (color) => [1, 3, 5].map((start) => parseInt(color.slice(start, start + 2), 16));
  const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const unit = (v) => { const n = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / n, v[1] / n, v[2] / n]; };
  let seed = 7;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const COUNT = 1500;
  const dots = [];
  for (let i = 0; i < COUNT; i += 1) {
    const y = 1 - (2 * (i + 0.5)) / COUNT;
    const ring = Math.sqrt(1 - y * y);
    const turn = i * Math.PI * (3 - Math.sqrt(5));
    dots.push([Math.cos(turn) * ring, y, Math.sin(turn) * ring]);
  }

  const things = [];
  const total = IDS.length + PEOPLE.length;
  const order = Array.from({ length: total }, (_, index) => index).sort(() => random() - 0.5);
  function place(slot) {
    const y = 0.78 - (1.56 * (slot + 0.5)) / total;
    const ring = Math.sqrt(1 - y * y);
    const turn = slot * Math.PI * (3 - Math.sqrt(5)) + (random() - 0.5) * 0.9;
    return unit([Math.cos(turn) * ring, y + (random() - 0.5) * 0.18, Math.sin(turn) * ring]);
  }
  function add(kind, id, html) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'cx-node' + (kind === 'person' ? ' cx-node--person' : '');
    el.innerHTML = html;
    globe.appendChild(el);
    const thing = { kind, id, el, v: place(order[things.length]), axis: unit([random() - 0.5, random() - 0.5, random() - 0.5]), speed: (0.018 + random() * 0.026) * (random() < 0.5 ? -1 : 1) };
    el.addEventListener('click', () => {
      if (moved) return;
      if (kind === 'app') select(id);
      else choose(id);
    });
    things.push(thing);
    return thing;
  }
  IDS.forEach((id) => {
    const app = find(id);
    const thing = add('app', id, tile(app) + '<span class="cx-node__label"><span class="cx-node__name">' + esc(app.name) + '</span><span class="cx-node__when"></span></span>');
    thing.tint = hex(app.tint);
    thing.when = thing.el.querySelector('.cx-node__when');
    thing.tile = thing.el.querySelector('.cx-tile');
  });
  PEOPLE.forEach((p) => {
    add('person', p.id, '<img src="../faces/' + p.face + '.png" alt=""><span class="cx-node__label"><span class="cx-node__name">' + esc(p.name) + '</span></span>');
  });
  const thingOf = (kind, id) => things.find((thing) => thing.kind === kind && thing.id === id);

  let yaw = -0.4;
  let tilt = 0.18;
  let size = { w: 0, h: 0, r: 0 };
  let pulse = null;
  let dragging = false;
  let moved = false;
  let last = { x: 0, y: 0 };
  let glide = 0;
  let clock = 0;

  function fit() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = globe.clientWidth;
    const h = globe.clientHeight;
    layers.forEach((layer) => {
      layer.width = Math.round(w * dpr);
      layer.height = Math.round(h * dpr);
      layer.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    size = { w, h, r: Math.min(w * 0.4, h * 0.4) };
  }

  function project(v, radius) {
    const cos = Math.cos(yaw);
    const sin = Math.sin(yaw);
    const x = v[0] * cos + v[2] * sin;
    const z1 = -v[0] * sin + v[2] * cos;
    const y = v[1] * Math.cos(tilt) - z1 * Math.sin(tilt);
    const z = v[1] * Math.sin(tilt) + z1 * Math.cos(tilt);
    const k = 1 / (1 - z * 0.16 * radius);
    return { x: size.w / 2 + x * size.r * radius * k, y: size.h / 2 - y * size.r * radius * k, z: z * radius, k };
  }

  function drift(dt) {
    things.forEach((thing) => {
      const angle = thing.speed * dt;
      const k = thing.axis;
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      const kxv = cross(k, thing.v);
      const kv = dot3(k, thing.v) * (1 - c);
      thing.v = unit([thing.v[0] * c + kxv[0] * s + k[0] * kv, thing.v[1] * c + kxv[1] * s + k[1] * kv, thing.v[2] * c + kxv[2] * s + k[2] * kv]);
    });
    for (let i = 0; i < things.length; i += 1) {
      for (let j = i + 1; j < things.length; j += 1) {
        const a = things[i];
        const b = things[j];
        const near = dot3(a.v, b.v);
        if (near < 0.8) continue;
        const push = (near - 0.8) * 1.4 * dt;
        const away = [a.v[0] - b.v[0], a.v[1] - b.v[1], a.v[2] - b.v[2]];
        a.v = unit([a.v[0] + away[0] * push, a.v[1] + away[1] * push, a.v[2] + away[2] * push]);
        b.v = unit([b.v[0] - away[0] * push, b.v[1] - away[1] * push, b.v[2] - away[2] * push]);
      }
    }
  }

  function disc(ctx, x, y, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function glass() {
    const cx = size.w / 2;
    const cy = size.h / 2;
    const r = size.r * 1.03;
    back.clearRect(0, 0, size.w, size.h);
    front.clearRect(0, 0, size.w, size.h);
    const inner = back.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
    inner.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
    inner.addColorStop(1, 'rgba(255, 255, 255, 0.16)');
    disc(back, cx, cy, r, inner);
    back.lineWidth = 1.5;
    back.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    back.beginPath();
    back.arc(cx, cy, r, 0, Math.PI * 2);
    back.stroke();
    back.lineWidth = 1;
    back.strokeStyle = 'rgba(110, 100, 160, 0.16)';
    back.beginPath();
    back.arc(cx, cy, r + 1.5, 0, Math.PI * 2);
    back.stroke();
    const veil = front.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.05, cx, cy, r);
    veil.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
    veil.addColorStop(0.6, 'rgba(255, 255, 255, 0.26)');
    veil.addColorStop(1, 'rgba(255, 255, 255, 0.08)');
    disc(front, cx, cy, r, veil);
  }

  function draw(now) {
    glass();
    const apps = things.filter((thing) => thing.kind === 'app' && sourceOf(thing.id).on);
    const beat = pulse ? Math.min(1, (now - pulse.start) / 1700) : 0;
    for (let i = 0; i < COUNT; i += 1) {
      const v = dots[i];
      const p = project(v, 1);
      const depth = (p.z + 1) / 2;
      let radius = (0.7 + 1.7 * depth) * p.k;
      let alpha = 0.1 + 0.55 * depth * depth;
      let color = '96, 90, 140';
      let best = 0;
      let owner = null;
      for (let a = 0; a < apps.length; a += 1) {
        const weight = (dot3(v, apps[a].v) - 0.9) / 0.085;
        if (weight > best) {
          best = weight;
          owner = apps[a];
        }
      }
      if (owner) {
        const w = Math.min(1, best);
        const glow = pulse && pulse.id === owner.id ? Math.sin(beat * Math.PI) : 0;
        const picked = state.selected === owner.id ? 0.35 : 0;
        color = Math.round(96 + (owner.tint[0] - 96) * w) + ', ' + Math.round(90 + (owner.tint[1] - 90) * w) + ', ' + Math.round(140 + (owner.tint[2] - 140) * w);
        radius *= 1 + w * (0.9 + glow * 0.9 + picked);
        alpha = Math.min(1, alpha + w * (0.2 + 0.5 * depth + glow * 0.3));
      }
      disc(p.z < 0 ? back : front, p.x, p.y, radius, 'rgba(' + color + ', ' + alpha.toFixed(3) + ')');
    }

    if (pulse && beat < 1) {
      const source = thingOf('app', pulse.id);
      const from = source.v;
      const to = thingOf('person', state.person).v;
      const angle = Math.acos(Math.max(-1, Math.min(1, dot3(from, to))));
      const tint = source.tint.join(', ');
      for (let step = 0; step < 7; step += 1) {
        const t = Math.max(0, beat - step * 0.035);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const a = Math.sin((1 - eased) * angle) / (Math.sin(angle) || 1);
        const b = Math.sin(eased * angle) / (Math.sin(angle) || 1);
        const q = project(unit([from[0] * a + to[0] * b, from[1] * a + to[1] * b, from[2] * a + to[2] * b]), 1.02);
        const ctx = q.z < 0 ? back : front;
        if (step === 0) {
          ctx.strokeStyle = 'rgb(' + tint + ')';
          ctx.lineWidth = 3;
          disc(ctx, q.x, q.y, 6.5, '#ffffff');
          ctx.stroke();
        } else {
          disc(ctx, q.x, q.y, 4.2 - step * 0.45, 'rgba(' + tint + ', ' + (0.5 - step * 0.06).toFixed(2) + ')');
        }
      }
    }
    if (pulse && beat >= 1) pulse = null;

    things.forEach((thing) => {
      const p = project(thing.v, 1.04);
      const depth = (p.z + 1.04) / 2.08;
      const base = thing.kind === 'person' && thing.id !== state.person ? 0.72 : 1;
      const scale = (0.5 + 0.6 * depth) * base * Math.min(1, size.r / 250);
      thing.el.style.transform = 'translate(' + (p.x - 32).toFixed(1) + 'px, ' + (p.y - 32).toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
      thing.el.style.zIndex = String(p.z > 0 ? 600 + Math.round(p.z * 100) : 100 + Math.round((p.z + 1.04) * 90));
      thing.el.style.filter = depth < 0.62 ? 'blur(' + ((0.62 - depth) * 13).toFixed(1) + 'px)' : 'none';
      thing.el.style.opacity = depth < 0.62 ? (0.45 + depth * 0.85).toFixed(2) : '1';
      thing.el.classList.toggle('cx-node--far', depth < 0.66);
      thing.el.classList.toggle('cx-node--up', p.y < size.h / 2 - size.r * 0.35);
    });
  }

  let before = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - before) / 1000);
    before = now;
    clock += dt;
    const target = state.selected ? thingOf('app', state.selected) : null;
    if (target) {
      let gap = (-Math.atan2(target.v[0], target.v[2]) - yaw) % (Math.PI * 2);
      if (gap > Math.PI) gap -= Math.PI * 2;
      if (gap < -Math.PI) gap += Math.PI * 2;
      const ease = 1 - Math.exp(-dt * 5);
      yaw += gap * ease;
      tilt += (Math.max(-0.7, Math.min(0.7, Math.asin(target.v[1]) * 0.8)) - tilt) * ease;
    } else if (!dragging) {
      if (!still) {
        drift(dt);
        yaw += 0.085 * dt;
        tilt += (0.18 + Math.sin(clock * 0.21) * 0.24 - tilt) * (1 - Math.exp(-dt * 1.2));
      }
      yaw += glide * dt;
      glide *= Math.exp(-dt * 3);
    }
    draw(now);
    requestAnimationFrame(frame);
  }

  globe.addEventListener('pointerdown', (event) => {
    dragging = true;
    moved = false;
    last = { x: event.clientX, y: event.clientY };
  });
  window.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    const dx = event.clientX - last.x;
    const dy = event.clientY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    if (!moved) return;
    if (state.selected) select(null);
    yaw += dx * 0.006;
    tilt = Math.max(-0.8, Math.min(0.8, tilt + dy * 0.004));
    glide = dx * 0.25;
    last = { x: event.clientX, y: event.clientY };
  });
  window.addEventListener('pointerup', () => {
    dragging = false;
    setTimeout(() => { moved = false; }, 0);
  });
  window.addEventListener('resize', fit);

  /* ---------- Panel y personas ---------- */
  function renderPeople() {
    $('people').innerHTML = PEOPLE.map((p) =>
      '<button type="button" class="cx-person" aria-pressed="' + (p.id === state.person) + '" data-person="' + p.id + '"><img src="../faces/' + p.face + '.png" alt="">' + esc(p.name) + '</button>').join('');
  }

  function renderNodes() {
    things.forEach((thing) => {
      if (thing.kind === 'person') {
        thing.el.setAttribute('aria-pressed', String(thing.id === state.person && !state.selected));
        thing.el.classList.toggle('cx-node--main', thing.id === state.person);
        return;
      }
      const source = sourceOf(thing.id);
      thing.tile.classList.toggle('cx-tile--off', !source.on);
      thing.el.setAttribute('aria-pressed', String(state.selected === thing.id));
      thing.when.textContent = source.on ? (source.lastAt ? since(source.lastAt) : 'Sin datos') : 'Sin conectar';
    });
  }

  function renderPanel() {
    const who = person();
    const mine = who.id === 'me';
    const title = mine ? 'Tu contexto' : 'Contexto de ' + who.name;
    if (!state.selected) {
      const all = IDS.map((id) => ({ app: find(id), source: sourceOf(id) }));
      const on = all.filter((entry) => entry.source.on);
      const lastAt = on.map((entry) => entry.source.lastAt).sort((a, b) => b - a)[0];
      $('panel').innerHTML = '<div class="cx-panel__head"><img class="cx-panel__face" src="../faces/' + who.face + '.png" alt=""><div><h2>' + esc(title) + '</h2>' +
        '<p>' + on.length + ' de ' + IDS.length + ' conexiones' + (lastAt ? ' · último dato ' + since(lastAt).toLowerCase() : '') + '</p></div></div>' +
        all.map(({ app, source }) => {
          let line = 'Sin conectar';
          if (source.on) line = mine ? source.items[0].text : source.shared || 'Privado';
          return '<button type="button" class="cx-line" data-select="' + app.id + '">' + tile(app, source.on ? '' : 'cx-tile--off') +
            '<span class="cx-line__text"><b>' + esc(app.name) + '</b><span>' + esc(line) + '</span></span>' +
            '<span class="cx-line__when">' + (source.on && source.lastAt ? since(source.lastAt) : '') + '</span></button>';
        }).join('') +
        (mine ? '' : '<p class="cx-panel__note">Ves cuándo llegó el último dato y lo que ' + esc(who.name) + ' comparte. Lo demás no sale de su agente.</p>');
      return;
    }
    const app = find(state.selected);
    const source = sourceOf(app.id);
    let rows = source.items.slice(0, 3).map((item) => '<div class="cx-item">' + esc(item.text) + '<span>' + since(item.at) + '</span></div>').join('');
    if (!mine && source.on) {
      rows = '<div class="cx-item">' + esc(source.shared || 'Privado') + '<span>' + (source.shared ? 'Compartido con el equipo · ' + since(source.lastAt) : 'No sale del agente de ' + esc(who.name)) + '</span></div>';
    }
    let action = '';
    if (mine && source.on) action = '<div class="cx-panel__actions"><button type="button" class="cx-btn" data-off="' + app.id + '">Desconectar</button></div>';
    if (mine && !source.on) action = '<div class="cx-panel__actions"><a class="cx-btn cx-btn--primary" href="conexiones.html?abrir=' + app.id + '">Conectar ' + esc(app.name) + '</a></div>';
    const status = source.on ? '<span class="cx-dot"></span>Conectada · ' + (source.lastAt ? since(source.lastAt).toLowerCase() : 'sin datos') : 'Sin conectar';
    const how = source.on || mine ? app.how : who.name + ' todavía no conecta esta app.';
    $('panel').innerHTML = '<button type="button" class="cx-back" data-select=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>' + esc(title) + '</button>' +
      '<div class="cx-panel__head">' + tile(app, source.on ? '' : 'cx-tile--off') + '<div><h2>' + esc(app.name) + '</h2><p>' + status + '</p></div></div>' +
      '<p class="rd-note" style="margin: 0 0 14px; font-size: 14px">' + esc(how) + '</p>' +
      (rows ? '<span class="rd-label" style="padding-bottom: 8px">Lo último</span>' + rows : '') + action;
  }

  function renderAll() {
    renderPeople();
    renderNodes();
    renderPanel();
  }

  function select(id) {
    state.selected = id || null;
    renderNodes();
    renderPanel();
  }

  function choose(id) {
    state.person = id;
    state.selected = null;
    renderAll();
  }

  document.addEventListener('click', (event) => {
    const who = event.target.closest('[data-person]');
    if (who) return choose(who.dataset.person);
    const pick = event.target.closest('[data-select]');
    if (pick) return select(pick.dataset.select);
    const off = event.target.closest('[data-off]');
    if (off) {
      state.off[off.dataset.off] = true;
      renderNodes();
      renderPanel();
    }
  });

  function arrive() {
    if (state.person !== 'me' || document.hidden) return;
    const on = IDS.filter((id) => !state.off[id]);
    if (!on.length) return;
    const id = on[(state.tick * 3) % on.length];
    state.tick += 1;
    const count = state.pushed[id] || 0;
    state.pushed[id] = count + 1;
    state.items[id] = [{ text: FEED[id][(3 + count) % FEED[id].length], at: Date.now() }].concat(state.items[id]).slice(0, 12);
    pulse = { id, start: performance.now() };
    renderNodes();
    renderPanel();
  }

  fit();
  renderAll();
  const wanted = params.get('fuente');
  if (wanted && find(wanted)) select(wanted);
  requestAnimationFrame(frame);
  if (!still) setInterval(arrive, 6000);
  setInterval(renderNodes, 30000);
})();
</script>
</body>
</html>
