<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ronda · intentos de Aura</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.9'%3E%3Cstop offset='0' stop-color='%23ffa24a'/%3E%3Cstop offset='.5' stop-color='%23ff5fa8'/%3E%3Cstop offset='1' stop-color='%237b61ff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='34' cy='50' r='24' fill='url(%23g)'/%3E%3Ccircle cx='68' cy='50' r='24' fill='url(%23g)' opacity='.75'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ronda.css">
<style>
  /* Galería: la versión actual de Aura y los intentos nuevos, uno a la vez, cada uno en su propia página. */
  body { margin: 0; }
  .in-tabs { display: inline-flex; gap: 6px; padding: 5px; border-radius: var(--rd-radius-pill); align-self: flex-start; flex-wrap: wrap; margin-top: var(--rd-space-6); }
  .in-tabs .rd-button { flex: 0 0 auto; height: 40px; background: transparent; color: var(--rd-ink); }
  .in-tabs .rd-button[aria-selected="true"] { background: var(--rd-ink); color: var(--rd-on-ink); }
  .in-note { margin: 14px 0 12px; max-width: 820px; min-height: 36px; }
  .in-box { position: relative; width: 100%; overflow: hidden; border-radius: var(--rd-radius-card); background: var(--rd-bg); box-shadow: var(--rd-shadow-card); }
  .in-frame { position: absolute; left: 0; top: 0; width: 1440px; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="rd-page">
  <div class="rd-aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="rd-page__inner">
    <header class="rd-bar">
      <span class="rd-brand"><img class="rd-mark" src="../logo/ronda-mark.svg" alt="">Ronda · intentos de Aura</span>
      <span class="rd-chip rd-chip--status rd-glass">Propuesta del 21-nov</span>
    </header>
    <div class="in-tabs rd-glass" role="tablist" aria-label="Intentos" id="tabs"></div>
    <p class="rd-note in-note" id="note"></p>
    <div class="in-box" id="box"><iframe class="in-frame" id="frame" title="Intento"></iframe></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var TABS = [
    { id: 'actual', label: 'Actual', src: 'sabores.html', note: 'La versión que Mati aprobó: lámpara de lava dentro de una gota de vidrio, con Ojos, Vita de luz o la luz sola.' },
    { id: 'vita-lava', label: 'Vita de lava', src: 'intentos/vita-lava/demo.html', note: 'Cara. La gota entera sigue siendo lava y encima va el dibujo de Vita Faces en tinta: pelo, cejas, ojos, boca y anteojos. Cada persona se reconoce por su peinado. El pelo tapa parte de la lava.' },
    { id: 'ojos-2', label: 'Ojos 2', src: 'intentos/ojos-2/demo.html', note: 'Cara. Los mismos ojos, ahora dentro del vidrio: sombra sobre la lava, párpados, pecas o un lunar, cuatro armazones de anteojos. Siguen al puntero y se miran entre vecinas.' },
    { id: 'luz-seda', label: 'Luz de seda', src: 'intentos/luz-seda/demo.html', note: 'Luz. Las mismas masas, hechas de luz translúcida y lechosa en vez de cera brillante. Más suave y más clara; se lee algo menos como lámpara de lava.' },
    { id: 'luz-three', label: 'Vidrio y cera', src: 'intentos/luz-three/demo.html', note: 'Luz, con three.js. Vidrio físico con reflejos reales y cera en geometría de verdad en las gotas grandes. Es el más pesado: carga 690 KB y ocupa buena parte de cada cuadro.' },
    { id: 'luz-fluido', label: 'Lava fluida', src: 'intentos/luz-fluido/demo.html', note: 'Luz. Un fluido de verdad: tinta arrastrada por un líquido que sube caliente y baja frío. Experimental: la cera se junta arriba y abajo y a ratos parece cejas y boca.' }
  ];
  var FRAME_HEIGHT = 1700;
  var bar = document.getElementById('tabs'), frame = document.getElementById('frame'), note = document.getElementById('note'), box = document.getElementById('box');
  function show(id) {
    var tab = TABS.filter(function (item) { return item.id === id; })[0] || TABS[0];
    Array.prototype.forEach.call(bar.children, function (button) { button.setAttribute('aria-selected', button.dataset.id === tab.id ? 'true' : 'false'); });
    frame.src = tab.src;
    note.textContent = tab.note;
    history.replaceState(null, '', '#' + tab.id);
  }
  TABS.forEach(function (tab) {
    var button = document.createElement('button');
    button.type = 'button'; button.className = 'rd-button'; button.setAttribute('role', 'tab');
    button.dataset.id = tab.id; button.textContent = tab.label;
    button.onclick = function () { show(tab.id); };
    bar.appendChild(button);
  });
  function fit() {
    var scale = box.clientWidth / 1440;
    frame.style.transform = 'scale(' + scale + ')';
    frame.style.height = FRAME_HEIGHT + 'px';
    box.style.height = Math.round(FRAME_HEIGHT * scale) + 'px';
  }
  new ResizeObserver(fit).observe(box);
  fit();
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
