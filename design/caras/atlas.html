<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ronda · atlas de Tinta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f6f6fb' stroke='%231d1d1f' stroke-width='4'/%3E%3Ccircle cx='38' cy='56' r='6' fill='%231d1d1f'/%3E%3Ccircle cx='62' cy='56' r='6' fill='%231d1d1f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Lámina para fotografiar: aplicar.py la captura y la corta en las imágenes que usa el globo.
     ?capa=atlas  64 caras, 8 x 8 de 128 px (1024 x 1024)
     ?capa=equipo las cinco del equipo en el orden mati, ian, lian, roberto, andres, de 320 px (1600 x 320) */
  html, body { margin: 0; background: var(--rd-bg); }
  #sheet { display: grid; }
  .tile { position: relative; overflow: hidden; color: var(--rd-ink); background: radial-gradient(circle at 36% 27%, #ffffff 0, #f3f4f9 52%, #dde0ed 100%); }
  .tile::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 122%, rgba(70, 70, 120, 0.2) 0, rgba(70, 70, 120, 0) 56%); }
  .tile svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="sheet"></div>
<script src="caras.js"></script>
<script>
(function () {
  'use strict';
  var TEAM = [
    { hair: 'corto', tone: 'tinta', eyes: 'punto', brows: 'pillo', mouth: 'lado' },
    { hair: 'copete', tone: 'grafito', eyes: 'feliz', mouth: 'sonrisa' },
    { hair: 'flequillo', tone: 'tinta', eyes: 'punto', mouth: 'chica', glasses: 'redondo' },
    { hair: 'corto', tone: 'tinta', flip: true, eyes: 'ovalo', brows: 'arco', mouth: 'abierta' },
    { hair: 'lado', tone: 'grafito', eyes: 'ovalo', brows: 'firme', mouth: 'sonrisa' }
  ];
  var team = new URLSearchParams(location.search).get('capa') === 'equipo';
  var sheet = document.getElementById('sheet');
  var size = team ? 320 : 128, count = team ? TEAM.length : 64;
  sheet.style.gridTemplateColumns = 'repeat(' + (team ? TEAM.length : 8) + ', ' + size + 'px)';
  for (var index = 0; index < count; index += 1) {
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.width = tile.style.height = size + 'px';
    tile.innerHTML = team ? window.RondaCaras.tinta('equipo', { recipe: TEAM[index] }) : window.RondaCaras.tinta('persona-' + index);
    sheet.appendChild(tile);
  }
})();
</script>
</body>
</html>
