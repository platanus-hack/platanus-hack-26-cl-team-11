<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D1: Marca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2457E6}a:hover{color:#1A3FB0}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; padding: 10px; background: #0A0A0A; color: #0A0A0A; font-family: 'Helvetica Neue', Helvetica, Inter, Arial, sans-serif; display: grid; grid-template-columns: 5fr 3fr 2.4fr; grid-template-rows: 3fr 2fr 1.1fr; gap: 10px">

  <div style="grid-column: span 2; background: #FFFFFF; padding: 36px 44px; display: flex; flex-direction: column; justify-content: space-between">
    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.04em">PLATANUS HACK 26 · SANTIAGO</span>
    <div style="font-size: 300px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.8; display: flex; align-items: baseline">
      <span>R</span><span style="display: inline-block; width: 0.56em; height: 0.56em; border-radius: 50%; background: {{dot}}; margin: 0 0.035em 0 0.02em"></span><span>nda</span>
    </div>
  </div>

  <div style="background: #2457E6; color: #FFFFFF; padding: 32px; display: flex; flex-direction: column; justify-content: space-between">
    <span style="font-size: 20px; font-weight: 700">Para ti</span>
    <span style="font-size: 120px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.9">O(1)</span>
  </div>

  <div style="background: #FFFFFF; padding: 32px 44px; display: flex; align-items: center">
    <span style="font-size: 54px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.02">Los agentes viven en O(n²).<br>Tú vives en O(1).</span>
  </div>

  <div style="background: #C8102E; color: #FFFFFF; padding: 32px; display: flex; flex-direction: column; justify-content: space-between">
    <span style="font-size: 20px; font-weight: 700">Entre 300 personas</span>
    <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 84px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.9">44.850</span><span style="font-size: 20px; font-weight: 700">conversaciones posibles</span></div>
  </div>

  <div style="grid-row: span 2; background: #FFFFFF; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; justify-content: center">
    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.04em">UN COLOR POR PERSONA</span>
    <div style="display: flex; align-items: center; gap: 14px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #2457E6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700">M</span><span style="font-size: 24px; font-weight: 700; color: #2457E6">Mati</span></div>
    <div style="display: flex; align-items: center; gap: 14px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #E2561B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700">I</span><span style="font-size: 24px; font-weight: 700; color: #C24412">Ian</span></div>
    <div style="display: flex; align-items: center; gap: 14px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #14894A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700">A</span><span style="font-size: 24px; font-weight: 700; color: #107A40">Andrés</span></div>
    <div style="display: flex; align-items: center; gap: 14px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #7A3FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700">L</span><span style="font-size: 24px; font-weight: 700; color: #7A3FE0">Lian</span></div>
    <div style="display: flex; align-items: center; gap: 14px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #C8102E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700">R</span><span style="font-size: 24px; font-weight: 700; color: #C8102E">Roberto</span></div>
  </div>

  <div style="background: #FFD400; padding: 24px 44px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em">Una propuesta al día.</span>
    <span style="font-size: 20px; font-weight: 700">Aceptar · Ajustar</span>
  </div>

  <div style="background: #0A0A0A; color: #FFFFFF; padding: 24px 32px; display: flex; align-items: center; border: 2px solid #FFFFFF">
    <span style="font-size: 20px; font-weight: 700; line-height: 1.2">El punto es tu única decisión.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dot":{"editor":"color","default":"#2457E6","options":["#2457E6","#C8102E","#FFD400","#0A0A0A"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { dot: this.props.dot ?? '#2457E6' };
  }
}
</script>
</body>
</html>
