/*
 * Montu · tokens de diseño. ÚNICA fuente de colores, tipografías, radios, sombras y espacios.
 * Regla: fuera de este archivo no se escribe ningún color, font-family, radio ni sombra a mano.
 * Si falta un token, se agrega acá primero (con un commit propio) y después se usa.
 * Explicación de cada decisión: design/DESIGN.md.
 */
:root {
  /* ---- Color: superficie y texto ---- */
  --rd-bg: #f7f7fa;                         /* fondo de toda pantalla */
  --rd-ink: #1d1d1f;                        /* texto principal y botón primario */
  --rd-muted: #6e6e73;                      /* texto secundario, unidades, etiquetas */
  --rd-faint: #aeaeb2;                      /* flechas y separadores de texto */
  --rd-on-ink: #ffffff;                     /* texto sobre --rd-ink */
  --rd-hairline: rgba(60, 60, 90, 0.1);     /* divisores dentro de una tarjeta */
  --rd-edge-idle: rgba(60, 60, 90, 0.16);   /* líneas del grafo que no están negociando */
  --rd-fill-soft: rgba(120, 120, 140, 0.14);/* botón secundario */
  --rd-live: #30d158;                       /* punto «en línea». Solo eso. */

  /* ---- Color: vidrio ---- */
  --rd-glass: rgba(255, 255, 255, 0.66);
  --rd-glass-solid: rgba(255, 255, 255, 0.94);
  --rd-glass-border: rgba(255, 255, 255, 0.85);
  --rd-glass-blur: blur(28px) saturate(1.4);

  /* ---- Color: el degradado. Es LA marca. Se usa solo donde DESIGN.md lo permite. ---- */
  --rd-g1: #1e9bff;
  --rd-g2: #7b61ff;
  --rd-g3: #e840d8;
  --rd-g4: #ff3b6b;
  --rd-g5: #ff8a1f;
  --rd-gradient: linear-gradient(100deg, var(--rd-g1) 0%, var(--rd-g2) 30%, var(--rd-g3) 55%, var(--rd-g4) 76%, var(--rd-g5) 100%);

  /* ---- Color: aura del fondo (manchas difuminadas) ---- */
  --rd-aura-blue: #4fb4ff;
  --rd-aura-violet: #b36bff;
  --rd-aura-pink: #ff5fa8;
  --rd-aura-orange: #ffa24a;

  /* Objetos de actividad en el grafo: esmalte, papel, tinta y caras en sombra. */
  --rd-mini-ink: #392c2b;
  --rd-mini-paper: #fff4d9;
  --rd-mini-paper-side: #d2ad82;
  --rd-mini-yellow: #ffc64c;
  --rd-mini-ochre: #c87d27;
  --rd-mini-orange: #fd8455;
  --rd-mini-rust: #bd533b;
  --rd-mini-mint: #85d5ba;
  --rd-mini-teal: #418e86;
  --rd-mini-blue: #96bdf4;
  --rd-mini-denim: #5e78ac;
  --rd-mini-screen: #284b47;
  --rd-mini-phosphor: #c8ff90;
  --rd-mini-shadow: rgba(68, 44, 37, .17);

  /* ---- Tipografía ---- */
  --rd-font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
  --rd-font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; /* solo código, llaves y direcciones */
  --rd-font-num: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; /* solo números */

  --rd-text-hero: 62px;    /* titular de pantalla. Uno por pantalla. */
  --rd-text-title: 24px;   /* frase de la tarjeta de decisión */
  --rd-text-num: 40px;     /* número grande tipo Apple Health */
  --rd-text-brand: 21px;   /* nombre junto al isotipo */
  --rd-text-body: 17px;
  --rd-text-name: 16px;    /* nombre de persona, botones */
  --rd-text-unit: 16px;    /* unidad junto a un número */
  --rd-text-small: 13px;   /* etiquetas, estado, pie de tarjeta */

  --rd-weight: 600;        /* único peso para todo lo que no es texto corrido */
  --rd-weight-body: 400;
  --rd-track-hero: -0.04em;
  --rd-track-title: -0.025em;
  --rd-track-num: -0.02em;

  /* ---- Forma ---- */
  --rd-radius-card: 28px;
  --rd-radius-pill: 999px;
  --rd-radius-mark: 27.5%; /* isotipo: cuadrado redondeado */
  --rd-ring: 1.5px;        /* grosor del borde degradado */

  /* ---- Sombra ---- */
  --rd-shadow-card: 0 24px 60px rgba(40, 30, 90, 0.08);
  --rd-shadow-glow: 0 24px 60px rgba(120, 60, 200, 0.18);
  --rd-shadow-face: 0 0 0 3px rgba(255, 255, 255, 0.95), 0 12px 28px rgba(40, 30, 90, 0.16);

  /* ---- Espacio (múltiplos de 4) ---- */
  --rd-space-1: 4px;
  --rd-space-2: 8px;
  --rd-space-3: 12px;
  --rd-space-4: 16px;   /* espacio entre tarjetas */
  --rd-space-6: 24px;   /* relleno de tarjeta */
  --rd-space-7: 28px;   /* espacio entre columnas */
  --rd-space-11: 44px;  /* margen lateral de pantalla */

  /* ---- Movimiento ---- */
  --rd-flow: 1.2s;      /* una vuelta de la luz que recorre una línea activa */
}

/*
 * Montu · primitivas de UI. Toda pantalla se arma con estas clases.
 * Depende de tokens.css (cargarlo antes). No se redefinen acá colores ni tipografías: solo var(--rd-*).
 * Cada primitiva está documentada en design/DESIGN.md y se ve funcionando en design/reference.html.
 */

/* ---------- Página ---------- */
.rd-page {
  position: relative;
  min-height: 100vh;
  box-sizing: border-box;
  overflow: hidden;
  background: var(--rd-bg);
  color: var(--rd-ink);
  font-family: var(--rd-font);
  font-size: var(--rd-text-body);
  font-weight: var(--rd-weight-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.rd-page *, .rd-page *::before, .rd-page *::after { box-sizing: border-box; }
.rd-page__inner {
  position: relative;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) var(--rd-space-11) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width: 900px) {
  .rd-page__inner { padding-left: var(--rd-space-11); padding-right: var(--rd-space-11); }
}

/* ---------- Aura: cuatro manchas de color difuminadas detrás de todo. Una por pantalla. ---------- */
.rd-aura { position: absolute; inset: 0; pointer-events: none; }
.rd-aura i { position: absolute; border-radius: 50%; }
.rd-aura i:nth-child(1) { left: 6%;  top: 31%; width: 36%; aspect-ratio: 1; background: var(--rd-aura-blue);   opacity: 0.30; filter: blur(110px); }
.rd-aura i:nth-child(2) { left: 29%; top: 44%; width: 36%; aspect-ratio: 1; background: var(--rd-aura-violet); opacity: 0.26; filter: blur(120px); }
.rd-aura i:nth-child(3) { left: 53%; top: 19%; width: 32%; aspect-ratio: 1; background: var(--rd-aura-pink);   opacity: 0.22; filter: blur(120px); }
.rd-aura i:nth-child(4) { left: 72%; top: 58%; width: 29%; aspect-ratio: 1; background: var(--rd-aura-orange); opacity: 0.24; filter: blur(120px); }

/* ---------- Barra superior ---------- */
.rd-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--rd-space-4); flex-wrap: wrap; padding-top: 26px; }
.rd-brand { display: inline-flex; align-items: center; gap: var(--rd-space-3); font-size: var(--rd-text-brand); font-weight: var(--rd-weight); letter-spacing: -0.02em; color: inherit; text-decoration: none; }
.rd-mark { width: 40px; height: 40px; flex: 0 0 auto; display: block; }

/* ---------- Texto ---------- */
.rd-hero { margin: 0; font-size: clamp(36px, 4.4vw, var(--rd-text-hero)); font-weight: var(--rd-weight); letter-spacing: var(--rd-track-hero); line-height: 1.04; text-wrap: balance; }
.rd-title { margin: 0; font-size: var(--rd-text-title); font-weight: var(--rd-weight); letter-spacing: var(--rd-track-title); line-height: 1.22; }
.rd-label { font-size: var(--rd-text-small); font-weight: var(--rd-weight); color: var(--rd-muted); }
.rd-note { font-size: var(--rd-text-small); color: var(--rd-muted); line-height: 1.35; }
.rd-gradient-text { background: var(--rd-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Vidrio: la superficie de toda tarjeta, chip y píldora ---------- */
.rd-glass {
  background: var(--rd-glass);
  -webkit-backdrop-filter: var(--rd-glass-blur);
  backdrop-filter: var(--rd-glass-blur);
  border: 1px solid var(--rd-glass-border);
  box-shadow: var(--rd-shadow-card);
}

/* ---------- Tarjeta ---------- */
.rd-card { display: flex; flex-direction: column; gap: var(--rd-space-2); padding: 22px var(--rd-space-6) var(--rd-space-6); border-radius: var(--rd-radius-card); min-width: 0; }
.rd-card--split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; padding: 0; }
.rd-card--split > * { display: flex; flex-direction: column; gap: 6px; padding: 22px var(--rd-space-6); min-width: 0; }
.rd-card--split > * + * { border-left: 1px solid var(--rd-hairline); }

/* ---------- Tarjeta de decisión: la única con borde degradado. Una por pantalla. ---------- */
.rd-decision { padding: var(--rd-ring); border-radius: calc(var(--rd-radius-card) + 2px); background: var(--rd-gradient); box-shadow: var(--rd-shadow-glow); }
.rd-decision__body { display: flex; flex-direction: column; gap: var(--rd-space-4); padding: var(--rd-space-6) 26px 26px; border-radius: calc(var(--rd-radius-card) + 0.5px); background: var(--rd-glass-solid); }
.rd-decision__label { align-self: flex-start; font-size: var(--rd-text-small); font-weight: var(--rd-weight); }
.rd-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Botón: píldora. Primario negro, secundario gris translúcido. Nada más. ---------- */
.rd-button { flex: 1 1 120px; height: 46px; padding: 0 var(--rd-space-6); border: 0; border-radius: var(--rd-radius-pill); font-family: inherit; font-size: var(--rd-text-name); font-weight: var(--rd-weight); cursor: pointer; background: var(--rd-ink); color: var(--rd-on-ink); }
.rd-button--quiet { background: var(--rd-fill-soft); color: var(--rd-ink); }
.rd-button:focus-visible { outline: 2px solid var(--rd-g2); outline-offset: 3px; }

/* ---------- Número grande tipo Apple Health: número + unidad chica y gris ---------- */
.rd-stat { font-family: var(--rd-font-num); font-size: var(--rd-text-num); font-weight: var(--rd-weight); letter-spacing: var(--rd-track-num); line-height: 1; font-variant-numeric: tabular-nums; }
.rd-stat__unit { font-size: var(--rd-text-unit); color: var(--rd-muted); letter-spacing: 0; margin: 0 6px 0 3px; }
.rd-stat-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.rd-stat-row__arrow { font-family: var(--rd-font-num); font-size: 22px; color: var(--rd-faint); }

/* ---------- Chip y píldora de estado ---------- */
.rd-chip { display: inline-flex; align-items: center; gap: var(--rd-space-2); padding: 6px var(--rd-space-3); border-radius: var(--rd-radius-pill); font-size: var(--rd-text-small); font-weight: var(--rd-weight); white-space: nowrap; }
.rd-chip--status { padding: 8px 14px; }
.rd-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rd-live); flex: 0 0 auto; }

/* ---------- Persona: cara + nombre + estado. Siempre juntos. ---------- */
.rd-face { width: 92px; height: 92px; border-radius: 50%; display: block; box-shadow: var(--rd-shadow-face); }
.rd-face--small { width: 72px; height: 72px; }
.rd-face--tiny { width: 40px; height: 40px; box-shadow: none; }
.rd-person { display: flex; flex-direction: column; line-height: 1.3; }
.rd-person__name { font-size: var(--rd-text-name); font-weight: var(--rd-weight); letter-spacing: -0.01em; }
.rd-person__status { font-size: var(--rd-text-small); color: var(--rd-muted); }

/* ---------- Grafo de agentes (EN TRABAJO: ver DESIGN.md § Grafo) ---------- */
.rd-graph { position: relative; }
.rd-graph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.rd-edge { fill: none; stroke: var(--rd-edge-idle); stroke-width: 1; }
.rd-edge--live { stroke: url(#rd-live); stroke-width: 3.5; stroke-linecap: round; }
.rd-edge--glow { stroke: url(#rd-live); stroke-width: 12; stroke-linecap: round; opacity: 0.35; filter: blur(7px); }
.rd-edge--spark { stroke: var(--rd-on-ink); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1 30; animation: rd-flow var(--rd-flow) linear infinite; }
.rd-node { position: absolute; width: 0; height: 0; }
.rd-node > .rd-face { position: absolute; transform: translate(-50%, -50%); }
.rd-node > .rd-person { position: absolute; width: 180px; }
.rd-node--top > .rd-person { left: -90px; bottom: 56px; text-align: center; }
.rd-node--bottom > .rd-person { left: -90px; top: 56px; text-align: center; }
.rd-node--right > .rd-person { left: 60px; top: -22px; }
.rd-node--left > .rd-person { right: 60px; top: -22px; text-align: right; }
.rd-graph > .rd-chip { position: absolute; transform: translate(-50%, -50%); }

@keyframes rd-flow { to { stroke-dashoffset: -31; } }
@media (prefers-reduced-motion: reduce) { .rd-edge--spark { animation: none; } }

/* ---------- Disposición: red a la izquierda, columna de tarjetas a la derecha ---------- */
.rd-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--rd-space-7); padding-top: 34px; }
@media (min-width: 1100px) { .rd-layout { grid-template-columns: minmax(0, 1fr) 392px; } }
.rd-stack { display: flex; flex-direction: column; gap: var(--rd-space-4); min-width: 0; }

/* ---------- Formulario y listas (pantallas de configuración) ---------- */
.rd-input { height: 46px; padding: 0 var(--rd-space-4); border: 1px solid var(--rd-hairline); border-radius: var(--rd-radius-pill); font: inherit; font-size: var(--rd-text-body); background: var(--rd-glass-solid); color: var(--rd-ink); min-width: 0; }
.rd-input:focus-visible { outline: 2px solid var(--rd-g2); outline-offset: 2px; }
.rd-row { display: flex; align-items: center; justify-content: space-between; gap: var(--rd-space-4); padding: var(--rd-space-3) 0; }
.rd-row + .rd-row { border-top: 1px solid var(--rd-hairline); }
.rd-code { font-family: var(--rd-font-mono); font-size: var(--rd-text-small); word-break: break-all; padding: var(--rd-space-3) var(--rd-space-4); border-radius: var(--rd-space-4); background: var(--rd-fill-soft); }

/* ---------- Reproducción de una escena ---------- */
.rd-player {
  display: flex;
  align-items: center;
  gap: var(--rd-space-4);
  border-top: 1px solid var(--rd-hairline);
  padding: var(--rd-space-4) 0;
}
.rd-player .rd-button { flex: none; }
.rd-player__position { flex: 1; height: 4px; background: var(--rd-fill-soft); border-radius: var(--rd-radius-pill); overflow: hidden; }
.rd-player__position > span { display: block; height: 100%; background: var(--rd-ink); transform-origin: left; }
.rd-player__time { color: var(--rd-muted); font-size: var(--rd-text-small); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Objeto táctil sobre una conexión. El dibujo interno sigue la caja del host. */
.rd-mini { display: inline-block; width: var(--mini-size, 72px); aspect-ratio: 1; }
a.rd-mini-link { color: inherit; text-decoration: none; }
a.rd-mini-link:focus-visible { outline: 2px solid var(--rd-ink); outline-offset: 3px; border-radius: var(--rd-space-2); }

/* ---------- Teléfono ---------- */
@media (max-width: 700px) {
  .rd-chip--status { white-space: normal; }
  .rd-face { width: 56px; height: 56px; }
  .rd-face--small { width: 44px; height: 44px; }
  .rd-node > .rd-person { width: 110px; }
  .rd-node--top > .rd-person { left: -55px; bottom: 34px; }
  .rd-node--bottom > .rd-person, .rd-node--right > .rd-person, .rd-node--left > .rd-person { left: -55px; right: auto; top: 34px; text-align: center; }
  .rd-person__status { display: none; }
  .rd-graph > .rd-chip { display: none; }
}
