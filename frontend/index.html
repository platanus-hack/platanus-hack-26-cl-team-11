<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Montu</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      addEventListener(
        'error',
        function (event) {
          var source = event.target && (event.target.src || event.target.href);
          if (!source || source.indexOf('/assets/') < 0) return;
          try {
            if (Date.now() - Number(sessionStorage.getItem('montu-recarga')) < 30000) return;
            sessionStorage.setItem('montu-recarga', String(Date.now()));
          } catch (failure) {
            return;
          }
          location.reload();
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
